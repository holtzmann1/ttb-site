<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Текущая кампания — Through the Breach</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #120f0c;
            background-image: 
                radial-gradient(circle at 50% 20%, #1e1812 0%, #120f0c 70%, #0a0806 100%),
                repeating-linear-gradient(0deg, rgba(40, 32, 24, 0.2) 0px, rgba(40, 32, 24, 0.2) 1px, transparent 1px, transparent 28px);
            color: #dfd4c4;
            font-family: Georgia, 'Times New Roman', serif;
            padding-bottom: 60px;
        }

        /* ==========================================================================
           ШАПКА
           ========================================================================== */
        header {
            padding: 16px 40px;
            border-bottom: 2px solid #3d2d1e;
            background: rgba(18, 15, 12, 0.96);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.85);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-back {
            color: #c7a877;
            text-decoration: none;
            letter-spacing: 1.5px;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            background: none;
            border: none;
            font-family: Georgia, serif;
            padding: 0;
            transition: color 0.2s;
        }
        .nav-back:hover { color: #f2ece2; }

        .page-title {
            color: #c7a877;
            font-size: 18px;
            letter-spacing: 3px;
            margin: 0;
            font-weight: normal;
            text-align: center;
            text-transform: uppercase;
        }

        .action-btn, .tab-btn {
            background: #241c16;
            border: 1px solid #6b5239;
            color: #cbbca9;
            padding: 7px 15px;
            font-family: Georgia, serif;
            font-size: 11.5px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn { color: #c7a877; }
        .action-btn:hover, .tab-btn:hover {
            background: #36291e;
            border-color: #a8885a;
            color: #f2ece2;
        }

        .tab-btn.active {
            background: #36291e;
            border-color: #c7a877;
            color: #f2ece2;
            box-shadow: inset 0 0 0 1px #c7a877;
        }

        /* ==========================================================================
           ЭКРАН 1: ТЕКУЩАЯ КАМПАНИЯ (РОСТЕР С ФОНОВЫМ АРТОМ)
           ========================================================================== */
        #view-campaign {
            display: block;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 15px 20px;
        }

        .campaign-subbar {
            color: #8f8171;
            font-size: 12.5px;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
            border-bottom: 1px solid #2a2017;
            padding-bottom: 8px;
        }

        /* Сцена с фоновой картинкой testfon.jpg */
        .roster-stage {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        /* Холст персонажа строго под пропорции арта */
        .roster-art-canvas {
            position: relative;
            width: 100%;
            max-width: 650px;
            aspect-ratio: 1024 / 1536;
            background-image: url('testfon.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.95), 0 0 80px rgba(0, 0, 0, 0.8) inset;
            border: 1px solid #3d2d1e;
        }

        /* Интерактивный хитбокс по силуэту персонажа */
        .char-hitbox {
            position: absolute;
            left: 20%;
            top: 6%;
            width: 60%;
            height: 92%;
            cursor: pointer;
            z-index: 10;
            transition: background 0.3s ease;
        }

        /* Лёгкое викторианское свечение при наведении на персонажа */
        .char-hitbox:hover {
            background: radial-gradient(ellipse at 50% 40%, rgba(199, 168, 119, 0.12) 0%, transparent 75%);
        }

        /* Табличка персонажа (над головой) */
        .char-plate {
            position: absolute;
            top: -4px;
            left: 50%;
            transform: translate(-50%, -100%);
            width: 290px;
            background: rgba(24, 18, 13, 0.94);
            border: 1px solid #6b5239;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.9);
            padding: 10px 14px;
            box-sizing: border-box;
            transition: all 0.25s ease;
            pointer-events: auto;
            text-align: left;
        }

        .char-hitbox:hover .char-plate {
            border-color: #c7a877;
            box-shadow: 0 0 20px rgba(199, 168, 119, 0.35), 0 8px 30px rgba(0, 0, 0, 0.95);
            background: rgba(32, 24, 18, 0.98);
        }

        .plate-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
            border-bottom: 1px solid #3d2d1e;
            padding-bottom: 4px;
        }

        .plate-title {
            color: #c7a877;
            font-size: 13.5px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .plate-player {
            color: #8f8171;
            font-size: 11px;
            font-style: italic;
        }

        .plate-info {
            font-size: 11.5px;
            color: #cfc2b0;
            line-height: 1.45;
            margin-bottom: 8px;
        }

        .plate-actions {
            display: flex;
            gap: 6px;
        }

        .btn-plate-open {
            flex-grow: 1;
            background: #241c16;
            border: 1px solid #6b5239;
            color: #c7a877;
            padding: 6px 10px;
            font-family: Georgia, serif;
            font-size: 10.5px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-plate-open:hover, .char-hitbox:hover .btn-plate-open {
            background: #36291e;
            border-color: #c7a877;
            color: #ffffff;
        }

        .btn-plate-del {
            background: #241c16;
            border: 1px solid #6b5239;
            color: #8f8171;
            width: 28px;
            padding: 0;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-plate-del:hover {
            border-color: #a83232;
            color: #ff8080;
            background: rgba(168, 50, 50, 0.2);
        }

        /* ==========================================================================
           ЭКРАН 2: ЛИСТ ПЕРСОНАЖА (ЧАРНИК С 6 ВКЛАДКАМИ)
           ========================================================================== */
        #view-sheet {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            padding: 25px 20px 40px 20px;
        }

        .tab-bar {
            margin: 0 auto 25px auto;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Стили жетонов мастей */
        .suit-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 7px 2px 5px;
            border-radius: 2px;
            font-size: 10.5px;
            font-weight: bold;
            letter-spacing: 0.8px;
            line-height: 1;
            vertical-align: middle;
            text-transform: uppercase;
            user-select: none;
            box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.2);
            margin: 0 3px 0 0;
            border: 1px solid transparent;
        }
        .suit-chip svg {
            width: 13px;
            height: 13px;
            display: block;
            flex-shrink: 0;
        }
        .suit-chip.suit-rams  { color: #9c231d; background: rgba(160, 40, 30, 0.12); border-color: rgba(160, 40, 30, 0.45); }
        .suit-chip.suit-masks { color: #692d84; background: rgba(105, 45, 132, 0.12); border-color: rgba(105, 45, 132, 0.45); }
        .suit-chip.suit-crows { color: #1c6b2e; background: rgba(28, 107, 46, 0.12); border-color: rgba(28, 107, 46, 0.45); }
        .suit-chip.suit-tomes { color: #1f5780; background: rgba(31, 87, 128, 0.12); border-color: rgba(31, 87, 128, 0.45); }

        .badge-flip-pos {
            color: #196628;
            font-weight: bold;
            font-family: monospace;
            border: 1px solid rgba(25, 102, 40, 0.45);
            background: rgba(25, 102, 40, 0.12);
            padding: 0 4px;
            border-radius: 2px;
            font-size: 11px;
            display: inline-block;
            line-height: 1.2;
            vertical-align: middle;
        }

        /* Карточка союзника: 4-колоночный бежевый книжный статблок */
        #allies-site-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 520px));
            gap: 24px;
            align-items: start;
            width: 100%;
        }

        .ally-site-card {
            width: 100%;
            max-width: 520px;
            margin: 0;
            border: 1px solid #735d46;
            background: #f7f1e5;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85), 0 2px 6px rgba(0, 0, 0, 0.4);
            font-family: Georgia, 'Times New Roman', serif;
            box-sizing: border-box;
            color: #261c14;
        }

        .ally-site-header {
            background: #1e1610;
            padding: 12px 16px 10px 16px;
            border-bottom: 3px solid #8c6a43;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .ally-site-title {
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin: 0;
            line-height: 1.2;
        }

        .ally-site-subtitle {
            font-size: 13px;
            color: #dfd2be;
            font-style: italic;
            margin-top: 3px;
            line-height: 1.3;
        }

        .ally-site-ctrls {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-site-ctrl {
            background: #2a2018;
            border: 1px solid #73583e;
            color: #d6ab6f;
            cursor: pointer;
            padding: 4px 9px;
            font-size: 11px;
            font-family: Georgia, serif;
            letter-spacing: 0.5px;
            transition: all 0.15s ease;
        }
        .btn-site-ctrl:hover {
            border-color: #d6ab6f;
            color: #ffffff;
            background: #473525;
        }

        .btn-site-del { color: #b59f8c; }
        .btn-site-del:hover {
            color: #ff9e9e;
            border-color: #d9534f;
            background: rgba(217, 83, 79, 0.25);
        }

        .beige-stat-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            text-align: center;
            background: #fcf9f2;
            border-bottom: 3px solid #8c6a43;
        }

        .beige-stat-table td {
            border: 1px solid #947e65;
            padding: 7px 4px 8px 4px;
            vertical-align: top;
        }

        .stat-name {
            font-size: 12.5px;
            font-style: italic;
            color: #4a3422;
            line-height: 1.25;
            margin-top: 1px;
        }

        .stat-val {
            font-size: 16.5px;
            font-weight: bold;
            color: #1a120b;
            line-height: 1.2;
            margin-bottom: 6px;
        }

        .stat-val-last { margin-bottom: 1px; }

        .stat-row-derived td {
            border-top: 2px solid #735a40 !important;
            background: #f7f1e5;
        }

        .ally-site-body {
            padding: 13px 16px 18px 16px;
            font-size: 12.5px;
            color: #261b12;
            line-height: 1.48;
            background: #f7f1e5;
        }

        .ally-skills-block {
            margin-bottom: 11px;
            padding-bottom: 10px;
            border-bottom: 1px solid #99836c;
        }
        .ally-skills-block strong { color: #1a120c; font-size: 13px; }

        .ally-abilities-block {
            margin-bottom: 13px;
            padding-bottom: 11px;
            border-bottom: 1px solid #99836c;
        }

        .ally-site-item {
            margin-bottom: 8px;
            line-height: 1.45;
            color: #261b12;
        }
        .ally-site-item strong { color: #140d07; font-size: 13px; }

        .ally-attack-box {
            margin-top: 11px;
            border: 1px solid #947e65;
            background: #fcf9f2;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }
        .ally-attack-box:first-child { margin-top: 4px; }

        .ally-attack-head {
            background: #e8dcce;
            padding: 5px 10px;
            border-bottom: 1px solid #947e65;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ally-attack-title {
            color: #1f140b;
            font-weight: bold;
            font-size: 13px;
        }

        .ally-attack-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 11px;
            text-align: center;
            background: #fffdf9;
            border-bottom: 1px solid #947e65;
        }
        .ally-attack-table th {
            padding: 4px 2px;
            color: #4a3422;
            font-weight: bold;
            border-right: 1px solid #ab977e;
            background: #efe5d6;
            font-size: 10.5px;
        }
        .ally-attack-table td {
            padding: 5px 2px;
            color: #140d07;
            font-weight: bold;
            font-size: 13.5px;
            border-right: 1px solid #ab977e;
        }
        .ally-attack-table th:last-child, .ally-attack-table td:last-child { border-right: none; }

        .ally-attack-triggers {
            padding: 7px 10px;
            font-size: 12px;
            line-height: 1.45;
            background: #f7f1e5;
        }

        .ally-trigger-row {
            color: #2b1d14;
            border-top: 1px dashed #b5a088;
            padding-top: 4px;
            margin-top: 4px;
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 3px;
        }
        .ally-trigger-row:first-child { border-top: none; padding-top: 0; margin-top: 0; }

        .ally-site-edit {
            display: none;
            padding: 14px;
            background: #f0e6d6;
            border-top: 1px solid #8c6a43;
            color: #261c14;
        }

        .edit-row { margin-bottom: 10px; }
        .edit-row label {
            display: block;
            font-size: 11px;
            color: #523820;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .ally-site-edit input.edit-input {
            width: 100%;
            background: #fffdf9 !important;
            border: 1px solid #9e866e !important;
            color: #1a120b !important;
            padding: 6px 8px;
            font-size: 12.5px;
            font-family: Georgia, serif;
            outline: none;
        }
        .ally-site-edit input.edit-input:focus {
            border-color: #5c3c1e !important;
            background: #ffffff !important;
        }

        .edit-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 6px;
            text-align: center;
        }
        .edit-grid-4 label { font-size: 9.5px; color: #634730; margin-bottom: 2px; }
        .edit-grid-4 input { text-align: center; font-weight: bold; padding: 4px 2px; }

        .ally-site-edit textarea.edit-textarea {
            width: 100%;
            min-height: 70px;
            background: #fffdf9 !important;
            border: 1px solid #9e866e !important;
            color: #1a120b !important;
            padding: 6px 8px;
            font-size: 12px;
            font-family: Georgia, serif;
            line-height: 1.45;
            resize: vertical;
            outline: none;
        }
        .ally-site-edit textarea.edit-textarea:focus {
            border-color: #5c3c1e !important;
            background: #ffffff !important;
        }

        .suit-quick-bar {
            display: flex;
            gap: 4px;
            margin-bottom: 4px;
            align-items: center;
        }
        .btn-quick-suit {
            background: #e2d3c0;
            border: 1px solid #8c7258;
            color: #3b2817;
            padding: 2px 6px;
            font-size: 10px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }
        .btn-quick-suit:hover {
            border-color: #3b2817;
            background: #cfbeaa;
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ НАВИГАЦИЯ -->
    <header>
        <button type="button" class="nav-back" id="btn-back-stage" onclick="showCampaignRoster()">← НА ГЛАВНУЮ</button>
        <h1 class="page-title" id="header-title">ТЕКУЩАЯ КАМПАНИЯ</h1>
        <div style="display: flex; gap: 8px;">
            <button type="button" class="action-btn" id="btn-header-action">+ ДОБАВИТЬ ПЕРСОНАЖА (.JSON)</button>
        </div>
    </header>

    <!-- =====================================================================
         ВИД 1: ЭКРАН ТЕКУЩЕЙ КАМПАНИИ (С АРТОМ testfon.jpg И ТАБЛИЧКОЙ НАД ГОЛОВОЙ)
         ===================================================================== -->
    <main id="view-campaign">
        <div class="campaign-subbar">Отряд: 1 персонаж(ей)</div>

        <div class="roster-stage">
            <!-- Холст с фоном testfon.jpg -->
            <div class="roster-art-canvas">
                
                <!-- Хитбокс силуэта персонажа -->
                <div class="char-hitbox" onclick="showCharacterSheet()">
                    
                    <!-- Табличка строго над головой -->
                    <div class="char-plate" onclick="event.stopPropagation(); showCharacterSheet();">
                        <div class="plate-header">
                            <span class="plate-title">Генриетта фон Ширах</span>
                            <span class="plate-player">Player: Крис</span>
                        </div>
                        <div class="plate-info">
                            <div>Pursuit: Roastmaster/Gunner</div>
                            <div>Species: Fated, Human</div>
                            <div>Exp: 3 | Scrip: 65.5</div>
                        </div>
                        <div class="plate-actions">
                            <button type="button" class="btn-plate-open" onclick="showCharacterSheet()">ОТКРЫТЬ ЧАРНИК</button>
                            <button type="button" class="btn-plate-del" onclick="event.stopPropagation(); alert('Удаление персонажа')">✕</button>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </main>

    <!-- =====================================================================
         ВИД 2: ЛИСТ ПЕРСОНАЖА (6 ВКЛАДОК, ВКЛЮЧАЯ ALLIES)
         ===================================================================== -->
    <main id="view-sheet">
        <div class="tab-bar">
            <button class="tab-btn" onclick="alert('Вкладка Character')">CHARACTER</button>
            <button class="tab-btn" onclick="alert('Вкладка General Talents')">GENERAL TALENTS</button>
            <button class="tab-btn" onclick="alert('Вкладка Pursuit')">PURSUIT</button>
            <button class="tab-btn" onclick="alert('Вкладка Equipment')">EQUIPMENT</button>
            <button class="tab-btn active">ALLIES</button>
            <button class="tab-btn" onclick="alert('Вкладка Bio')">BIO</button>
        </div>

        <div style="max-width: 1150px; margin: 0 auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #382b1d; padding-bottom: 12px;">
                <h3 style="margin: 0; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; color: #c59a5b; font-weight: normal;">
                    SUBORDINATES & ALLIES
                </h3>
                <button type="button" class="action-btn" onclick="addNewAllyFromTemplate()" style="font-size: 11px; padding: 6px 14px;">
                    + ADD ALLY
                </button>
            </div>

            <div id="allies-site-list"></div>
        </div>
    </main>

    <script>
        /* Переключение между экраном кампании и чарником */
        function showCampaignRoster() {
            document.getElementById('view-campaign').style.display = 'block';
            document.getElementById('view-sheet').style.display = 'none';
            document.getElementById('header-title').textContent = 'ТЕКУЩАЯ КАМПАНИЯ';
            document.getElementById('btn-back-stage').textContent = '← НА ГЛАВНУЮ';
            document.getElementById('btn-header-action').textContent = '+ ДОБАВИТЬ ПЕРСОНАЖА (.JSON)';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showCharacterSheet() {
            document.getElementById('view-campaign').style.display = 'none';
            document.getElementById('view-sheet').style.display = 'block';
            document.getElementById('header-title').textContent = 'ГЕНРИЕТТА ФОН ШИРАХ';
            document.getElementById('btn-back-stage').textContent = '← НАЗАД К ОТРЯДУ';
            document.getElementById('btn-header-action').textContent = '💾 СОХРАНИТЬ В ОБЛАКО';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /* Масти Malifaux */
        const SUIT_SVGS = {
            rams: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4C8 4 4 6 2 10c-1 2-1 4 0 6 1 1 3 1 4 0 1-1 1-3 0-5 2-1 4-1 6 1 2-2 4-2 6-1-1 2-1 4 0 5 1 1 3 1 4 0 1-2 1-4 0-6-2-4-6-6-10-6zm0 5c1.66 0 3 1.34 3 3l-1.5 5h-3L9 12c0-1.66 1.34-3 3-3z"/></svg>',
            crows: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 9c-.3-.5-1-.7-1.5-.4L16 11l-3-6c-.3-.6-1-.8-1.6-.5L7 7 3.5 5.5C3 5.3 2.4 5.5 2.2 6c-.2.5 0 1.1.5 1.3L6 9l-3 4c-.4.5-.3 1.2.2 1.6l4 3 1 4.5c.1.6.7 1 1.3.8.6-.1 1-.7.8-1.3L9.5 18l5-3 5.5 1.5c.6.2 1.2-.2 1.3-.8.2-.6-.2-1.2-.8-1.3L16 13l5-3c.6-.3.8-.9.5-1z"/></svg>',

        function getSuitBadge(suit) {
            const s = suit.toLowerCase();
            const label = s.toUpperCase();
            return '<span class="suit-chip suit-' + s + '">' + (SUIT_SVGS[s] || '') + ' ' + label + '</span>';
        }

        function formatBookText(text) {
            if (!text) return "";
            return text
                .replace(/ RAMS /g, getSuitBadge('rams'))
                .replace(/ MASKS /g, getSuitBadge('masks'))
                .replace(/ CROWS /g, getSuitBadge('crows'))
                .replace(/ TOMES /g, getSuitBadge('tomes'))
                .replace(/:r:/g, getSuitBadge('rams'))
                .replace(/:m:/g, getSuitBadge('masks'))
                .replace(/:c:/g, getSuitBadge('crows'))
                .replace(/:t:/g, getSuitBadge('tomes'))
                .replace(/\[\+\]|:\+:/g, '<span class="badge-flip-pos">[+]</span>');
        }

        function renderAbilitiesHtml(text) {
            if (!text) return "";
            const lines = text.split("\n").filter(l => l.trim().length > 0);
            return lines.map(line => {
                const colonIdx = line.indexOf(':');
                if (colonIdx !== -1) {
                    const title = line.substring(0, colonIdx).trim();
                    const desc = line.substring(colonIdx + 1).trim();
                    return '<div class="ally-site-item"><strong>' + title + ':</strong> ' + formatBookText(desc) + '</div>';
                }
                return '<div class="ally-site-item">' + formatBookText(line) + '</div>';
            }).join('');
        }

        function renderActionsHtml(text) {
            if (!text) return "";
            const blocks = text.split(/\n\s*\n/);
            return blocks.map(block => {
                const lines = block.split("\n").map(l => l.trim()).filter(Boolean);
                if (lines.length === 0) return '';
                
                let title = lines[0];
                let av = '—', rg = '—', resist = '—', dmg = '—';
                let triggers = [];

                for (let i = 1; i < lines.length; i++) {
                    const l = lines[i];
                    if (l.includes('AV:') || l.includes('Rg:') || l.includes('Resist:')) {
                        const mAv = l.match(/AV:\s*([^|]+)/i);
                        const mRg = l.match(/Rg:\s*([^|]+)/i);
                        const mRes = l.match(/Resist:\s*([^|]+)/i);
                        const mDmg = l.match(/Dmg:\s*([^|]+)|Damage:\s*([^|]+)/i);

                        if (mAv) av = mAv[1].trim();
                        if (mRg) rg = mRg[1].trim();
                        if (mRes) resist = mRes[1].trim();
                        if (mDmg) dmg = (mDmg[1] || mDmg[2]).trim();
                    } else if (l.toLowerCase().startsWith('target suffers') || l.toLowerCase().startsWith('damage:')) {
                        dmg = l.replace(/^target suffers\s*/i, '').replace(/^damage:\s*/i, '').replace(/\s*damage\.?/i, '').trim();
                    } else {
                        triggers.push(l);
                    }
                }

                const hasStats = (av !== '—' || rg !== '—' || resist !== '—' || dmg !== '—');

                let statsTable = '';
                if (hasStats) {
                    statsTable = '<table class="ally-attack-table">' +
                        '<thead><tr><th>AV</th><th>RANGE</th><th>RESIST</th><th>DAMAGE</th></tr></thead>' +
                        '<tbody><tr><td>' + av + '</td><td>' + rg + '</td><td>' + resist + '</td><td>' + dmg + '</td></tr></tbody>' +
                        '</table>';
                }

                let triggersHtml = '';
                if (triggers.length > 0) {
                    triggersHtml = '<div class="ally-attack-triggers">' +
                        triggers.map(t => '<div class="ally-trigger-row">' + formatBookText(t) + '</div>').join('') +
                        '</div>';
                }

                return '<div class="ally-attack-box">' +
                    '<div class="ally-attack-head"><span class="ally-attack-title">' + title + '</span></div>' +
                    statsTable + triggersHtml +
                    '</div>';
            }).join('');
        }

        function cancelAllyEdit(cardId) {
            const card = document.getElementById(cardId);
            if (!card) return;
            if (card.dataset.isNew === 'true') {
                card.remove();
            } else {
                wrapper.dataset.isNew = 'false';
                toggleEditMode(cardId);
            }

        function toggleEditMode(cardId) {
            const card = document.getElementById(cardId);
            if (!card) return;
            const viewPanel = card.querySelector('.ally-site-view');
            const editPanel = card.querySelector('.ally-site-edit');
            const isEditing = editPanel.style.display === 'block';

            if (isEditing) {
                editPanel.style.display = 'none';
                viewPanel.style.display = 'block';
            } else {
                editPanel.style.display = 'block';
                viewPanel.style.display = 'none';
            }
        }

        function insertCode(cardId, code) {
            const card = document.getElementById(cardId);
            if (!card) return;
            const textarea = card.querySelector('.inp-actions');
            if (!textarea) return;

            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const val = textarea.value;
            textarea.value = val.substring(0, start) + code + ' ' + val.substring(end);
            textarea.focus();
            textarea.selectionStart = textarea.selectionEnd = start + code.length + 1;
        }
