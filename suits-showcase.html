<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allies Sandbox — Through the Breach</title>
    <script src="suits.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #120f0c;
            background-image: 
                radial-gradient(circle at 50% 20%, #1e1812 0%, #120f0c 70%, #0a0806 100%),
                repeating-linear-gradient(0deg, rgba(40, 32, 24, 0.2) 0px, rgba(40, 32, 24, 0.2) 1px, transparent 1px, transparent 28px);
            color: #dfd4c4;
            font-family: Georgia, 'Times New Roman', serif;
            padding-bottom: 60px;
        }

        header {
            padding: 18px 40px;
            border-bottom: 2px solid #3d2d1e;
            background: rgba(18, 15, 12, 0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.85);
        }

        .nav-back {
            color: #c7a877;
            text-decoration: none;
            letter-spacing: 1.5px;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            background: none;
            border: none;
            font-family: Georgia, serif;
            padding: 0;
            transition: color 0.2s;
        }
        .nav-back:hover { color: #f2ece2; }

        .page-title {
            color: #c7a877;
            font-size: 19px;
            letter-spacing: 2.5px;
            margin: 0;
            font-weight: normal;
            text-align: center;
        }

        .action-btn, .tab-btn {
            background: #241c16;
            border: 1px solid #6b5239;
            color: #cbbca9;
            padding: 8px 16px;
            font-family: Georgia, serif;
            font-size: 11.5px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn { color: #c7a877; }
        .action-btn:hover, .tab-btn:hover {
            background: #36291e;
            border-color: #a8885a;
            color: #f2ece2;
        }

        .tab-btn.active {
            background: #36291e;
            border-color: #c7a877;
            color: #f2ece2;
            box-shadow: inset 0 0 0 1px #c7a877;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px 40px 20px;
        }

        .tab-bar {
            margin: 0 auto 25px auto;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* Поля ввода и базовые стили */
        input[type="text"], input[type="number"], select, textarea {
            background: #14110e;
            border: 1px solid #4a3825;
            color: #e8dfd0;
            font-family: Georgia, serif;
            font-size: 15px;
            padding: 8px 10px;
            outline: none;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #b88a4a;
        }

        /* ==========================================================================
           ALLIES: ТОЧНЫЕ СТИЛИ ИЗ CAMPAIGN.HTML
           ========================================================================== */
        .ally-v1-card {
            width: 100%;
            background: rgba(14, 11, 9, 0.95);
            border: 1px solid #3d2f21;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.85);
            font-family: Georgia, serif;
        }

        .ally-v1-header {
            background: #201914;
            border-bottom: 1px solid #382b1d;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ally-toggle-btn {
            background: transparent;
            border: 1px solid #4a3825;
            color: #c59a5b;
            cursor: pointer;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .ally-toggle-btn:hover {
            border-color: #c59a5b;
            background: #2b2118;
        }

        .ally-input-title {
            background: transparent;
            border: none;
            border-bottom: 1px solid transparent;
            font-size: 16px;
            font-weight: bold;
            color: #e8dfd0;
            letter-spacing: 0.5px;
            font-family: Georgia, serif;
            width: 100%;
        }
        .ally-input-title:focus {
            outline: none;
            border-bottom-color: #8c714b;
        }

        .ally-input-sub {
            background: transparent;
            border: none;
            border-bottom: 1px solid transparent;
            font-size: 11.5px;
            font-style: italic;
            color: #8f8679;
            font-family: Georgia, serif;
            width: 100%;
        }
        .ally-input-sub:focus {
            outline: none;
            border-bottom-color: #8c714b;
        }

        .ally-v1-btn-del {
            background: transparent;
            border: 1px solid #382b1d;
            color: #8f8679;
            cursor: pointer;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .ally-v1-btn-del:hover {
            background: rgba(229, 115, 115, 0.15);
            border-color: #e57373;
            color: #e57373;
        }

        .ally-card-body {
            padding: 12px 14px;
        }

        .ally-v1-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            text-align: center;
            background: #14110e;
            border: 1px solid #382b1d;
            margin-bottom: 8px;
        }
        .ally-v1-table th, .ally-v1-table td {
            border: 1px solid #382b1d;
            padding: 3px 2px;
        }
        .ally-v1-table th {
            font-weight: bold;
            color: #c59a5b;
            font-size: 11px;
            background: #251d16;
            letter-spacing: 0.5px;
        }
        .ally-input-stat {
            width: 100%;
            background: transparent;
            border: none;
            text-align: center;
            font-size: 13.5px;
            font-weight: bold;
            color: #e8dfd0;
            font-family: Georgia, serif;
        }
        .ally-input-stat:focus {
            outline: none;
            background: rgba(140, 113, 75, 0.15);
        }

        .ally-v1-row {
            border-top: 1px dashed #2d2216;
            padding-top: 8px;
            margin-top: 8px;
        }

        .ally-input-text {
            width: 100%;
            background: #14110e;
            border: 1px solid #382b1d;
            color: #e8dfd0;
            font-family: Georgia, serif;
            font-size: 12px;
            padding: 4px 8px;
        }
        .ally-input-text:focus {
            outline: none;
            border-color: #8c714b;
        }

        .ally-textarea {
            width: 100%;
            min-height: 60px;
            background: #120e0b;
            border: 1px solid #382b1d;
            color: #ded3c3;
            font-family: Georgia, serif;
            font-size: 12px;
            line-height: 1.45;
            padding: 6px 8px;
            resize: vertical;
        }
        .ally-textarea:focus {
            outline: none;
            border-color: #8c714b;
        }

        /* Жетоны мастей */
        .suit-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 7px 2px 5px;
            border-radius: 2px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.8px;
            line-height: 1;
            vertical-align: middle;
            text-transform: uppercase;
            user-select: none;
            box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.6);
            margin: 0 2px;
            border: 1px solid transparent;
        }
        .suit-chip svg {
            width: 14px;
            height: 14px;
            display: block;
            flex-shrink: 0;
        }
        .suit-chip.suit-rams  { color: #c96b65; background: rgba(160, 60, 50, 0.16); border-color: rgba(175, 75, 65, 0.45); }
        .suit-chip.suit-masks { color: #b392cf; background: rgba(120, 85, 150, 0.16); border-color: rgba(145, 105, 180, 0.45); }
        .suit-chip.suit-crows { color: #72ab7d; background: rgba(60, 120, 75, 0.16); border-color: rgba(75, 140, 90, 0.45); }
        .suit-chip.suit-tomes { color: #739bbd; background: rgba(65, 105, 140, 0.16); border-color: rgba(85, 125, 165, 0.45); }
    </style>
</head>
<body>

    <header>
        <button type="button" class="nav-back">← Назад к отряду</button>
        <h1 class="page-title">ГЕНРИЕТТА ФОН ШИРАХ — ALLIES LAB</h1>
        <div style="display: flex; gap: 8px;">
            <button type="button" class="action-btn">💾 СОХРАНИТЬ В ОБЛАКО</button>
            <button type="button" class="tab-btn">⬇ СКАЧАТЬ JSON</button>
            <button type="button" class="tab-btn">🖨 ПЕЧАТЬ</button>
        </div>
    </header>

    <main>
        <!-- ТАБ-БАР (ТОЧНО КАК В CAMPAIGN.HTML) -->
        <div class="tab-bar">
            <button class="tab-btn">CHARACTER</button>
            <button class="tab-btn">GENERAL TALENTS</button>
            <button class="tab-btn">PURSUIT</button>
            <button class="tab-btn">EQUIPMENT</button>
            <button class="tab-btn active">ALLIES</button>
            <button class="tab-btn">BIO</button>
        </div>

        <!-- ==========================================
             ТАБ: ALLIES (1В1 ИЗ CAMPAIGN.HTML)
             ========================================== -->
        <div id="tab-allies" class="tab-content" style="max-width: 900px; margin: 0 auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #382b1d; padding-bottom: 10px;">
                <h3 style="margin: 0; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; color: #c59a5b; font-weight: normal;">
                    SUBORDINATES & ALLIES
                </h3>
                <button type="button" class="action-btn" onclick="addAllyCard()" style="font-size: 11px; padding: 6px 14px;">
                    + ADD ALLY
                </button>
            </div>

            <!-- Список карточек-аккордеонов -->
            <div id="allies-list" style="display: flex; flex-direction: column; gap: 12px;"></div>
        </div>
    </main>

    <script>
        // Функция создания HTML карточки союзника
        function createAllyCardHtml(data = {}) {
            const name = data.name || '';
            const sub = data.sub || '';
            
            const might = data.might ?? '';
            const grace = data.grace ?? '';
            const speed = data.speed ?? '';
            const resilience = data.resilience ?? '';
            const charm = data.charm ?? '';
            const intellect = data.intellect ?? '';
            const cunning = data.cunning ?? '';
            const tenacity = data.tenacity ?? '';

            const defense = data.defense || '';
            const walk = data.walk || '';
            const height = data.height || '';
            const initiative = data.initiative || '';
            const willpower = data.willpower || '';
            const charge = data.charge || '';
            const wounds = data.wounds || '';

            const skills = data.skills || '';
            const abilities = data.abilities || '';
            const actions = data.actions || '';

            return `
                <div class="ally-v1-card">
                    <!-- Шапка аккордеона -->
                    <div class="ally-v1-header">
                        <button type="button" class="ally-toggle-btn" onclick="toggleAllyAccordion(this)" title="Свернуть / Развернуть">▲</button>
                        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
                            <input type="text" class="ally-input-title ally-val-name" placeholder="Ally Name..." value="${name}">
                            <input type="text" class="ally-input-sub ally-val-sub" placeholder="Keywords (e.g. Minion (6), Living, Beast)..." value="${sub}">
                        </div>
                        <button type="button" class="ally-v1-btn-del" onclick="removeAllyCard(this)" title="Удалить">✕</button>
                    </div>

                    <!-- Раскрывающееся тело -->
                    <div class="ally-card-body">
                        <!-- Аспекты 4x2 -->
                        <table class="ally-v1-table">
                            <thead>
                                <tr>
                                    <th>Might</th><th>Grace</th><th>Speed</th><th>Resilience</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><input type="text" class="ally-input-stat ally-val-might" placeholder="0" value="${might}"></td>
                                    <td><input type="text" class="ally-input-stat ally-val-grace" placeholder="0" value="${grace}"></td>
                                    <td><input type="text" class="ally-input-stat ally-val-speed" placeholder="0" value="${speed}"></td>
                                    <td><input type="text" class="ally-input-stat ally-val-resilience" placeholder="0" value="${resilience}"></td>
                                </tr>
                            </tbody>
                            <thead>
                                <tr>
                                    <th>Charm</th><th>Intellect</th><th>Cunning</th><th>Tenacity</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><input type="text" class="ally-input-stat ally-val-charm" placeholder="0" value="${charm}"></td>
                                    <td><input type="text" class="ally-input-stat ally-val-intellect" placeholder="0" value="${intellect}"></td>
                                    <td><input type="text" class="ally-input-stat ally-val-cunning" placeholder="0" value="${cunning}"></td>
                                    <td><input type="text" class="ally-input-stat ally-val-tenacity" placeholder="0" value="${tenacity}"></td>
                                </tr>
                            </tbody>
                        </table>

                        <!-- Производные 4x2 -->
                        <table class="ally-v1-table">
                            <thead>
                                <tr>
                                    <th>Defense</th><th>Walk</th><th>Height</th><th>Initiative</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><input type="text" class="ally-input-stat ally-val-defense" placeholder="0" value="${defense}"></td>
                                    <td><input type="text" class="ally-input-stat ally-val-walk" placeholder="0" value="${walk}"></td>
                                    <td><input type="text" class="ally-input-stat ally-val-height" placeholder="0" value="${height}"></td>
                                    <td><input type="text" class="ally-input-stat ally-val-initiative" placeholder="0" value="${initiative}"></td>
                                </tr>
                            </tbody>
                            <thead>
                                <tr>
                                    <th>Willpower</th><th>Charge</th><th>Wounds</th><th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><input type="text" class="ally-input-stat ally-val-willpower" placeholder="0" value="${willpower}"></td>
                                    <td><input type="text" class="ally-input-stat ally-val-charge" placeholder="0" value="${charge}"></td>
                                    <td><input type="text" class="ally-input-stat ally-val-wounds" placeholder="0" value="${wounds}"></td>
                                    <td></td>
                                </tr>
                            </tbody>
                        </table>

                        <!-- Навыки -->
                        <div class="ally-v1-row" style="border-top: none; margin-top: 4px; padding-top: 0;">
                            <strong style="color: #c59a5b; font-size: 11px; text-transform: uppercase; display: block; margin-bottom: 3px;">Skills:</strong>
                            <input type="text" class="ally-input-text ally-val-skills" placeholder="e.g. Acrobatics 2, Pugilism 3..." value="${skills}">
                        </div>

                        <!-- Особенности -->
                        <div class="ally-v1-row">
                            <strong style="color: #c59a5b; font-size: 11px; text-transform: uppercase; display: block; margin-bottom: 3px;">Special Abilities:</strong>
                            <textarea class="ally-textarea ally-val-abilities" placeholder="Abilities...">${abilities}</textarea>
                        </div>

                        <!-- Атаки -->
                        <div class="ally-v1-row">
                            <strong style="color: #c59a5b; font-size: 11px; text-transform: uppercase; display: block; margin-bottom: 3px;">Actions & Attacks:</strong>
                            <textarea class="ally-textarea ally-val-actions" placeholder="Actions & Attacks...">${actions}</textarea>
                        </div>
                    </div>
                </div>
            `;
        }

        function addAllyCard(data = {}) {
            const container = document.getElementById('allies-list');
            if (!container) return;
            const wrapper = document.createElement('div');
            wrapper.innerHTML = createAllyCardHtml(data);
            container.appendChild(wrapper.firstElementChild);
        }

        function removeAllyCard(btn) {
            const card = btn.closest('.ally-v1-card');
            if (card) card.remove();
        }

        function toggleAllyAccordion(btn) {
            const card = btn.closest('.ally-v1-card');
            const body = card.querySelector('.ally-card-body');
            const isClosed = body.style.display === 'none';
            body.style.display = isClosed ? 'block' : 'none';
            btn.textContent = isClosed ? '▲' : '▼';
        }

        // При открытии страницы добавляем одну заполненную карточку и одну пустую для теста
        document.addEventListener('DOMContentLoaded', () => {
            // Тестовый Силурид
            addAllyCard({
                name: "Silurid Hunter",
                sub: "Minion (6), Living, Beast, Swampfiend",
                might: "3", grace: "2", speed: "2", resilience: "2",
                charm: "-3", intellect: "-2", cunning: "2", tenacity: "2",
                defense: "4 (10)", walk: "5", height: "2", initiative: "3 (9)",
                willpower: "4 (10)", charge: "6", wounds: "7",
                skills: "Acrobatics 2, Athletics 3, Flexible 3, Notice 1, Pugilism 3, Stealth 4, Toughness 2, Track 2, Wilderness 3",
                abilities: "Aquatic: Speed is not reduced while swimming. Can Charge underwater.\nPerfect Camouflage: On Pass Action, gains [+] to Stealth and Defense vs Ranged.\nSlink Away: Gains [+] to Df vs disengaging strikes.\nUnimpeded: Ignores penalties for severe terrain.",
                actions: "(1) Deadly Talons (Pugilism) | AV: 6 (12) | Rg: 1 | Dmg: 2/3/4 | Resist: Df\n:c: Hobble: Target gains Hobbled Condition.\n:r: Bite: Target gains Poison +1.\n\n(1) Sticky Tongue (Flexible) | AV: 5 (11) | Rg: 6 | Dmg: 1/1/2 | Resist: Df\n:c: Pull and Drag: Push target toward this character.\n\n(0) Quick Leap: Discard a card to move distance equal to Charge (6 yards)."
            });
        });
    </script>
</body>
</html>
