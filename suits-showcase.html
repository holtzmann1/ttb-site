<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allies Lab — Through the Breach</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #120f0c;
            background-image: 
                radial-gradient(circle at 50% 20%, #1e1812 0%, #120f0c 70%, #0a0806 100%),
                repeating-linear-gradient(0deg, rgba(40, 32, 24, 0.2) 0px, rgba(40, 32, 24, 0.2) 1px, transparent 1px, transparent 28px);
            color: #dfd4c4;
            font-family: Georgia, 'Times New Roman', serif;
            padding-bottom: 80px;
        }

        header {
            padding: 18px 40px;
            border-bottom: 2px solid #3d2d1e;
            background: rgba(18, 15, 12, 0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.85);
        }

        .nav-back {
            color: #c7a877;
            text-decoration: none;
            letter-spacing: 1.5px;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            background: none;
            border: none;
            font-family: Georgia, serif;
            padding: 0;
            transition: color 0.2s;
        }
        .nav-back:hover { color: #f2ece2; }

        .page-title {
            color: #c7a877;
            font-size: 19px;
            letter-spacing: 2.5px;
            margin: 0;
            font-weight: normal;
            text-align: center;
        }

        .action-btn, .tab-btn {
            background: #241c16;
            border: 1px solid #6b5239;
            color: #cbbca9;
            padding: 8px 16px;
            font-family: Georgia, serif;
            font-size: 11.5px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn { color: #c7a877; }
        .action-btn:hover, .tab-btn:hover {
            background: #36291e;
            border-color: #a8885a;
            color: #f2ece2;
        }

        .tab-btn.active {
            background: #36291e;
            border-color: #c7a877;
            color: #f2ece2;
            box-shadow: inset 0 0 0 1px #c7a877;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px 40px 20px;
        }

        .tab-bar {
            margin: 0 auto 25px auto;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* ==========================================================================
           СТИЛИ ЖЕТОНОВ МАСТЕЙ (MALIFAUX / TTB)
           ========================================================================== */
        .suit-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 7px 2px 5px;
            border-radius: 2px;
            font-size: 10.5px;
            font-weight: bold;
            letter-spacing: 0.8px;
            line-height: 1;
            vertical-align: middle;
            text-transform: uppercase;
            user-select: none;
            box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.6);
            margin: 0 3px 0 0;
            border: 1px solid transparent;
        }
        .suit-chip svg {
            width: 13px;
            height: 13px;
            display: block;
            flex-shrink: 0;
        }
        .suit-chip.suit-rams  { color: #c96b65; background: rgba(160, 60, 50, 0.18); border-color: rgba(175, 75, 65, 0.5); }
        .suit-chip.suit-masks { color: #b392cf; background: rgba(120, 85, 150, 0.18); border-color: rgba(145, 105, 180, 0.5); }
        .suit-chip.suit-crows { color: #72ab7d; background: rgba(60, 120, 75, 0.18); border-color: rgba(75, 140, 90, 0.5); }
        .suit-chip.suit-tomes { color: #739bbd; background: rgba(65, 105, 140, 0.18); border-color: rgba(85, 125, 165, 0.5); }

        .badge-flip-pos {
            color: #56d364;
            font-weight: bold;
            font-family: monospace;
            border: 1px solid rgba(86, 211, 100, 0.4);
            background: rgba(86, 211, 100, 0.1);
            padding: 0 4px;
            border-radius: 2px;
            font-size: 11px;
            display: inline-block;
            line-height: 1.2;
            vertical-align: middle;
        }

        /* ==========================================================================
           КАРТОЧКА СОЮЗНИКА В СТИЛЕ PURSUIT WEAPON / TALENT MINION
           ========================================================================== */
        .ally-site-card {
            width: 100%;
            max-width: 520px;
            margin: 0 auto 20px auto;
            border: 1px solid #4a3825;
            background: #14100c;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.85);
            font-family: Georgia, serif;
            box-sizing: border-box;
        }

        .ally-site-header {
            background: #251d16;
            padding: 10px 14px;
            border-bottom: 1px solid #4a3825;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ally-site-title {
            color: #c59a5b;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 0;
            line-height: 1.2;
        }

        .ally-site-subtitle {
            font-size: 11px;
            color: #bfaea0;
            font-style: italic;
            margin-top: 3px;
        }

        .ally-site-ctrls {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-site-ctrl {
            background: transparent;
            border: 1px solid #4a3825;
            color: #c59a5b;
            cursor: pointer;
            padding: 4px 8px;
            font-size: 11px;
            font-family: Georgia, serif;
            letter-spacing: 0.5px;
            transition: all 0.15s ease;
        }
        .btn-site-ctrl:hover {
            border-color: #b88a4a;
            color: #e8dfd0;
            background: rgba(184, 138, 74, 0.15);
        }

        .btn-site-del {
            color: #8f8679;
        }
        .btn-site-del:hover {
            color: #e57373;
            border-color: #e57373;
            background: rgba(229, 115, 115, 0.1);
        }

        .ally-site-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 11px;
            text-align: center;
            background: #1b1510;
            border-bottom: 1px solid #382b1d;
        }

        .ally-site-table th {
            padding: 4px 4px;
            color: #c59a5b;
            font-weight: bold;
            letter-spacing: 0.5px;
            border-right: 1px solid #382b1d;
            border-bottom: 1px solid #382b1d;
            background: #251d16;
            font-size: 10.5px;
            font-style: normal;
        }

        .ally-site-table td {
            padding: 5px 3px;
            color: #e8dfd0;
            font-weight: bold;
            border-right: 1px solid #382b1d;
            border-bottom: 1px solid #382b1d;
            font-size: 14.5px;
        }

        .ally-site-table th:last-child,
        .ally-site-table td:last-child {
            border-right: none;
        }

        .ally-site-body {
            padding: 10px 14px 14px 14px;
            font-size: 11.5px;
            color: #bfaea0;
            line-height: 1.45;
        }

        .ally-site-row {
            margin-bottom: 6px;
        }
        .ally-site-row strong {
            color: #c59a5b;
        }

        .ally-site-divider {
            border-top: 1px dashed #2d2216;
            margin: 8px 0;
            padding-top: 4px;
        }

        .ally-site-item {
            margin-bottom: 6px;
            color: #dfd4c4;
            line-height: 1.4;
        }
        .ally-site-item strong {
            color: #c59a5b;
        }

        .ally-attack-box {
            margin-top: 8px;
            border: 1px solid #382b1d;
            background: #110e0b;
        }

        .ally-attack-head {
            background: #1e1711;
            padding: 5px 8px;
            border-bottom: 1px solid #382b1d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ally-attack-title {
            color: #c59a5b;
            font-weight: bold;
            font-size: 11.5px;
            letter-spacing: 0.5px;
        }

        .ally-attack-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 10.5px;
            text-align: center;
            background: #16120d;
            border-bottom: 1px solid #382b1d;
        }
        .ally-attack-table th {
            padding: 3px 4px;
            color: #8f8679;
            font-weight: bold;
            border-right: 1px solid #2d2216;
            background: #1c1611;
        }
        .ally-attack-table td {
            padding: 3px 4px;
            color: #e8dfd0;
            font-weight: bold;
            border-right: 1px solid #2d2216;
        }
        .ally-attack-table th:last-child,
        .ally-attack-table td:last-child {
            border-right: none;
        }

        .ally-attack-triggers {
            padding: 6px 8px;
            font-size: 11px;
            line-height: 1.4;
        }

        .ally-trigger-row {
            color: #e8dfd0;
            border-top: 1px dashed #2d2216;
            padding-top: 4px;
            margin-top: 4px;
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 2px;
        }
        .ally-trigger-row:first-child {
            border-top: none;
            padding-top: 0;
            margin-top: 0;
        }

        .ally-site-edit {
            display: none;
            padding: 14px;
            background: #18130e;
            border-top: 1px solid #4a3825;
        }

        .edit-row {
            margin-bottom: 10px;
        }
        .edit-row label {
            display: block;
            font-size: 11px;
            color: #c59a5b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .edit-input {
            width: 100%;
            background: #100d0a;
            border: 1px solid #3a2e20;
            color: #e8dfd0;
            padding: 6px 8px;
            font-size: 12.5px;
            font-family: Georgia, serif;
            outline: none;
        }
        .edit-input:focus {
            border-color: #b88a4a;
        }

        .edit-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 6px;
            text-align: center;
        }
        .edit-grid-4 label {
            font-size: 9.5px;
            color: #8f8679;
            margin-bottom: 2px;
        }
        .edit-grid-4 input {
            text-align: center;
            font-weight: bold;
            padding: 4px 2px;
        }

        .edit-textarea {
            width: 100%;
            min-height: 70px;
            background: #100d0a;
            border: 1px solid #3a2e20;
            color: #e8dfd0;
            padding: 6px 8px;
            font-size: 12px;
            font-family: Georgia, serif;
            line-height: 1.45;
            resize: vertical;
            outline: none;
        }
        .edit-textarea:focus {
            border-color: #b88a4a;
        }

        .suit-quick-bar {
            display: flex;
            gap: 4px;
            margin-bottom: 4px;
            align-items: center;
        }
        .btn-quick-suit {
            background: #1a140e;
            border: 1px solid #382b1d;
            color: #c59a5b;
            padding: 2px 6px;
            font-size: 10px;
            cursor: pointer;
            font-family: monospace;
        }
        .btn-quick-suit:hover {
            border-color: #b88a4a;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <button type="button" class="nav-back">← Назад к отряду</button>
        <h1 class="page-title">ГЕНРИЕТТА ФОН ШИРАХ — ALLIES LAB</h1>
        <div style="display: flex; gap: 8px;">
            <button type="button" class="action-btn">💾 СОХРАНИТЬ В ОБЛАКО</button>
            <button type="button" class="tab-btn">⬇ СКАЧАТЬ JSON</button>
            <button type="button" class="tab-btn">🖨 ПЕЧАТЬ</button>
        </div>
    </header>

    <main>
        <div class="tab-bar">
            <button class="tab-btn">CHARACTER</button>
            <button class="tab-btn">GENERAL TALENTS</button>
            <button class="tab-btn">PURSUIT</button>
            <button class="tab-btn">EQUIPMENT</button>
            <button class="tab-btn active">ALLIES</button>
            <button class="tab-btn">BIO</button>
        </div>

        <div style="max-width: 900px; margin: 0 auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #382b1d; padding-bottom: 12px;">
                <h3 style="margin: 0; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; color: #c59a5b; font-weight: normal;">
                    SUBORDINATES & ALLIES
                </h3>
                <button type="button" class="action-btn" onclick="addNewAllyFromTemplate()" style="font-size: 11px; padding: 6px 14px;">
                    + ADD ALLY
                </button>
            </div>

            <div id="allies-site-list"></div>
        </div>
    </main>

    <script>
        const SUIT_SVGS = {
            rams: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4C8 4 4 6 2 10c-1 2-1 4 0 6 1 1 3 1 4 0 1-1 1-3 0-5 2-1 4-1 6 1 2-2 4-2 6-1-1 2-1 4 0 5 1 1 3 1 4 0 1-2 1-4 0-6-2-4-6-6-10-6zm0 5c1.66 0 3 1.34 3 3l-1.5 5h-3L9 12c0-1.66 1.34-3 3-3z"/></svg>',
            crows: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 9c-.3-.5-1-.7-1.5-.4L16 11l-3-6c-.3-.6-1-.8-1.6-.5L7 7 3.5 5.5C3 5.3 2.4 5.5 2.2 6c-.2.5 0 1.1.5 1.3L6 9l-3 4c-.4.5-.3 1.2.2 1.6l4 3 1 4.5c.1.6.7 1 1.3.8.6-.1 1-.7.8-1.3L9.5 18l5-3 5.5 1.5c.6.2 1.2-.2 1.3-.8.2-.6-.2-1.2-.8-1.3L16 13l5-3c.6-.3.8-.9.5-1z"/></svg>',
            masks: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.5 2 12c0 4.5 3 8.3 7.2 9.5.5.1 1-.2 1.1-.7l.7-3.3c.7.3 1.5.5 2.3.5.8 0 1.6-.2 2.3-.5l.7 3.3c.1.5.6.8 1.1.7C21.7 20.3 22 16.5 22 12c0-5.5-4.5-10-10-10zm-4 8c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm8 0c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm-4 6c-1.5 0-2.8-.8-3.5-2h7c-.7 1.2-2 2-3.5 2z"/></svg>',
            tomes: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4zm12 16H6v-2h12v2zm0-4H6V6h12v10z"/></svg>'
        };

        function getSuitBadge(suit) {
            const s = suit.toLowerCase();
            const label = s.toUpperCase();
            return '<span class="suit-chip suit-' + s + '">' + (SUIT_SVGS[s] || '') + ' ' + label + '</span>';
        }

        function formatBookText(text) {
            if (!text) return "";
            return text
                .replace(/\bRAMS\b/g, getSuitBadge('rams'))
                .replace(/\bMASKS\b/g, getSuitBadge('masks'))
                .replace(/\bCROWS\b/g, getSuitBadge('crows'))
                .replace(/\bTOMES\b/g, getSuitBadge('tomes'))
                .replace(/:r:/g, getSuitBadge('rams'))
                .replace(/:m:/g, getSuitBadge('masks'))
                .replace(/:c:/g, getSuitBadge('crows'))
                .replace(/:t:/g, getSuitBadge('tomes'))
                .replace(/\[\+\]|:\+:/g, '<span class="badge-flip-pos">[+]</span>');
        }

        function renderAbilitiesHtml(text) {
            if (!text) return "";
            const lines = text.split("\n").filter(l => l.trim().length > 0);
            return lines.map(line => {
                const colonIdx = line.indexOf(':');
                if (colonIdx !== -1) {
                    const title = line.substring(0, colonIdx).trim();
                    const desc = line.substring(colonIdx + 1).trim();
                    return '<div class="ally-site-item"><strong>' + title + ':</strong> ' + formatBookText(desc) + '</div>';
                }
                return '<div class="ally-site-item">' + formatBookText(line) + '</div>';
            }).join('');
        }

        function renderActionsHtml(text) {
            if (!text) return "";
            const blocks = text.split(/\n\s*\n/);
            return blocks.map(block => {
                const lines = block.split("\n").map(l => l.trim()).filter(Boolean);
                if (lines.length === 0) return '';
                
                let title = lines[0];
                let av = '—', rg = '—', resist = '—', dmg = '—';
                let triggers = [];

                for (let i = 1; i < lines.length; i++) {
                    const l = lines[i];
                    if (l.includes('AV:') || l.includes('Rg:') || l.includes('Resist:')) {
                        const mAv = l.match(/AV:\s*([^|]+)/i);
                        const mRg = l.match(/Rg:\s*([^|]+)/i);
                        const mRes = l.match(/Resist:\s*([^|]+)/i);
                        const mDmg = l.match(/Dmg:\s*([^|]+)|Damage:\s*([^|]+)/i);

                        if (mAv) av = mAv[1].trim();
                        if (mRg) rg = mRg[1].trim();
                        if (mRes) resist = mRes[1].trim();
                        if (mDmg) dmg = (mDmg[1] || mDmg[2]).trim();
                    } else if (l.toLowerCase().startsWith('target suffers') || l.toLowerCase().startsWith('damage:')) {
                        dmg = l.replace(/^target suffers\s*/i, '').replace(/^damage:\s*/i, '').replace(/\s*damage\.?/i, '').trim();
                    } else {
                        triggers.push(l);
                    }
                }

                const hasStats = (av !== '—' || rg !== '—' || resist !== '—' || dmg !== '—');

                let statsTable = '';
                if (hasStats) {
                    statsTable = '<table class="ally-attack-table">' +
                        '<thead><tr><th>AV</th><th>RANGE</th><th>RESIST</th><th>DAMAGE</th></tr></thead>' +
                        '<tbody><tr><td>' + av + '</td><td>' + rg + '</td><td>' + resist + '</td><td>' + dmg + '</td></tr></tbody>' +
                        '</table>';
                }

                let triggersHtml = '';
                if (triggers.length > 0) {
                    triggersHtml = '<div class="ally-attack-triggers">' +
                        triggers.map(t => '<div class="ally-trigger-row">' + formatBookText(t) + '</div>').join('') +
                        '</div>';
                }

                return '<div class="ally-attack-box">' +
                    '<div class="ally-attack-head"><span class="ally-attack-title">' + title + '</span></div>' +
                    statsTable + triggersHtml +
                    '</div>';
            }).join('');
        }

        function renderSiteAllyCard(data, isEditInitially = false) {
            const cardId = 'ally_' + Math.random().toString(36).substr(2, 9);
            const wrapper = document.createElement('div');
            wrapper.className = 'ally-site-card';
            wrapper.id = cardId;

            wrapper.innerHTML = `
                <!-- РЕЖИМ ПРОСМОТРА (В СТИЛЕ САЙТА И ПУТЕЙ) -->
                <div class="ally-site-view">
                    <div class="ally-site-header">
                        <div>
                            <div class="ally-site-title view-val-name">${(data.name || 'UNNAMED ALLY').toUpperCase()}</div>
                            <div class="ally-site-subtitle view-val-sub">${data.sub || 'Minion'}</div>
                        </div>
                        <div class="ally-site-ctrls">
                            <button type="button" class="btn-site-ctrl" onclick="toggleEditMode('${cardId}')">✎ EDIT</button>
                            <button type="button" class="btn-site-ctrl btn-site-del" onclick="document.getElementById('${cardId}').remove()">✕</button>
                        </div>
                    </div>

                    <!-- Таблица Аспектов 4x2 -->
                    <table class="ally-site-table">
                        <thead>
                            <tr>
                                <th>Might</th><th>Grace</th><th>Speed</th><th>Resilience</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="view-val-might">${data.might ?? '0'}</td>
                                <td class="view-val-grace">${data.grace ?? '0'}</td>
                                <td class="view-val-speed">${data.speed ?? '0'}</td>
                                <td class="view-val-resilience">${data.resilience ?? '0'}</td>
                            </tr>
                        </tbody>
                        <thead>
                            <tr>
                                <th>Charm</th><th>Intellect</th><th>Cunning</th><th>Tenacity</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="view-val-charm">${data.charm ?? '0'}</td>
                                <td class="view-val-intellect">${data.intellect ?? '0'}</td>
                                <td class="view-val-cunning">${data.cunning ?? '0'}</td>
                                <td class="view-val-tenacity">${data.tenacity ?? '0'}</td>
                            </tr>
                        </tbody>
                    </table>

                    <!-- Таблица Производных 4x2 -->
                    <table class="ally-site-table">
                        <thead>
                            <tr>
                                <th>Defense</th><th>Walk</th><th>Height</th><th>Initiative</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="view-val-defense">${data.defense || '2'}</td>
                                <td class="view-val-walk">${data.walk || '4'}</td>
                                <td class="view-val-height">${data.height || '2'}</td>
                                <td class="view-val-initiative">${data.initiative || '0'}</td>
                            </tr>
                        </tbody>
                        <thead>
                            <tr>
                                <th>Willpower</th><th>Charge</th><th>Wounds</th><th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="view-val-willpower">${data.willpower || '2'}</td>
                                <td class="view-val-charge">${data.charge || '4'}</td>
                                <td class="view-val-wounds">${data.wounds || '4'}</td>
                                <td></td>
                            </tr>
                        </tbody>
                    </table>

                    <!-- Тело карточки -->
                    <div class="ally-site-body">
                        <div class="ally-site-row">
                            <strong>Skills:</strong> <span class="view-val-skills" style="color: #dfd4c4;">${data.skills || '—'}</span>
                        </div>

                        <div class="ally-site-divider"></div>

                        <div class="ally-site-row">
                            <strong style="text-transform: uppercase; font-size: 11px; display: block; margin-bottom: 4px;">Abilities:</strong>
                            <div class="view-val-abilities">${renderAbilitiesHtml(data.abilities)}</div>
                        </div>

                        <div class="ally-site-divider"></div>

                        <div class="ally-site-row">
                            <strong style="text-transform: uppercase; font-size: 11px; display: block; margin-bottom: 4px;">Attacks & Actions:</strong>
                            <div class="view-val-actions">${renderActionsHtml(data.actions)}</div>
                        </div>
                    </div>
                </div>

                <!-- ФОРМА РЕДАКТИРОВАНИЯ (ОТКРЫВАЕТСЯ ПО КНОПКЕ EDIT) -->
                <div class="ally-site-edit">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #382b1d; padding-bottom: 8px;">
                        <span style="font-size: 12px; font-weight: bold; color: #c59a5b; letter-spacing: 1px;">EDIT ALLY / SUBORDINATE</span>
                        <button type="button" class="action-btn" onclick="saveAllyEdit('${cardId}')" style="font-size: 11px; padding: 4px 12px;">✓ СОХРАНИТЬ</button>
                    </div>

                    <div class="edit-row">
                        <label>Имя союзника</label>
                        <input type="text" class="edit-input inp-name" value="${data.name || ''}" placeholder="Silurid Hunter">
                    </div>

                    <div class="edit-row">
                        <label>Keywords & Type</label>
                        <input type="text" class="edit-input inp-sub" value="${data.sub || ''}" placeholder="Minion (6), Living, Beast, Swampfiend">
                    </div>

                    <div class="edit-row">
                        <label>Аспекты</label>
                        <div class="edit-grid-4">
                            <div><label>Might</label><input type="text" class="edit-input inp-might" value="${data.might ?? '0'}"></div>
                            <div><label>Grace</label><input type="text" class="edit-input inp-grace" value="${data.grace ?? '0'}"></div>
                            <div><label>Speed</label><input type="text" class="edit-input inp-speed" value="${data.speed ?? '0'}"></div>
                            <div><label>Resilience</label><input type="text" class="edit-input inp-resilience" value="${data.resilience ?? '0'}"></div>
                        </div>
                        <div class="edit-grid-4">
                            <div><label>Charm</label><input type="text" class="edit-input inp-charm" value="${data.charm ?? '0'}"></div>
                            <div><label>Intellect</label><input type="text" class="edit-input inp-intellect" value="${data.intellect ?? '0'}"></div>
                            <div><label>Cunning</label><input type="text" class="edit-input inp-cunning" value="${data.cunning ?? '0'}"></div>
                            <div><label>Tenacity</label><input type="text" class="edit-input inp-tenacity" value="${data.tenacity ?? '0'}"></div>
                        </div>
                    </div>

                    <div class="edit-row">
                        <label>Производные</label>
                        <div class="edit-grid-4">
                            <div><label>Defense</label><input type="text" class="edit-input inp-defense" value="${data.defense || '2'}"></div>
                            <div><label>Walk</label><input type="text" class="edit-input inp-walk" value="${data.walk || '4'}"></div>
                            <div><label>Height</label><input type="text" class="edit-input inp-height" value="${data.height || '2'}"></div>
                            <div><label>Initiative</label><input type="text" class="edit-input inp-initiative" value="${data.initiative || '0'}"></div>
                        </div>
                        <div class="edit-grid-4">
                            <div><label>Willpower</label><input type="text" class="edit-input inp-willpower" value="${data.willpower || '2'}"></div>
                            <div><label>Charge</label><input type="text" class="edit-input inp-charge" value="${data.charge || '4'}"></div>
                            <div><label>Wounds</label><input type="text" class="edit-input inp-wounds" value="${data.wounds || '4'}"></div>
                            <div></div>
                        </div>
                    </div>

                    <div class="edit-row">
                        <label>Skills</label>
                        <input type="text" class="edit-input inp-skills" value="${data.skills || ''}" placeholder="Acrobatics 2, Pugilism 3...">
                    </div>

                    <div class="edit-row">
                        <label>Abilities (по строкам "Название: Описание")</label>
                        <textarea class="edit-textarea inp-abilities">${data.abilities || ''}</textarea>
                    </div>

                    <div class="edit-row">
                        <div style="display: flex; justify-content: space-between; align-items: baseline;">
                            <label>Attacks & Actions</label>
                            <div class="suit-quick-bar">
                                <button type="button" class="btn-quick-suit" onclick="insertCode('${cardId}', ':r:')">:r: Ram</button>
                                <button type="button" class="btn-quick-suit" onclick="insertCode('${cardId}', ':c:')">:c: Crow</button>
                                <button type="button" class="btn-quick-suit" onclick="insertCode('${cardId}', ':m:')">:m: Mask</button>
                                <button type="button" class="btn-quick-suit" onclick="insertCode('${cardId}', ':t:')">:t: Tome</button>
                                <button type="button" class="btn-quick-suit" onclick="insertCode('${cardId}', ':+:')">[+]</button>
                            </div>
                        </div>
                        <textarea class="edit-textarea inp-actions">${data.actions || ''}</textarea>
                    </div>

                    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px;">
                        <button type="button" class="btn-site-ctrl" onclick="toggleEditMode('${cardId}')">ОТМЕНА</button>
                        <button type="button" class="action-btn" onclick="saveAllyEdit('${cardId}')">✓ СОХРАНИТЬ</button>
                    </div>
                </div>
            `;

            document.getElementById('allies-site-list').appendChild(wrapper);

            if (isEditInitially) {
                toggleEditMode(cardId);
            }
        }

        function toggleEditMode(cardId) {
            const card = document.getElementById(cardId);
            if (!card) return;
            const viewPanel = card.querySelector('.ally-site-view');
            const editPanel = card.querySelector('.ally-site-edit');
            const isEditing = editPanel.style.display === 'block';

            if (isEditing) {
                editPanel.style.display = 'none';
                viewPanel.style.display = 'block';
            } else {
                editPanel.style.display = 'block';
                viewPanel.style.display = 'none';
            }
        }

        function saveAllyEdit(cardId) {
            const card = document.getElementById(cardId);
            if (!card) return;

            const name = card.querySelector('.inp-name').value || 'UNNAMED ALLY';
            const sub = card.querySelector('.inp-sub').value || 'Minion';
            const might = card.querySelector('.inp-might').value;
            const grace = card.querySelector('.inp-grace').value;
            const speed = card.querySelector('.inp-speed').value;
            const resilience = card.querySelector('.inp-resilience').value;
            const charm = card.querySelector('.inp-charm').value;
            const intellect = card.querySelector('.inp-intellect').value;
            const cunning = card.querySelector('.inp-cunning').value;
            const tenacity = card.querySelector('.inp-tenacity').value;

            const defense = card.querySelector('.inp-defense').value;
            const walk = card.querySelector('.inp-walk').value;
            const height = card.querySelector('.inp-height').value;
            const initiative = card.querySelector('.inp-initiative').value;
            const willpower = card.querySelector('.inp-willpower').value;
            const charge = card.querySelector('.inp-charge').value;
            const wounds = card.querySelector('.inp-wounds').value;

            const skills = card.querySelector('.inp-skills').value;
            const abilities = card.querySelector('.inp-abilities').value;
            const actions = card.querySelector('.inp-actions').value;

            card.querySelector('.view-val-name').textContent = name.toUpperCase();
            card.querySelector('.view-val-sub').textContent = sub;
            card.querySelector('.view-val-might').textContent = might;
            card.querySelector('.view-val-grace').textContent = grace;
            card.querySelector('.view-val-speed').textContent = speed;
            card.querySelector('.view-val-resilience').textContent = resilience;
            card.querySelector('.view-val-charm').textContent = charm;
            card.querySelector('.view-val-intellect').textContent = intellect;
            card.querySelector('.view-val-cunning').textContent = cunning;
            card.querySelector('.view-val-tenacity').textContent = tenacity;

            card.querySelector('.view-val-defense').textContent = defense;
            card.querySelector('.view-val-walk').textContent = walk;
            card.querySelector('.view-val-height').textContent = height;
            card.querySelector('.view-val-initiative').textContent = initiative;
            card.querySelector('.view-val-willpower').textContent = willpower;
            card.querySelector('.view-val-charge').textContent = charge;
            card.querySelector('.view-val-wounds').textContent = wounds;

            card.querySelector('.view-val-skills').textContent = skills || '—';
            card.querySelector('.view-val-abilities').innerHTML = renderAbilitiesHtml(abilities);
            card.querySelector('.view-val-actions').innerHTML = renderActionsHtml(actions);

            toggleEditMode(cardId);
        }

        function insertCode(cardId, code) {
            const card = document.getElementById(cardId);
            if (!card) return;
            const textarea = card.querySelector('.inp-actions');
            if (!textarea) return;

            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const val = textarea.value;
            textarea.value = val.substring(0, start) + code + ' ' + val.substring(end);
            textarea.focus();
            textarea.selectionStart = textarea.selectionEnd = start + code.length + 1;
        }

        function addNewAllyFromTemplate() {
            renderSiteAllyCard({
                name: "New Ally",
                sub: "Minion (5), Living",
                might: "0", grace: "0", speed: "0", resilience: "0",
                charm: "0", intellect: "0", cunning: "0", tenacity: "0",
                defense: "2", walk: "4", height: "2", initiative: "0",
                willpower: "2", charge: "4", wounds: "4",
                skills: "",
                abilities: "",
                actions: ""
            }, true);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderSiteAllyCard({
                name: "Silurid Hunter",
                sub: "Minion (6), Living, Beast, Swampfiend",
                might: "3", grace: "2", speed: "2", resilience: "2",
                charm: "-3", intellect: "-2", cunning: "2", tenacity: "2",
                defense: "4 (10)", walk: "5", height: "2", initiative: "3 (9)",
                willpower: "4 (10)", charge: "6", wounds: "7",
                skills: "Acrobatics 2, Athletics 3, Flexible 3, Notice 1, Pugilism 3, Stealth 4, Toughness 2, Track 2, Wilderness 3.",
                abilities: "Aquatic: This character's speed is not reduced while swimming. It can take the Charge Action while underwater.\nPerfect Camouflage: Each time this character takes a Pass Action, it gains [+] to Stealth Challenges and to Defense flips against Ranged Combat attacks until the start of its next turn.\nSlink Away: This character gains [+] to its Defense flips against disengaging strikes.\nUnimpeded: This character ignores penalties for terrain while taking Movement Actions.",
                actions: "(1) Deadly Talons (Pugilism)\nAV: 6 (12) | Rg: 1 | Resist: Df | Damage: 2/3/4\n:c: Hobble: After succeeding, target gains Hobbled Condition for remainder of Dramatic Time.\n:r: Bite: After damaging, the target gains Poison +1.\n\n(1) Sticky Tongue (Flexible)\nAV: 5 (11) | Rg: 6 | Resist: Df | Damage: 1/1/2\n:c: Pull and Drag: After damaging, push target toward this character equal to Might Aspect (min 1 yard).\n\n(0) Quick Leap\nDiscard a card to move this character a distance equal to its Charge Aspect in yards."
            }, false);
        });
    </script>
</body>
</html>
