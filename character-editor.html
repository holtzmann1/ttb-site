<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Through the Breach — Character Sheet</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0907;
            --panel-bg: #14110e;
            --box-bg: #1c1813;
            --border-color: #3d3122;
            --border-highlight: #6e583b;
            --text-color: #e5d8c5;
            --text-muted: #8c7e6d;
            --accent-gold: #c59a5b;
            --accent-glow: #e2b774;
            --danger: #8a2424;
            --input-bg: #0f0d0a;
            --font-title: 'Cinzel', serif;
            --font-body: 'Crimson Pro', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, #2a2015 0%, transparent 75%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-color);
            font-family: var(--font-body);
            font-size: 16px;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        header {
            background: linear-gradient(180deg, rgba(16,13,10,0.95) 0%, rgba(11,9,7,0.8) 100%);
            border-bottom: 2px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .back-button {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--accent-gold);
            font-family: var(--font-title);
            font-size: 12px;
            padding: 8px 16px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-button:hover {
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px rgba(197, 154, 91, 0.2);
            color: #fff;
        }

        .sheet-title {
            font-family: var(--font-title);
            color: var(--accent-gold);
            font-size: 20px;
            letter-spacing: 3px;
            text-align: center;
        }

        .main-container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 25px;
        }

        .box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            position: relative;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            margin-bottom: 25px;
        }

        .box-header {
            font-family: var(--font-title);
            font-size: 14px;
            color: var(--accent-gold);
            letter-spacing: 2px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .input-group input, .input-group select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            font-family: var(--font-body);
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--accent-gold);
        }

        .aspects-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .aspect-card {
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .aspect-name {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .aspect-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .aspect-btn {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-gold);
            width: 22px;
            height: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            line-height: 1;
        }

        .aspect-btn:hover {
            border-color: var(--accent-gold);
            color: #fff;
        }

        .aspect-val {
            font-family: var(--font-title);
            font-size: 16px;
            width: 24px;
            text-align: center;
            color: #fff;
        }

        .derived-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .derived-card {
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            padding: 10px 5px;
            text-align: center;
        }

        .derived-label {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .derived-val {
            font-family: var(--font-title);
            font-size: 18px;
            color: var(--accent-gold);
        }

        .tabs-header {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-family: var(--font-title);
            font-size: 13px;
            padding: 8px 20px;
            cursor: pointer;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--panel-bg);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            box-shadow: 0 0 10px rgba(197, 154, 91, 0.15);
        }

        .tab-btn:hover:not(.active) {
            border-color: var(--border-highlight);
            color: var(--text-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .sheet-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .sheet-table th {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
        }

        .sheet-table td {
            padding: 8px;
            border-bottom: 1px solid rgba(61, 49, 34, 0.3);
        }

        .sheet-table input, .sheet-table select {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 8px;
            font-family: var(--font-body);
            font-size: 14px;
            width: 100%;
            outline: none;
        }

        .sheet-table input:focus, .sheet-table select:focus {
            border-color: var(--accent-gold);
        }

        .del-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 16px;
            padding: 2px 6px;
        }

        .del-btn:hover {
            color: #ff4d4d;
        }

        .add-row-btn {
            background: transparent;
            border: 1px dashed var(--border-color);
            color: var(--text-muted);
            font-family: var(--font-title);
            font-size: 11px;
            padding: 8px 16px;
            cursor: pointer;
            width: 100%;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
        }

        .add-row-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .talent-card {
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            transition: border-color 0.3s ease;
        }

        .talent-card-header {
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.2);
            cursor: pointer;
        }

        .talent-toggle-btn {
            background: transparent;
            border: none;
            color: var(--accent-gold);
            font-size: 12px;
            cursor: pointer;
        }

        .talent-select {
            flex-grow: 1;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-gold);
            font-family: var(--font-title);
            font-size: 14px;
            padding: 6px 10px;
            outline: none;
        }

        .custom-name-input {
            flex-grow: 1;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            font-family: var(--font-title);
            font-size: 14px;
            padding: 6px 10px;
            outline: none;
            display: none;
        }

        .talent-card-body {
            padding: 15px;
            border-top: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .talent-desc-area {
            grid-column: 1 / -1;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-family: var(--font-body);
            font-size: 14px;
            padding: 10px;
            min-height: 80px;
            resize: vertical;
            outline: none;
            line-height: 1.4;
        }

        .talent-meta-item {
            font-size: 13px;
        }

        .talent-meta-label {
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 3px;
        }

        .talent-meta-val {
            color: #fff;
        }

        .attacks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .attack-card {
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
        }

        .attack-field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 8px;
        }

        .attack-field-row.full {
            grid-template-columns: 1fr;
        }

        .attack-field-row label {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .attack-field-row input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 5px 8px;
            font-family: var(--font-body);
            font-size: 14px;
            outline: none;
        }

        .attack-field-row input:focus {
            border-color: var(--accent-gold);
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ ШАПКА -->
    <header>
        <a href="characters.html" class="back-button">← НАЗАД К ПЕРСОНАЖАМ</a>
        <div class="sheet-title">CHARACTER SHEET</div>
        <div style="display: flex; gap: 10px;">
            <button type="button" class="tab-btn" onclick="saveCharacter()" style="padding: 6px 14px; font-size: 11px;">💾 СОХРАНИТЬ</button>
            <button type="button" class="tab-btn" onclick="exportCharacterJSON()" style="padding: 6px 14px; font-size: 11px;">⬇ СКАЧАТЬ JSON</button>
            <button type="button" class="tab-btn" onclick="document.getElementById('importFile').click()" style="padding: 6px 14px; font-size: 11px;">⬆ ЗАГРУЗИТЬ</button>
            <input type="file" id="importFile" style="display: none;" onchange="importCharacterJSON(event)" accept=".json">
        </div>
    </header>

    <div class="main-container">
        <!-- ЛЕВАЯ КОЛОНКА: БАЗОВАЯ ИНФОРМАЦИЯ И АСПЕКТЫ -->
        <div class="sidebar">
            <div class="box">
                <div class="box-header">IDENTITY</div>
                <div class="input-group">
                    <label>Character Name</label>
                    <input type="text" id="charName" placeholder="Имя персонажа">
                </div>
                <div class="input-group">
                    <label>Player Name</label>
                    <input type="text" id="playerName" placeholder="Игрок">
                </div>
                <div class="input-group">
                    <label>Species / Chassis</label>
                    <input type="text" id="species" placeholder="Раса / Шасси">
                </div>
                <div class="input-group">
                    <label>Current Pursuit</label>
                    <input type="text" id="pursuit" placeholder="Текущий Pursuit">
                </div>
            </div>

            <div class="box">
                <div class="box-header">PHYSICAL ASPECTS</div>
                <div class="aspects-grid">
                    <div class="aspect-card">
                        <div class="aspect-name">Might</div>
                        <div class="aspect-controls">
                            <button class="aspect-btn" onclick="changeAspect('might', -1)">-</button>
                            <span class="aspect-val" id="might">0</span>
                            <button class="aspect-btn" onclick="changeAspect('might', 1)">+</button>
                        </div>
                    </div>
                    <div class="aspect-card">
                        <div class="aspect-name">Grace</div>
                        <div class="aspect-controls">
                            <button class="aspect-btn" onclick="changeAspect('grace', -1)">-</button>
                            <span class="aspect-val" id="grace">0</span>
                            <button class="aspect-btn" onclick="changeAspect('grace', 1)">+</button>
                        </div>
                    </div>
                    <div class="aspect-card">
                        <div class="aspect-name">Speed</div>
                        <div class="aspect-controls">
                            <button class="aspect-btn" onclick="changeAspect('speed', -1)">-</button>
                            <span class="aspect-val" id="speed">0</span>
                            <button class="aspect-btn" onclick="changeAspect('speed', 1)">+</button>
                        </div>
                    </div>
                    <div class="aspect-card">
                        <div class="aspect-name">Resilience</div>
                        <div class="aspect-controls">
                            <button class="aspect-btn" onclick="changeAspect('resilience', -1)">-</button>
                            <span class="aspect-val" id="resilience">0</span>
                            <button class="aspect-btn" onclick="changeAspect('resilience', 1)">+</button>
                        </div>
                    </div>
                </div>

                <div class="box-header" style="margin-top: 20px;">MENTAL ASPECTS</div>
                <div class="aspects-grid">
                    <div class="aspect-card">
                        <div class="aspect-name">Intellect</div>
                        <div class="aspect-controls">
                            <button class="aspect-btn" onclick="changeAspect('intellect', -1)">-</button>
                            <span class="aspect-val" id="intellect">0</span>
                            <button class="aspect-btn" onclick="changeAspect('intellect', 1)">+</button>
                        </div>
                    </div>
                    <div class="aspect-card">
                        <div class="aspect-name">Charm</div>
                        <div class="aspect-controls">
                            <button class="aspect-btn" onclick="changeAspect('charm', -1)">-</button>
                            <span class="aspect-val" id="charm">0</span>
                            <button class="aspect-btn" onclick="changeAspect('charm', 1)">+</button>
                        </div>
                    </div>
                    <div class="aspect-card">
                        <div class="aspect-name">Cunning</div>
                        <div class="aspect-controls">
                            <button class="aspect-btn" onclick="changeAspect('cunning', -1)">-</button>
                            <span class="aspect-val" id="cunning">0</span>
                            <button class="aspect-btn" onclick="changeAspect('cunning', 1)">+</button>
                        </div>
                    </div>
                    <div class="aspect-card">
                        <div class="aspect-name">Tenacity</div>
                        <div class="aspect-controls">
                            <button class="aspect-btn" onclick="changeAspect('tenacity', -1)">-</button>
                            <span class="aspect-val" id="tenacity">0</span>
                            <button class="aspect-btn" onclick="changeAspect('tenacity', 1)">+</button>
                        </div>
                    </div>
                </div>

                <div class="box-header" style="margin-top: 20px;">DERIVED ASPECTS</div>
                <div class="derived-grid">
                    <div class="derived-card">
                        <div class="derived-label">Defense</div>
                        <div class="derived-val" id="derived-df">0</div>
                    </div>
                    <div class="derived-card">
                        <div class="derived-label">Willpower</div>
                        <div class="derived-val" id="derived-wp">0</div>
                    </div>
                    <div class="derived-card">
                        <div class="derived-label">Wounds</div>
                        <div class="derived-val" id="derived-wounds">0</div>
                    </div>
                    <div class="derived-card">
                        <div class="derived-label">Walk / Charge</div>
                        <div class="derived-val" id="derived-movement">0 / 0</div>
                    </div>
                </div>

                <div class="input-group" style="margin-top: 15px;">
                    <label>Armor Rating</label>
                    <input type="number" id="armor" value="0" min="0" oninput="updateDerived()">
                </div>
            </div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА: ВКЛАДКИ -->
        <div class="content-area">
            <div class="tabs-header">
                <button type="button" class="tab-btn active" onclick="switchTab('pursuit')">PURSUIT</button>
                <button type="button" class="tab-btn" onclick="switchTab('talents')">GENERAL TALENTS</button>
            </div>

            <!-- ВКЛАДКА 1: PURSUIT & НАВЫКИ & ОРУЖИЕ -->
            <div id="tab-pursuit" class="tab-content active">
                <div class="box">
                    <div class="box-header">SKILLS</div>
                    <table class="sheet-table">
                        <thead>
                            <tr>
                                <th style="width: 35%;">Skill Name</th>
                                <th style="width: 15%;">Rating</th>
                                <th style="width: 30%;">Aspects</th>
                                <th style="width: 10%;">AV</th>
                                <th style="width: 10%;"></th>
                            </tr>
                        </thead>
                        <tbody id="skillsList">
                            <!-- Строки навыков добавляются через JS -->
                        </tbody>
                    </table>
                    <button class="add-row-btn" onclick="addNewSkillRow()">+ ДОБАВИТЬ НАВЫК</button>
                </div>

                <div class="box">
                    <div class="box-header">WEAPONS & ATTACKS</div>
                    <div class="attacks-grid" id="attacksList">
                        <!-- Пример 2 пустых слотов атак -->
                        <div class="attack-card">
                            <div class="attack-field-row">
                                <div><label>Name</label><input type="text" placeholder="Weapon / Spell"></div>
                                <div><label>Special</label><input type="text" placeholder="Traits"></div>
                            </div>
                            <div class="attack-field-row">
                                <div><label>AV</label><input type="text" placeholder="e.g. 5r"></div>
                                <div><label>Range</label><input type="text" placeholder="e.g. y2, 8"></div>
                            </div>
                            <div class="attack-field-row">
                                <div><label>Damage</label><input type="text" placeholder="2/3/4"></div>
                                <div><label>Capacity / Reload</label><input type="text" placeholder="6 / (1)"></div>
                            </div>
                            <div class="attack-field-row full">
                                <div><label>Triggers</label><input type="text" placeholder="Special Triggers"></div>
                            </div>
                        </div>

                        <div class="attack-card">
                            <div class="attack-field-row">
                                <div><label>Name</label><input type="text" placeholder="Weapon / Spell"></div>
                                <div><label>Special</label><input type="text" placeholder="Traits"></div>
                            </div>
                            <div class="attack-field-row">
                                <div><label>AV</label><input type="text" placeholder="e.g. 5r"></div>
                                <div><label>Range</label><input type="text" placeholder="e.g. y2, 8"></div>
                            </div>
                            <div class="attack-field-row">
                                <div><label>Damage</label><input type="text" placeholder="2/3/4"></div>
                                <div><label>Capacity / Reload</label><input type="text" placeholder="6 / (1)"></div>
                            </div>
                            <div class="attack-field-row full">
                                <div><label>Triggers</label><input type="text" placeholder="Special Triggers"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ВКЛАДКА 2: GENERAL TALENTS (С ЧЕКБОКСОМ DESTINY) -->
            <div id="tab-talents" class="tab-content">
                <div class="box">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #33271a; padding-bottom: 6px; margin-bottom: 15px;">
                        <div class="box-header" style="border-bottom: none; margin: 0; padding: 0;">GENERAL TALENTS</div>
                        <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #a99e8d; cursor: pointer; user-select: none;">
                            <input type="checkbox" id="showAllTalentsToggle" onchange="refreshAllTalentSelects()" style="width: 16px; height: 16px; cursor: pointer; accent-color: #c59a5b;">
                            Показать все таланты (Destiny / игнорировать требования)
                        </label>
                    </div>

                    <div id="talentsContainer">
                        <!-- Карточки талантов добавляются через JS -->
                    </div>

                    <button class="add-row-btn" onclick="addNewTalentCard()">+ ДОБАВИТЬ ТАЛАНТ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ПОДКЛЮЧЕНИЕ БАЗ ДАННЫХ -->
    <script src="skills-data.js"></script>
    <script src="talents-data.js"></script>

    <!-- ОСНОВНАЯ ЛОГИКА -->
    <script>
        const aspects = {
            might: 0,
            grace: 0,
            speed: 0,
            resilience: 0,
            intellect: 0,
            charm: 0,
            cunning: 0,
            tenacity: 0
        };

        function changeAspect(aspectName, delta) {
            aspects[aspectName] += delta;
            document.getElementById(aspectName).textContent = aspects[aspectName];
            updateDerived();
            updateAllSkillsAV();
            refreshAllTalentSelects();
        }

        function updateDerived() {
            const df = 4 + aspects.speed;
            const wp = 4 + aspects.tenacity;
            const wounds = 4 + aspects.resilience;
            const walk = 4 + aspects.speed;
            const charge = 4 + aspects.speed;

            document.getElementById('derived-df').textContent = df;
            document.getElementById('derived-wp').textContent = wp;
            document.getElementById('derived-wounds').textContent = wounds;
            document.getElementById('derived-movement').textContent = `${walk} / ${charge}`;
        }

        // ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
        function switchTab(tabKey) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
                content.style.display = 'none';
            });

            const targetTab = document.getElementById('tab-' + tabKey);
            if (targetTab) {
                targetTab.classList.add('active');
                targetTab.style.display = 'block';
            }

            const activeBtn = Array.from(document.querySelectorAll('.tabs-header .tab-btn')).find(b => 
                b.getAttribute('onclick') && b.getAttribute('onclick').includes(tabKey)
            );
            if (activeBtn) {
                activeBtn.classList.add('active');
            }
        }

        // ЛОГИКА НАВЫКОВ
        function getSkillOptionsHtml() {
            let html = `<option value="">-- Выбери навык --</option>`;
            if (typeof SKILLS_DATA !== 'undefined') {
                for (const category in SKILLS_DATA) {
                    html += `<optgroup label="${category}">`;
                    SKILLS_DATA[category].forEach(s => {
                        html += `<option value="${s.name}">${s.name}</option>`;
                    });
                    html += `</optgroup>`;
                }
            }
            return html;
        }

        function addNewSkillRow() {
            const tbody = document.getElementById('skillsList');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <select class="skill-select" onchange="onSkillSelectChange(this.closest('tr'))">
                        ${getSkillOptionsHtml()}
                    </select>
                </td>
                <td>
                    <input type="number" class="skill-rating" value="0" min="0" max="5" oninput="updateRowAV(this.closest('tr'))">
                </td>
                <td class="skill-aspects-cell">
                    <span style="color: var(--text-muted); font-size: 13px;">—</span>
                </td>
                <td class="skill-av" style="font-family: var(--font-title); color: var(--accent-gold); font-size: 15px;">
                    0
                </td>
                <td style="text-align: center;">
                    <button class="del-btn" onclick="this.closest('tr').remove(); refreshAllTalentSelects();">✕</button>
                </td>
            `;
            tbody.appendChild(tr);
        }

        function findSkillData(name) {
            if (typeof SKILLS_DATA === 'undefined') return null;
            for (const category in SKILLS_DATA) {
                const found = SKILLS_DATA[category].find(s => s.name === name);
                if (found) return found;
            }
            return null;
        }

        function onSkillSelectChange(tr) {
            const select = tr.querySelector('.skill-select');
            const aspectsCell = tr.querySelector('.skill-aspects-cell');
            const skillName = select.value;
            const skill = findSkillData(skillName);

            if (!skill) {
                aspectsCell.innerHTML = `<span style="color: var(--text-muted); font-size: 13px;">—</span>`;
                updateRowAV(tr);
                refreshAllTalentSelects();
                return;
            }

            if (skill.aspects.length === 1) {
                aspectsCell.innerHTML = `
                    <span style="font-size: 14px; text-transform: capitalize;">${skill.aspects[0]}</span>
                    <input type="hidden" class="skill-aspect" value="${skill.aspects[0]}">
                `;
            } else {
                let optionsHtml = skill.aspects.map(a => `<option value="${a}">${a.charAt(0).toUpperCase() + a.slice(1)}</option>`).join('');
                aspectsCell.innerHTML = `
                    <select class="skill-aspect" onchange="updateRowAV(this.closest('tr'))">
                        ${optionsHtml}
                    </select>
                `;
            }

            updateRowAV(tr);
            refreshAllTalentSelects();
        }

        function updateRowAV(tr) {
            const ratingInput = tr.querySelector('.skill-rating');
            const rating = parseInt(ratingInput?.value, 10) || 0;
            const aspectSelect = tr.querySelector('.skill-aspect');
            const aspectName = aspectSelect?.value?.toLowerCase();
            const aspectVal = (aspectName && aspects[aspectName] !== undefined) ? aspects[aspectName] : 0;
            const avCell = tr.querySelector('.skill-av');
            if (avCell) {
                avCell.textContent = rating + aspectVal;
            }
        }

        function updateAllSkillsAV() {
            document.querySelectorAll('#skillsList tr').forEach(tr => updateRowAV(tr));
        }

        // ЛОГИКА ТАЛАНТОВ
        function getSkillRank(skillName) {
            let maxRank = 0;
            document.querySelectorAll("#skillsList tr").forEach(tr => {
                const sel = tr.querySelector(".skill-select");
                if (sel && sel.value.toLowerCase().trim() === skillName.toLowerCase().trim()) {
                    const r = parseInt(tr.querySelector(".skill-rating")?.value, 10) || 0;
                    if (r > maxRank) maxRank = r;
                }
            });
            return maxRank;
        }

        function hasAnySkillWithRank(minRank, categoryFilter = null) {
            let found = false;
            document.querySelectorAll("#skillsList tr").forEach(tr => {
                const sel = tr.querySelector(".skill-select");
                const r = parseInt(tr.querySelector(".skill-rating")?.value, 10) || 0;
                if (sel && sel.value && r >= minRank) {
                    if (!categoryFilter) {
                        found = true;
                    } else {
                        const sData = findSkillData(sel.value);
                        if (sData && categoryFilter.includes(sData.category)) {
                            found = true;
                        }
                    }
                }
            });
            return found;
        }

        function checkAspectCondition(str) {
            const clean = str.trim().toLowerCase();
            if (clean.includes("two aspects -3") || clean.includes("two aspects -3 or less")) {
                const count = Object.values(aspects).filter(v => v <= -3).length;
                return count >= 2;
            }
            if (clean.includes("at least one mental aspect -1") || clean.includes("at least one mental aspect -1 or less")) {
                return (aspects.intellect <= -1 || aspects.charm <= -1 || aspects.cunning <= -1 || aspects.tenacity <= -1);
            }
            if (clean.includes("no aspects higher than 1")) {
                return Object.values(aspects).every(v => v <= 1);
            }
            if (clean.includes("physical aspect 2 or higher")) {
                return (aspects.might >= 2 || aspects.grace >= 2 || aspects.speed >= 2 || aspects.resilience >= 2);
            }

            const m = clean.match(/([a-z]+)\s*(-?\d+)\s*(or higher|\+|or lower|or less)?/i);
            if (!m) return true;

            const asp = m[1];
            const val = parseInt(m[2], 10);
            const op = m[3] ? m[3].trim() : (val < 0 ? "or lower" : "or higher");

            if (aspects[asp] !== undefined) {
                if (op === "or higher" || op === "+") return aspects[asp] >= val;
                if (op === "or lower" || op === "or less") return aspects[asp] <= val;
            }
            return true;
        }

        function checkSingleReqClause(clause) {
            const c = clause.trim();
            if (!c || c.toLowerCase() === "none") return true;

            if (c.toLowerCase().startsWith("aspect:")) {
                const sub = c.substring(7).trim();
                const orParts = sub.split(/\s+or\s+/i);
                return orParts.some(p => checkAspectCondition(p));
            }

            if (c.toLowerCase().startsWith("skill:")) {
                const sub = c.substring(6).trim();
                if (sub.toLowerCase().includes("chosen skill") || sub.toLowerCase().includes("chosen skill rank")) {
                    const m = sub.match(/\d+/);
                    const reqVal = m ? parseInt(m[0], 10) : 1;
                    return hasAnySkillWithRank(reqVal);
                }
                if (sub.toLowerCase().includes("close combat or ranged combat")) {
                    const m = sub.match(/\d+/);
                    const reqVal = m ? parseInt(m[0], 10) : 3;
                    return hasAnySkillWithRank(reqVal, ["Close Combat", "Ranged Combat"]);
                }
                if (sub.toLowerCase().includes("magical or ranged combat")) {
                    const m = sub.match(/\d+/);
                    const reqVal = m ? parseInt(m[0], 10) : 2;
                    return hasAnySkillWithRank(reqVal, ["Magical", "Ranged Combat"]);
                }
                if (sub.toLowerCase().includes("one magical skill")) {
                    const m = sub.match(/\d+/);
                    const reqVal = m ? parseInt(m[0], 10) : 4;
                    return hasAnySkillWithRank(reqVal, ["Magical"]);
                }
                if (sub.toLowerCase().includes("mental aspect 4")) {
                    return (aspects.intellect >= 4 || aspects.charm >= 4 || aspects.cunning >= 4 || aspects.tenacity >= 4);
                }

                const m = sub.match(/^([a-zA-Z\s-]+?)\s+(\d+)\s*(or higher|\+|or more)?$/i);
                if (m) {
                    let sName = m[1].trim();
                    const reqVal = parseInt(m[2], 10);
                    if (sName.toLowerCase() === "pistols") sName = "Pistol";
                    if (sName.toLowerCase() === "shotguns") sName = "Shotgun";
                    if (sName.toLowerCase() === "heavy guns") sName = "Heavy Weapons";
                    return getSkillRank(sName) >= reqVal;
                }
            }

            // Игнорируем сюжетные заглушки
            return true;
        }

        function checkTalentRequirements(talent) {
            if (!talent.req || talent.req.trim().toLowerCase() === "none") return true;
            const parts = talent.req.split(/,\s*(?=[A-Z][a-zA-Z\s]*:)/);
            return parts.every(p => checkSingleReqClause(p));
        }

        function getTalentOptionsHtml(selectedVal = "") {
            let html = `<option value="">-- Выбери талант --</option>`;
            html += `<option value="__custom__" ${selectedVal === '__custom__' ? 'selected' : ''}>★ Свой талант (Custom)</option>`;
            
            if (typeof GENERAL_TALENTS !== 'undefined') {
                const showAll = document.getElementById("showAllTalentsToggle")?.checked || false;

                const availableTalents = GENERAL_TALENTS.filter(t => 
                    showAll || checkTalentRequirements(t) || t.name === selectedVal
                );

                const grouped = {};
                availableTalents.forEach(t => {
                    const bookName = t.book && t.book.trim() ? t.book.trim() : "Other / Core";
                    if (!grouped[bookName]) grouped[bookName] = [];
                    grouped[bookName].push(t);
                });

                Object.keys(grouped).sort().forEach(book => {
                    html += `<optgroup label="📖 ${book}">`;
                    grouped[book].sort((a, b) => a.name.localeCompare(b.name)).forEach(t => {
                        const fits = checkTalentRequirements(t);
                        const sel = (t.name === selectedVal) ? 'selected' : '';

                        if (showAll) {
                            if (fits) {
                                html += `<option value="${t.name}" ${sel} style="color: #66bb6a; background: #14110e;">✓ ${t.name}</option>`;
                            } else {
                                html += `<option value="${t.name}" ${sel} style="color: #ef5350; background: #14110e;">✕ ${t.name}</option>`;
                            }
                        } else {
                            html += `<option value="${t.name}" ${sel}>${t.name}</option>`;
                        }
                    });
                    html += `</optgroup>`;
                });
            }
            return html;
        }

        function addNewTalentCard() {
            const container = document.getElementById('talentsContainer');
            const card = document.createElement('div');
            card.className = 'talent-card';
            card.innerHTML = `
                <div class="talent-card-header" onclick="toggleTalentAccordion(this, event)">
                    <button type="button" class="talent-toggle-btn">▲</button>
                    <select class="talent-select" onchange="onTalentSelectChange(this)">
                        ${getTalentOptionsHtml()}
                    </select>
                    <input type="text" class="custom-name-input" placeholder="Название своего таланта" oninput="saveCharacterStateDebounced()">
                    <button type="button" class="del-btn" onclick="this.closest('.talent-card').remove();">✕</button>
                </div>
                <div class="talent-card-body">
                    <div class="talent-meta-item">
                        <span class="talent-meta-label">Requirements</span>
                        <span class="talent-meta-val talent-req">—</span>
                    </div>
                    <div class="talent-meta-item">
                        <span class="talent-meta-label">Book / Source</span>
                        <span class="talent-meta-val talent-book">—</span>
                    </div>
                    <textarea class="talent-desc-area" placeholder="Описание таланта..."></textarea>
                </div>
            `;
            container.appendChild(card);
        }

        function toggleTalentAccordion(header, event) {
            if (event.target.tagName === 'SELECT' || event.target.tagName === 'INPUT' || event.target.classList.contains('del-btn')) {
                return;
            }
            const card = header.closest('.talent-card');
            const body = card.querySelector('.talent-card-body');
            const btn = card.querySelector('.talent-toggle-btn');
            if (body.style.display === 'none') {
                body.style.display = 'grid';
                btn.textContent = '▲';
            } else {
                body.style.display = 'none';
                btn.textContent = '▼';
            }
        }

        function onTalentSelectChange(select) {
            const card = select.closest('.talent-card');
            const customInput = card.querySelector('.custom-name-input');
            const reqSpan = card.querySelector('.talent-req');
            const bookSpan = card.querySelector('.talent-book');
            const descArea = card.querySelector('.talent-desc-area');

            if (select.value === '__custom__') {
                select.style.display = 'none';
                customInput.style.display = 'block';
                customInput.focus();
                reqSpan.textContent = 'Custom';
                bookSpan.textContent = 'Homebrew';
                descArea.value = '';
                return;
            }

            if (typeof GENERAL_TALENTS !== 'undefined') {
                const talent = GENERAL_TALENTS.find(t => t.name === select.value);
                if (talent) {
                    reqSpan.textContent = talent.req || 'None';
                    bookSpan.textContent = talent.book || '—';
                    descArea.value = talent.desc || '';
                } else {
                    reqSpan.textContent = '—';
                    bookSpan.textContent = '—';
                    descArea.value = '';
                }
            }
        }

        function refreshAllTalentSelects() {
            document.querySelectorAll('.talent-card').forEach(card => {
                const select = card.querySelector('.talent-select');
                const customInput = card.querySelector('.custom-name-input');
                if (customInput.style.display !== 'block') {
                    const currentVal = select.value;
                    select.innerHTML = getTalentOptionsHtml(currentVal);
                    select.value = currentVal;
                }
            });
        }

        // === БЕЗОПАСНЫЙ СБОР ДАННЫХ ПЕРСОНАЖА В ОБЪЕКТ ===
        function getCharacterData() {
            const skills = [];
            document.querySelectorAll("#skillsList tr").forEach(tr => {
                const skillName = tr.querySelector(".skill-select")?.value || "";
                const rating = parseInt(tr.querySelector(".skill-rating")?.value, 10) || 0;
                const aspectSelects = Array.from(tr.querySelectorAll(".skill-aspect")).map(s => s.value);
                if (skillName) {
                    skills.push({ skillName, rating, aspects: aspectSelects });
                }
            });

            const talents = [];
            document.querySelectorAll(".talent-card").forEach(card => {
                const select = card.querySelector(".talent-select");
                const customInput = card.querySelector(".custom-name-input");
                const isCustom = customInput && customInput.style.display === "block";
                const name = isCustom ? (customInput?.value || "") : (select?.value || "");
                const req = card.querySelector(".talent-req")?.textContent || "";
                const book = card.querySelector(".talent-book")?.textContent || "";
                const desc = card.querySelector(".talent-desc-area")?.value || "";
                if (name) {
                    talents.push({ name, isCustom, req, book, desc });
                }
            });

            const attacks = [];
            const attackRows = document.querySelectorAll(".attack-card, #attacksList tr");
            attackRows.forEach(row => {
                const inputs = row.querySelectorAll("input");
                if (inputs.length > 0) {
                    attacks.push(Array.from(inputs).map(inp => inp.value));
                }
            });

            return {
                charName: document.getElementById("charName")?.value || "",
                playerName: document.getElementById("playerName")?.value || "",
                species: document.getElementById("species")?.value || "",
                pursuit: document.getElementById("pursuit")?.value || "",
                aspects: { ...aspects },
                armor: document.getElementById("armor")?.value || 0,
                skills,
                talents,
                attacks
            };
        }

        // === ВОССТАНОВЛЕНИЕ ПЕРСОНАЖА ИЗ ДАННЫХ ===
        function loadCharacterData(data) {
            if (!data) return;

            if (data.charName !== undefined) document.getElementById("charName").value = data.charName;
            if (data.playerName !== undefined) document.getElementById("playerName").value = data.playerName;
            if (data.species !== undefined) document.getElementById("species").value = data.species;
            if (data.pursuit !== undefined) document.getElementById("pursuit").value = data.pursuit;
            if (data.armor !== undefined) document.getElementById("armor").value = data.armor;

            if (data.aspects) {
                for (let k in data.aspects) {
                    aspects[k] = data.aspects[k];
                    const span = document.getElementById(k);
                    if (span) span.textContent = aspects[k];
                }
            }

            const tbody = document.getElementById("skillsList");
            tbody.innerHTML = "";
            if (data.skills && data.skills.length > 0) {
                data.skills.forEach(sk => {
                    addNewSkillRow();
                    const lastRow = tbody.lastElementChild;
                    const sel = lastRow.querySelector(".skill-select");
                    if (sel) {
                        sel.value = sk.skillName;
                        onSkillSelectChange(lastRow);
                    }
                    const ratingInput = lastRow.querySelector(".skill-rating");
                    if (ratingInput) ratingInput.value = sk.rating;

                    const aspSelects = lastRow.querySelectorAll(".skill-aspect");
                    if (sk.aspects && aspSelects.length > 0) {
                        aspSelects.forEach((s, idx) => {
                            if (sk.aspects[idx]) s.value = sk.aspects[idx];
                        });
                    }
                    updateRowAV(lastRow);
                });
            }

            if (data.attacks && data.attacks.length > 0) {
                const attackCards = document.querySelectorAll(".attack-card");
                data.attacks.forEach((atkValues, idx) => {
                    if (attackCards[idx]) {
                        const inputs = attackCards[idx].querySelectorAll("input");
                        inputs.forEach((inp, i) => {
                            if (atkValues[i] !== undefined) inp.value = atkValues[i];
                        });
                    }
                });
            }

            updateDerived();

            const tContainer = document.getElementById("talentsContainer");
            tContainer.innerHTML = "";
            if (data.talents && data.talents.length > 0) {
                data.talents.forEach(t => {
                    addNewTalentCard();
                    const lastCard = tContainer.lastElementChild;
                    const select = lastCard.querySelector(".talent-select");
                    const customInput = lastCard.querySelector(".custom-name-input");
                    const reqSpan = lastCard.querySelector(".talent-req");
                    const bookSpan = lastCard.querySelector(".talent-book");
                    const descArea = lastCard.querySelector(".talent-desc-area");

                    if (t.isCustom) {
                        select.style.display = "none";
                        customInput.style.display = "block";
                        customInput.value = t.name;
                    } else {
                        select.value = t.name;
                    }
                    reqSpan.textContent = t.req || "—";
                    bookSpan.textContent = t.book || "—";
                    descArea.value = t.desc || "";
                });
            } else {
                addNewTalentCard();
            }
            refreshAllTalentSelects();
        }

        // === СОХРАНЕНИЕ В ПАМЯТЬ BROWSER (localStorage) ===
        function saveCharacter() {
            try {
                const data = getCharacterData();
                localStorage.setItem("ttb_saved_character", JSON.stringify(data));
                alert("Персонаж успешно сохранен!");
            } catch (e) {
                alert("Ошибка сохранения: " + e.message);
                console.error(e);
            }
        }

        // === ЭКСПОРТ В JSON ===
        function exportCharacterJSON() {
            try {
                const data = getCharacterData();
                const jsonStr = JSON.stringify(data, null, 2);
                const blob = new Blob([jsonStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                const filename = (data.charName || "character").trim().replace(/\s+/g, "_") + ".json";
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            } catch (e) {
                alert("Ошибка скачивания: " + e.message);
            }
        }

        // === ИМПОРТ ИЗ JSON ===
        function importCharacterJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    loadCharacterData(data);
                    alert("Персонаж успешно загружен из файла!");
                } catch (err) {
                    alert("Ошибка чтения файла JSON: " + err.message);
                }
            };
            reader.readAsText(file);
        }

        // === ИНИЦИАЛИЗАЦИЯ И АВТОЗАГРУЗКА ===
        window.addEventListener("DOMContentLoaded", () => {
            updateDerived();
            const saved = localStorage.getItem("ttb_saved_character");
            if (saved) {
                try {
                    loadCharacterData(JSON.parse(saved));
                } catch(e) {
                    console.error("Не удалось восстановить сохранение:", e);
                    addNewTalentCard();
                }
            } else {
                addNewTalentCard();
            }
        });

        window.addEventListener("beforeunload", () => {
            try {
                const data = getCharacterData();
                localStorage.setItem("ttb_saved_character", JSON.stringify(data));
            } catch(e) {}
        });
    </script>
