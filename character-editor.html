<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание персонажа — Through the Breach</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 20%, #30251b 0%, #17130f 45%, #0b0a09 100%);
            color: #e8dfd0;
            font-family: Georgia, serif;
        }

        header {
            padding: 20px 50px;
            border-bottom: 1px solid #4a3825;
            background: rgba(10, 9, 8, 0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-button {
            color: #8f8679;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .back-button:hover {
            color: #c59a5b;
        }

        .sheet-title {
            color: #c59a5b;
            font-size: 20px;
            letter-spacing: 2px;
        }

        /* НАВИГАЦИОННЫЕ ВКЛАДКИ */
        .tab-bar {
            max-width: 1200px;
            margin: 20px auto 0 auto;
            padding: 0 20px;
            display: flex;
            gap: 15px;
        }

        .tab-btn {
            background: rgba(14, 11, 9, 0.85);
            border: 1px solid #4a3825;
            color: #8f8679;
            padding: 10px 24px;
            font-family: Georgia, serif;
            font-size: 13px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: #e8dfd0;
            border-color: #b88a4a;
        }

        .tab-btn.active {
            color: #c59a5b;
            border-color: #c59a5b;
            background: rgba(45, 33, 21, 0.6);
            box-shadow: inset 0 0 10px rgba(197, 154, 91, 0.2);
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 25px 20px 40px 20px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Общие стили полей ввода */
        input[type="text"], input[type="number"], select, textarea {
            background: #14110e;
            border: 1px solid #4a3825;
            color: #e8dfd0;
            font-family: Georgia, serif;
            font-size: 15px;
            padding: 8px 10px;
            outline: none;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #b88a4a;
        }

        optgroup {
            background: #1e1914;
            color: #c59a5b;
            font-style: normal;
            font-weight: bold;
        }

        option {
            background: #14110e;
            color: #e8dfd0;
            font-weight: normal;
        }

        .box {
            border: 1px solid #4a3825;
            background: rgba(10, 9, 8, 0.6);
            padding: 15px;
            margin-bottom: 25px;
        }

        .box-header {
            margin: 0 0 15px 0;
            color: #c59a5b;
            font-size: 20px;
            font-weight: normal;
            letter-spacing: 1.5px;
            text-align: center;
            border-bottom: 1px solid #33271a;
            padding-bottom: 6px;
        }

        /* ШАПКА */
        .top-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        .label-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .field-group label {
            display: block;
            font-size: 12px;
            color: #a99e8d;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        /* ОСНОВНОЙ МАКЕТ PURSUIT */
        .sheet-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        /* АСПЕКТЫ */
        .aspects-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .aspect-subgroup h4 {
            margin: 0 0 10px 0;
            text-align: center;
            color: #a99e8d;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .aspect-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 17, 14, 0.8);
            border: 1px solid #382b1d;
            padding: 6px 10px;
            margin-bottom: 8px;
        }

        .aspect-name {
            font-size: 15px;
        }

        .counter {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .counter button {
            width: 26px;
            height: 26px;
            background: #14110e;
            border: 1px solid #4a3825;
            color: #c59a5b;
            cursor: pointer;
            font-family: monospace;
        }

        .counter button:hover {
            background: #b88a4a;
            color: #000;
        }

        .counter span {
            min-width: 25px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        /* DERIVED ASPECTS */
        .derived-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .derived-cell {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 17, 14, 0.8);
            border: 1px solid #382b1d;
            padding: 6px 10px;
        }

        .derived-cell span:first-child {
            color: #a99e8d;
            font-size: 13px;
        }

        .derived-cell input {
            width: 65px;
            text-align: center;
            padding: 4px;
            font-size: 16px;
            font-weight: bold;
        }

        .defense-container {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .defense-container input {
            width: 44px;
            text-align: center;
            padding: 4px;
            font-size: 15px;
            font-weight: bold;
        }

        /* АТАКИ */
        .attack-card {
            border: 1px solid #382b1d;
            background: rgba(16, 14, 11, 0.85);
            padding: 10px;
            margin-bottom: 12px;
        }

        .attack-row-1 {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 10px;
            margin-bottom: 8px;
        }

        .attack-stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 8px;
        }

        .attack-stats-grid div {
            text-align: center;
        }

        .attack-stats-grid label {
            display: block;
            font-size: 10px;
            color: #8f8679;
            margin-bottom: 3px;
        }

        .attack-stats-grid input {
            text-align: center;
            padding: 4px;
            font-size: 13px;
        }

        /* ТАБЛИЦА НАВЫКОВ */
        .skills-table {
            width: 100%;
            border-collapse: collapse;
        }

        .skills-table th {
            text-align: left;
            padding: 6px;
            color: #a99e8d;
            font-size: 13px;
            letter-spacing: 1px;
            border-bottom: 1px solid #4a3825;
        }

        .skills-table td {
            padding: 4px;
            vertical-align: middle;
        }

        .dual-stack {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .av-box {
            text-align: center;
            font-weight: bold;
            color: #c59a5b;
            font-size: 16px;
            background: #14110e;
            border: 1px solid #2a2015;
            padding: 6px 0;
            width: 45px;
            min-height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .del-btn {
            background: transparent;
            border: 1px solid #4a3825;
            color: #8f8679;
            cursor: pointer;
            padding: 6px 10px;
            font-size: 12px;
        }

        .del-btn:hover {
            color: #e57373;
            border-color: #e57373;
        }

        .add-row-btn {
            margin-top: 15px;
            padding: 10px;
            background: transparent;
            border: 1px dashed #b88a4a;
            color: #c59a5b;
            cursor: pointer;
            font-family: Georgia, serif;
            letter-spacing: 1px;
            width: 100%;
        }

        .add-row-btn:hover {
            background: rgba(184, 138, 74, 0.15);
        }

        /* СТРАНИЦА GENERAL TALENTS */
        .talents-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        .talents-table th {
            text-align: left;
            padding: 8px 10px;
            color: #c59a5b;
            font-size: 14px;
            letter-spacing: 2px;
            border-bottom: 1px solid #4a3825;
        }

        .talents-table td {
            padding: 0 4px;
            vertical-align: top;
        }

        .talent-input-name {
            font-weight: bold;
            color: #e8dfd0;
        }

        .talent-input-desc {
            resize: vertical;
            min-height: 40px;
            height: 40px;
            line-height: 1.4;
        }

        @media (max-width: 900px) {
            .top-grid, .sheet-body {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <a href="characters.html" class="back-button">← НАЗАД К ПЕРСОНАЖАМ</a>
    <div class="sheet-title">CHARACTER SHEET</div>
</header>

<!-- ВКЛАДКИ -->
<div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('pursuit')">PURSUIT</button>
    <button class="tab-btn" onclick="switchTab('talents')">GENERAL TALENTS</button>
</div>

<main>

    <!-- ВКЛАДКА 1: PURSUIT (ОСНОВНОЙ ЛИСТ) -->
    <div id="tab-pursuit" class="tab-content active">

        <!-- ШАПКА ЛИСТА -->
        <div class="top-grid">
            <div class="box">
                <div class="field-group">
                    <label>Fated Name</label>
                    <input type="text" id="charName" placeholder="И что ты придумал на этот раз?">
                </div>
                <div class="label-row">
                    <div class="field-group">
                        <label>Player Name</label>
                        <input type="text" id="playerName" placeholder="Напиши здесь свое красивое имя">
                    </div>
                    <div class="field-group">
                        <label>Species</label>
                        <input type="text" id="species" value="Human">
                    </div>
                </div>
            </div>

            <div class="box">
                <div class="field-group">
                    <label>Current Pursuits</label>
                    <input type="text" id="pursuit" placeholder="Пиши сюда свой класс">
                </div>
            </div>
        </div>

        <!-- ТЕЛО ЛИСТА -->
        <div class="sheet-body">

            <!-- ЛЕВАЯ КОЛОНКА -->
            <div>
                <!-- АСПЕКТЫ -->
                <div class="box">
                    <div class="box-header">ASPECTS</div>

                    <div class="aspects-grid">
                        <!-- Physical -->
                        <div class="aspect-subgroup">
                            <h4>Physical</h4>
                            <div class="aspect-row">
                                <span class="aspect-name">Might</span>
                                <div class="counter">
                                    <button onclick="modAspect('might', -1)">-</button>
                                    <span id="might">0</span>
                                    <button onclick="modAspect('might', 1)">+</button>
                                </div>
                            </div>
                            <div class="aspect-row">
                                <span class="aspect-name">Grace</span>
                                <div class="counter">
                                    <button onclick="modAspect('grace', -1)">-</button>
                                    <span id="grace">0</span>
                                    <button onclick="modAspect('grace', 1)">+</button>
                                </div>
                            </div>
                            <div class="aspect-row">
                                <span class="aspect-name">Speed</span>
                                <div class="counter">
                                    <button onclick="modAspect('speed', -1)">-</button>
                                    <span id="speed">0</span>
                                    <button onclick="modAspect('speed', 1)">+</button>
                                </div>
                            </div>
                            <div class="aspect-row">
                                <span class="aspect-name">Resilience</span>
                                <div class="counter">
                                    <button onclick="modAspect('resilience', -1)">-</button>
                                    <span id="resilience">0</span>
                                    <button onclick="modAspect('resilience', 1)">+</button>
                                </div>
                            </div>
                        </div>

                        <!-- Mental -->
                        <div class="aspect-subgroup">
                            <h4>Mental</h4>
                            <div class="aspect-row">
                                <span class="aspect-name">Intellect</span>
                                <div class="counter">
                                    <button onclick="modAspect('intellect', -1)">-</button>
                                    <span id="intellect">0</span>
                                    <button onclick="modAspect('intellect', 1)">+</button>
                                </div>
                            </div>
                            <div class="aspect-row">
                                <span class="aspect-name">Charm</span>
                                <div class="counter">
                                    <button onclick="modAspect('charm', -1)">-</button>
                                    <span id="charm">0</span>
                                    <button onclick="modAspect('charm', 1)">+</button>
                                </div>
                            </div>
                            <div class="aspect-row">
                                <span class="aspect-name">Cunning</span>
                                <div class="counter">
                                    <button onclick="modAspect('cunning', -1)">-</button>
                                    <span id="cunning">0</span>
                                    <button onclick="modAspect('cunning', 1)">+</button>
                                </div>
                            </div>
                            <div class="aspect-row">
                                <span class="aspect-name">Tenacity</span>
                                <div class="counter">
                                    <button onclick="modAspect('tenacity', -1)">-</button>
                                    <span id="tenacity">0</span>
                                    <button onclick="modAspect('tenacity', 1)">+</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- DERIVED ASPECTS -->
                <div class="box">
                    <div class="box-header">DERIVED ASPECTS</div>
                    <div class="derived-grid">
                        <div class="derived-cell">
                            <span>Defense</span>
                            <div class="defense-container">
                                <input type="number" id="defenseTotal" value="2" title="Итоговый Defense (со штрафом брони/бафами)">
                                <span>(</span>
                                <input type="number" id="defenseBase" value="2" title="Базовый Defense без брони">
                                <span>)</span>
                            </div>
                        </div>
                        <div class="derived-cell">
                            <span>Walk</span>
                            <input type="number" id="walk" value="4">
                        </div>

                        <div class="derived-cell">
                            <span>Armor</span>
                            <input type="number" id="armor" value="0" onchange="updateArmorPenalty()">
                        </div>
                        <div class="derived-cell">
                            <span>Charge</span>
                            <input type="number" id="charge" value="4">
                        </div>

                        <div class="derived-cell">
                            <span>Willpower</span>
                            <input type="number" id="willpower" value="2">
                        </div>
                        <div class="derived-cell">
                            <span>Initiative</span>
                            <input type="number" id="initiative" value="0">
                        </div>

                        <div class="derived-cell">
                            <span>Wounds</span>
                            <input type="number" id="wounds" value="4">
                        </div>
                        <div class="derived-cell">
                            <span>Height</span>
                            <input type="number" id="height" value="2">
                        </div>
                    </div>
                </div>

                <!-- ATTACKS -->
                <div class="box">
                    <div class="box-header">ATTACKS</div>
                    
                    <div class="attack-card">
                        <div class="attack-row-1">
                            <input type="text" placeholder="Attack Name (Оружие)">
                            <input type="text" placeholder="Special (Свойства)">
                        </div>
                        <div class="attack-stats-grid">
                            <div><label>AV</label><input type="text" placeholder="4"></div>
                            <div><label>Range</label><input type="text" placeholder="1"></div>
                            <div><label>Damage</label><input type="text" placeholder="2/3/4"></div>
                            <div><label>Capacity</label><input type="text" placeholder="-"></div>
                            <div><label>Reload</label><input type="text" placeholder="-"></div>
                            <div><label>TN</label><input type="text" placeholder="-"></div>
                        </div>
                        <input type="text" placeholder="Triggers (например: Ram: Critical Strike)">
                    </div>

                    <div class="attack-card">
                        <div class="attack-row-1">
                            <input type="text" placeholder="Attack Name (Второе оружие)">
                            <input type="text" placeholder="Special (Свойства)">
                        </div>
                        <div class="attack-stats-grid">
                            <div><label>AV</label><input type="text" placeholder="5"></div>
                            <div><label>Range</label><input type="text" placeholder="12"></div>
                            <div><label>Damage</label><input type="text" placeholder="2/4/5"></div>
                            <div><label>Capacity</label><input type="text" placeholder="6"></div>
                            <div><label>Reload</label><input type="text" placeholder="1"></div>
                            <div><label>TN</label><input type="text" placeholder="-"></div>
                        </div>
                        <input type="text" placeholder="Triggers (например: Ram: Critical Strike)">
                    </div>
                </div>
            </div>

            <!-- ПРАВАЯ КОЛОНКА: SKILLS -->
            <div>
                <div class="box">
                    <div class="box-header">SKILLS</div>
                    <table class="skills-table">
                        <thead>
                            <tr>
                                <th>SKILL</th>
                                <th style="width: 55px; text-align: center;">AV</th>
                                <th style="width: 65px; text-align: center;">RATING</th>
                                <th style="width: 125px;">ASPECT</th>
                                <th style="width: 35px;"></th>
                            </tr>
                        </thead>
                        <tbody id="skillsList">
                            <!-- Пусто при старте -->
                        </tbody>
                    </table>
                    <button class="add-row-btn" onclick="addNewSkillRow()">+ ДОБАВИТЬ НАВЫК</button>
                </div>
            </div>

        </div>
    </div>

    <!-- ВКЛАДКА 2: GENERAL TALENTS -->
    <div id="tab-talents" class="tab-content">
        <div class="box">
            <div class="box-header">TALENTS</div>
            
            <table class="talents-table">
                <thead>
                    <tr>
                        <th style="width: 250px;">GENERAL TALENTS</th>
                        <th>DESCRIPTION</th>
                        <th style="width: 40px;"></th>
                    </tr>
                </thead>
                <tbody id="talentsList">
                    <!-- Ровно 1 строка на старте -->
                    <tr>
                        <td>
                            <input type="text" class="talent-input-name" placeholder="Название таланта">
                        </td>
                        <td>
                            <textarea class="talent-input-desc" placeholder="Описание эффекта или правил таланта"></textarea>
                        </td>
                        <td>
                            <button class="del-btn" onclick="deleteTalentRow(this.closest('tr'))" title="Удалить">✕</button>
                        </td>
                    </tr>
                </tbody>
            </table>

            <button class="add-row-btn" onclick="addNewTalentRow()">+ ДОБАВИТЬ ТАЛАНТ</button>
        </div>
    </div>

</main>

<script>
    // ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
    function switchTab(tabKey) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        if (tabKey === 'pursuit') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-pursuit').classList.add('active');
        } else if (tabKey === 'talents') {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-talents').classList.add('active');
        }
    }

    // ТАЛАНТЫ: функции добавления и удаления
    function addNewTalentRow() {
        const tbody = document.getElementById("talentsList");
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>
                <input type="text" class="talent-input-name" placeholder="Название таланта">
            </td>
            <td>
                <textarea class="talent-input-desc" placeholder="Описание эффекта или правил таланта"></textarea>
            </td>
            <td>
                <button class="del-btn" onclick="deleteTalentRow(this.closest('tr'))" title="Удалить">✕</button>
            </td>
        `;
        tbody.appendChild(tr);
    }

    function deleteTalentRow(tr) {
        tr.remove();
    }

    // АСПЕКТЫ
    const aspects = {
        might: 0, grace: 0, speed: 0, resilience: 0,
        intellect: 0, charm: 0, cunning: 0, tenacity: 0
    };

    // Навыки по 8 категориям
    const skillCategories = {
        "Academic": {
            "Bureaucracy": "cunning",
            "Engineering": "intellect",
            "History": "intellect",
            "Literacy": "intellect",
            "Mathematics": "intellect",
            "Music": "charm"
        },
        "Close Combat": {
            "Flexible": "grace",
            "Grappling": "speed",
            "Heavy Melee": "might",
            "Martial Arts": "speed",
            "Melee": "might",
            "Pneumatic": "might",
            "Pugilism": "might"
        },
        "Crafting": {
            "Alchemistry": "intellect",
            "Art": "cunning",
            "Artefacting": "intellect",
            "Blacksmithing": "intellect",
            "Culinary": "charm",
            "Explosives": "intellect",
            "Homesteading": "tenacity",
            "Printing": "intellect",
            "Stitching": "tenacity"
        },
        "Expertise": {
            "Doctor": "intellect",
            "Forgery": "cunning",
            "Gambling": "cunning",
            "Husbandry": "charm",
            "Lockpicking": "grace",
            "Notice": "cunning",
            "Track": "cunning",
            "Wilderness": "cunning"
        },
        "Magical": {
            "Counter-Spelling": "tenacity",
            "Enchanting": ["charm", "cunning"],
            "Necromancy": ["charm", "tenacity"],
            "Prestidigitation": ["intellect", "cunning"],
            "Sorcery": ["intellect", "tenacity"]
        },
        "Ranged Combat": {
            "Archery": "grace",
            "Heavy Guns": "might",
            "Long Arms": "intellect",
            "Pistol": "grace",
            "Shotgun": "grace",
            "Thrown": "grace"
        },
        "Social": {
            "Barter": "tenacity",
            "Bewitch": "charm",
            "Convince": "intellect",
            "Deceive": "cunning",
            "Intimidate": "tenacity",
            "Leadership": "charm",
            "Scrutiny": "cunning"
        },
        "Training": {
            "Acrobatics": "grace",
            "Athletics": "might",
            "Carouse": "resilience",
            "Centering": "tenacity",
            "Evade": "speed",
            "Pick Pocket": "speed",
            "Stealth": "cunning",
            "Toughness": "resilience"
        }
    };

    function findSkillAspectDef(name) {
        for (let cat in skillCategories) {
            if (skillCategories[cat][name] !== undefined) {
                return skillCategories[cat][name];
            }
        }
        return "";
    }

    function getSkillOptionsHtml() {
        let html = `<option value="">-- Выбери навык --</option>`;
        for (let cat in skillCategories) {
            html += `<optgroup label="${cat}">`;
            for (let sk of Object.keys(skillCategories[cat]).sort()) {
                html += `<option value="${sk}">${sk}</option>`;
            }
            html += `</optgroup>`;
        }
        return html;
    }

    function getAspectSelectHtml(defaultVal = "") {
        const list = ["might", "grace", "speed", "resilience", "intellect", "charm", "cunning", "tenacity"];
        let html = `<select class="skill-aspect" onchange="updateRowAV(this.closest('tr'))">`;
        html += `<option value="">—</option>`;
        list.forEach(asp => {
            const cap = asp.charAt(0).toUpperCase() + asp.slice(1);
            const sel = asp === defaultVal ? "selected" : "";
            html += `<option value="${asp}" ${sel}>${cap}</option>`;
        });
        html += `</select>`;
        return html;
    }

    function modAspect(stat, delta) {
        aspects[stat] += delta;
        document.getElementById(stat).textContent = aspects[stat];
        updateDerived();
        updateAllSkillAVs();
    }

    function getSkillRank(skillName) {
        const rows = document.querySelectorAll("#skillsList tr");
        let maxRank = 0;
        for (let tr of rows) {
            const select = tr.querySelector(".skill-select");
            if (select && select.value.toLowerCase() === skillName.toLowerCase()) {
                const rank = parseInt(tr.querySelector(".skill-rating").value) || 0;
                if (rank > maxRank) maxRank = rank;
            }
        }
        return maxRank;
    }

    function updateDerived() {
        const evade = getSkillRank("Evade");
        const centering = getSkillRank("Centering");
        const notice = getSkillRank("Notice");
        const toughness = getSkillRank("Toughness");

        const defBonus = Math.max(0, evade, aspects.speed);
        const baseDef = 2 + defBonus;
        document.getElementById("defenseBase").value = baseDef;

        const armor = parseInt(document.getElementById("armor").value) || 0;
        const armorPenalty = armor > 0 ? 1 : 0;
        document.getElementById("defenseTotal").value = Math.max(1, baseDef - armorPenalty);

        const wpBonus = Math.max(0, centering, aspects.tenacity);
        document.getElementById("willpower").value = 2 + wpBonus;

        document.getElementById("initiative").value = aspects.speed + notice;

        let resBonus = 0;
        if (aspects.resilience > 0) {
            resBonus = Math.ceil(aspects.resilience / 2);
        }
        document.getElementById("wounds").value = 4 + toughness + resBonus;

        const walkVal = 4 + Math.ceil(aspects.speed / 2);
        document.getElementById("walk").value = walkVal;

        const rawCharge = 4 + aspects.speed;
        document.getElementById("charge").value = Math.max(rawCharge, walkVal);
    }

    function updateArmorPenalty() {
        const baseDef = parseInt(document.getElementById("defenseBase").value) || 2;
        const armor = parseInt(document.getElementById("armor").value) || 0;
        const armorPenalty = armor > 0 ? 1 : 0;
        document.getElementById("defenseTotal").value = Math.max(1, baseDef - armorPenalty);
    }

    function addNewSkillRow() {
        const tbody = document.getElementById("skillsList");
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>
                <select class="skill-select" onchange="onSkillSelectChange(this.closest('tr'))">
                    ${getSkillOptionsHtml()}
                </select>
            </td>
            <td class="av-container">
                <div class="av-box av-val">—</div>
            </td>
            <td>
                <input type="number" class="skill-rating" value="0" min="0" max="5" oninput="onRatingChange(this.closest('tr'))">
            </td>
            <td class="aspect-container">
                ${getAspectSelectHtml("")}
            </td>
            <td>
                <button class="del-btn" onclick="deleteSkillRow(this.closest('tr'))" title="Удалить">✕</button>
            </td>
        `;
        tbody.appendChild(tr);
    }

    function onSkillSelectChange(tr) {
        const skillName = tr.querySelector(".skill-select").value;
        const aspectDef = findSkillAspectDef(skillName);
        const avContainer = tr.querySelector(".av-container");
        const aspectContainer = tr.querySelector(".aspect-container");

        if (Array.isArray(aspectDef)) {
            avContainer.innerHTML = `
                <div class="dual-stack">
                    <div class="av-box av-val">—</div>
                    <div class="av-box av-val">—</div>
                </div>
            `;
            aspectContainer.innerHTML = `
                <div class="dual-stack">
                    ${getAspectSelectHtml(aspectDef[0])}
                    ${getAspectSelectHtml(aspectDef[1])}
                </div>
            `;
        } else {
            avContainer.innerHTML = `<div class="av-box av-val">—</div>`;
            aspectContainer.innerHTML = getAspectSelectHtml(aspectDef || "");
        }

        updateRowAV(tr);
        updateDerived();
    }

    function onRatingChange(tr) {
        updateRowAV(tr);
        updateDerived();
    }

    function deleteSkillRow(tr) {
        tr.remove();
        updateDerived();
    }

    function updateRowAV(tr) {
        const rating = parseInt(tr.querySelector(".skill-rating").value) || 0;
        const avCells = tr.querySelectorAll(".av-val");
        const aspectSelects = tr.querySelectorAll(".skill-aspect");

        aspectSelects.forEach((sel, idx) => {
            const aspectKey = sel.value;
            if (!aspectKey) {
                avCells[idx].textContent = "—";
            } else {
                avCells[idx].textContent = rating + (aspects[aspectKey] || 0);
            }
        });
    }

    function updateAllSkillAVs() {
        const rows = document.querySelectorAll("#skillsList tr");
        rows.forEach(tr => updateRowAV(tr));
    }

    updateDerived();
</script>

</body>
</html>
