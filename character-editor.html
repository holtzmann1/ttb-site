<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание персонажа — Through the Breach</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 20%, #30251b 0%, #17130f 45%, #0b0a09 100%);
            color: #e8dfd0;
            font-family: Georgia, serif;
        }

        header {
            padding: 20px 50px;
            border-bottom: 1px solid #4a3825;
            background: rgba(10, 9, 8, 0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-button {
            color: #8f8679;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .back-button:hover {
            color: #c59a5b;
        }

        .sheet-title {
            color: #c59a5b;
            font-size: 20px;
            letter-spacing: 2px;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Общие стили полей ввода */
        input[type="text"], input[type="number"], select, textarea {
            background: #14110e;
            border: 1px solid #4a3825;
            color: #e8dfd0;
            font-family: Georgia, serif;
            font-size: 15px;
            padding: 8px 10px;
            outline: none;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #b88a4a;
        }

        .box {
            border: 1px solid #4a3825;
            background: rgba(10, 9, 8, 0.6);
            padding: 15px;
            margin-bottom: 25px;
        }

        .box-header {
            margin: 0 0 15px 0;
            color: #c59a5b;
            font-size: 20px;
            font-weight: normal;
            letter-spacing: 1.5px;
            text-align: center;
            border-bottom: 1px solid #33271a;
            padding-bottom: 6px;
        }

        /* 1. ШАПКА ЛИСТА (HEADER) */
        .top-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        .label-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .field-group label {
            display: block;
            font-size: 12px;
            color: #a99e8d;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        /* 2. ДВУХКОЛОНОЧНЫЙ МАКЕТ (КАК В ОРИГИНАЛЕ) */
        .sheet-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        /* Аспекты Physical / Mental */
        .aspects-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .aspect-subgroup h4 {
            margin: 0 0 10px 0;
            text-align: center;
            color: #a99e8d;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .aspect-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 17, 14, 0.8);
            border: 1px solid #382b1d;
            padding: 6px 10px;
            margin-bottom: 8px;
        }

        .aspect-name {
            font-size: 15px;
        }

        .counter {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .counter button {
            width: 26px;
            height: 26px;
            background: #14110e;
            border: 1px solid #4a3825;
            color: #c59a5b;
            cursor: pointer;
            font-family: monospace;
        }

        .counter button:hover {
            background: #b88a4a;
            color: #000;
        }

        .counter span {
            min-width: 25px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        /* Кнопка генерации */
        .gen-btn {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1px dashed #b88a4a;
            color: #c59a5b;
            cursor: pointer;
            letter-spacing: 1px;
            font-family: Georgia, serif;
            margin-bottom: 15px;
        }

        .gen-btn:hover {
            background: rgba(184, 138, 74, 0.15);
        }

        /* Derived Aspects */
        .derived-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .derived-cell {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 17, 14, 0.8);
            border: 1px solid #382b1d;
            padding: 8px 12px;
        }

        .derived-cell span:first-child {
            color: #a99e8d;
            font-size: 14px;
        }

        .derived-val {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        /* Справка по атакам */
        .attack-card {
            border: 1px solid #382b1d;
            background: rgba(16, 14, 11, 0.85);
            padding: 10px;
            margin-bottom: 12px;
        }

        .attack-row-1 {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 10px;
            margin-bottom: 8px;
        }

        .attack-stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 8px;
        }

        .attack-stats-grid div {
            text-align: center;
        }

        .attack-stats-grid label {
            display: block;
            font-size: 10px;
            color: #8f8679;
            margin-bottom: 3px;
        }

        .attack-stats-grid input {
            text-align: center;
            padding: 4px;
            font-size: 13px;
        }

        /* Таблица навыков (правая колонка) */
        .skills-table {
            width: 100%;
            border-collapse: collapse;
        }

        .skills-table th {
            text-align: left;
            padding: 6px;
            color: #a99e8d;
            font-size: 13px;
            letter-spacing: 1px;
            border-bottom: 1px solid #4a3825;
        }

        .skills-table td {
            padding: 4px;
        }

        .skills-table td.av-val {
            text-align: center;
            font-weight: bold;
            color: #c59a5b;
            font-size: 16px;
            background: #14110e;
            border: 1px solid #2a2015;
            width: 45px;
        }

        .add-skill-btn {
            margin-top: 10px;
            padding: 8px;
            background: transparent;
            border: 1px solid #4a3825;
            color: #c59a5b;
            cursor: pointer;
            font-family: Georgia, serif;
            width: 100%;
        }

        .add-skill-btn:hover {
            border-color: #b88a4a;
        }

        @media (max-width: 900px) {
            .top-grid, .sheet-body {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <a href="characters.html" class="back-button">← НАЗАД К СПИСКУ</a>
    <div class="sheet-title">CHARACTER SHEET</div>
</header>

<main>

    <!-- 1. ШАПКА ЛИСТА ПЕРСОНАЖА -->
    <div class="top-grid">
        <div class="box">
            <div class="field-group">
                <label>Fated Name</label>
                <input type="text" id="charName" placeholder="Имя персонажа">
            </div>
            <div class="label-row">
                <div class="field-group">
                    <label>Player Name</label>
                    <input type="text" id="playerName" placeholder="Имя игрока">
                </div>
                <div class="field-group">
                    <label>Species</label>
                    <input type="text" id="species" value="Human">
                </div>
            </div>
        </div>

        <div class="box">
            <div class="field-group">
                <label>Current Pursuits</label>
                <input type="text" id="pursuit" placeholder="Текущая профессия">
            </div>
            <div class="field-group" style="margin-top: 10px;">
                <label>Characteristics</label>
                <input type="text" id="characteristics" placeholder="Особенности / Дескрипторы">
            </div>
        </div>
    </div>

    <!-- 2. ОСНОВНОЕ ТЕЛО ЛИСТА -->
    <div class="sheet-body">

        <!-- ЛЕВАЯ КОЛОНКА: АСПЕКТЫ, ПРОИЗВОДНЫЕ И АТАКИ -->
        <div>
            <!-- Аспекты -->
            <div class="box">
                <div class="box-header">ASPECTS</div>
                <button class="gen-btn" onclick="randomizeStats()">🎲 Сгенерировать статы (Fate Draw)</button>

                <div class="aspects-grid">
                    <!-- Physical -->
                    <div class="aspect-subgroup">
                        <h4>Physical</h4>
                        <div class="aspect-row">
                            <span class="aspect-name">Might</span>
                            <div class="counter">
                                <button onclick="modAspect('might', -1)">-</button>
                                <span id="might">0</span>
                                <button onclick="modAspect('might', 1)">+</button>
                            </div>
                        </div>
                        <div class="aspect-row">
                            <span class="aspect-name">Grace</span>
                            <div class="counter">
                                <button onclick="modAspect('grace', -1)">-</button>
                                <span id="grace">0</span>
                                <button onclick="modAspect('grace', 1)">+</button>
                            </div>
                        </div>
                        <div class="aspect-row">
                            <span class="aspect-name">Speed</span>
                            <div class="counter">
                                <button onclick="modAspect('speed', -1)">-</button>
                                <span id="speed">0</span>
                                <button onclick="modAspect('speed', 1)">+</button>
                            </div>
                        </div>
                        <div class="aspect-row">
                            <span class="aspect-name">Resilience</span>
                            <div class="counter">
                                <button onclick="modAspect('resilience', -1)">-</button>
                                <span id="resilience">0</span>
                                <button onclick="modAspect('resilience', 1)">+</button>
                            </div>
                        </div>
                    </div>

                    <!-- Mental -->
                    <div class="aspect-subgroup">
                        <h4>Mental</h4>
                        <div class="aspect-row">
                            <span class="aspect-name">Intellect</span>
                            <div class="counter">
                                <button onclick="modAspect('intellect', -1)">-</button>
                                <span id="intellect">0</span>
                                <button onclick="modAspect('intellect', 1)">+</button>
                            </div>
                        </div>
                        <div class="aspect-row">
                            <span class="aspect-name">Charm</span>
                            <div class="counter">
                                <button onclick="modAspect('charm', -1)">-</button>
                                <span id="charm">0</span>
                                <button onclick="modAspect('charm', 1)">+</button>
                            </div>
                        </div>
                        <div class="aspect-row">
                            <span class="aspect-name">Cunning</span>
                            <div class="counter">
                                <button onclick="modAspect('cunning', -1)">-</button>
                                <span id="cunning">0</span>
                                <button onclick="modAspect('cunning', 1)">+</button>
                            </div>
                        </div>
                        <div class="aspect-row">
                            <span class="aspect-name">Tenacity</span>
                            <div class="counter">
                                <button onclick="modAspect('tenacity', -1)">-</button>
                                <span id="tenacity">0</span>
                                <button onclick="modAspect('tenacity', 1)">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Производные характеристики -->
            <div class="box">
                <div class="box-header">DERIVED ASPECTS</div>
                <div class="derived-grid">
                    <div class="derived-cell">
                        <span>Defense</span>
                        <span class="derived-val" id="defense">2</span>
                    </div>
                    <div class="derived-cell">
                        <span>Walk</span>
                        <span class="derived-val" id="walk">4</span>
                    </div>

                    <div class="derived-cell">
                        <span>Armor</span>
                        <input type="number" id="armor" value="0" style="width: 50px; text-align: center; padding: 2px;">
                    </div>
                    <div class="derived-cell">
                        <span>Charge</span>
                        <span class="derived-val" id="charge">4</span>
                    </div>

                    <div class="derived-cell">
                        <span>Willpower</span>
                        <span class="derived-val" id="willpower">3</span>
                    </div>
                    <div class="derived-cell">
                        <span>Initiative</span>
                        <span class="derived-val" id="initiative">0</span>
                    </div>

                    <div class="derived-cell">
                        <span>Wounds</span>
                        <span class="derived-val" id="wounds">6</span>
                    </div>
                    <div class="derived-cell">
                        <span>Height</span>
                        <input type="number" id="height" value="2" style="width: 50px; text-align: center; padding: 2px;">
                    </div>
                </div>
            </div>

            <!-- Атаки и оружие -->
            <div class="box">
                <div class="box-header">ATTACKS</div>
                
                <!-- Атака 1 -->
                <div class="attack-card">
                    <div class="attack-row-1">
                        <input type="text" placeholder="Attack Name (Оружие)">
                        <input type="text" placeholder="Special (Свойства)">
                    </div>
                    <div class="attack-stats-grid">
                        <div><label>AV</label><input type="text" placeholder="4"></div>
                        <div><label>Range</label><input type="text" placeholder="1"></div>
                        <div><label>Damage</label><input type="text" placeholder="2/3/4"></div>
                        <div><label>Capacity</label><input type="text" placeholder="-"></div>
                        <div><label>Reload</label><input type="text" placeholder="-"></div>
                        <div><label>TN</label><input type="text" placeholder="-"></div>
                    </div>
                    <input type="text" placeholder="Triggers (например: Tome: Critical Strike)">
                </div>

                <!-- Атака 2 -->
                <div class="attack-card">
                    <div class="attack-row-1">
                        <input type="text" placeholder="Attack Name (Второе оружие)">
                        <input type="text" placeholder="Special (Свойства)">
                    </div>
                    <div class="attack-stats-grid">
                        <div><label>AV</label><input type="text" placeholder="5"></div>
                        <div><label>Range</label><input type="text" placeholder="12"></div>
                        <div><label>Damage</label><input type="text" placeholder="2/4/5"></div>
                        <div><label>Capacity</label><input type="text" placeholder="6"></div>
                        <div><label>Reload</label><input type="text" placeholder="1"></div>
                        <div><label>TN</label><input type="text" placeholder="-"></div>
                    </div>
                    <input type="text" placeholder="Triggers">
                </div>
            </div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА: ТАБЛИЦА НАВЫКОВ -->
        <div>
            <div class="box">
                <div class="box-header">SKILLS</div>
                <table class="skills-table">
                    <thead>
                        <tr>
                            <th>SKILL</th>
                            <th style="width: 55px; text-align: center;">AV</th>
                            <th style="width: 65px; text-align: center;">RATING</th>
                            <th style="width: 110px;">ASPECT</th>
                        </tr>
                    </thead>
                    <tbody id="skillsList">
                        <!-- Навыки генерируются и пересчитываются через JS -->
                    </tbody>
                </table>
                <button class="add-skill-btn" onclick="addNewSkillRow('', 0, 'might')">+ ДОБАВИТЬ НАВЫК</button>
            </div>
        </div>

    </div>

</main>

<script>
    // 1. Состояние аспектов
    const aspects = {
        might: 0, grace: 0, speed: 0, resilience: 0,
        intellect: 0, charm: 0, cunning: 0, tenacity: 0
    };

    // Стартовый базовый список навыков Through the Breach
    const defaultSkills = [
        { name: "Melee", rating: 1, aspect: "might" },
        { name: "Pugilism", rating: 0, aspect: "might" },
        { name: "Heavy Melee", rating: 0, aspect: "might" },
        { name: "Pistol", rating: 1, aspect: "grace" },
        { name: "Long Arms", rating: 0, aspect: "grace" },
        { name: "Evade", rating: 1, aspect: "speed" },
        { name: "Athletics", rating: 0, aspect: "speed" },
        { name: "Toughness", rating: 0, aspect: "resilience" },
        { name: "Notice", rating: 1, aspect: "cunning" },
        { name: "Stealth", rating: 0, aspect: "cunning" },
        { name: "Convince", rating: 0, aspect: "charm" },
        { name: "Deceive", rating: 0, aspect: "charm" },
        { name: "Doctor", rating: 0, aspect: "intellect" },
        { name: "Centering", rating: 1, aspect: "tenacity" }
    ];

    // Ручное изменение аспекта через кнопки + / -
    function modAspect(stat, delta) {
        aspects[stat] += delta;
        document.getElementById(stat).textContent = aspects[stat];
        updateDerived();
        updateAllSkillAVs();
    }

    // Генерация статов (симуляция расклада Fate Deck)
    function randomizeStats() {
        // Официальный балансировочный пул очков TTB (от сильных сторон к слабым)
        const spread = [2, 1, 1, 0, 0, 0, -1, -1];
        
        // Случайно перемешиваем значения
        for (let i = spread.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [spread[i], spread[j]] = [spread[j], spread[i]];
        }

        const keys = Object.keys(aspects);
        keys.forEach((key, index) => {
            aspects[key] = spread[index];
            document.getElementById(key).textContent = aspects[key];
        });

        updateDerived();
        updateAllSkillAVs();
    }

    // Расчет производных характеристик
    function updateDerived() {
        document.getElementById("defense").textContent = 2 + aspects.speed;
        document.getElementById("walk").textContent = 4 + aspects.speed;
        document.getElementById("charge").textContent = 4 + aspects.speed;
        document.getElementById("initiative").textContent = aspects.speed;
        document.getElementById("willpower").textContent = 3 + aspects.tenacity;
        document.getElementById("wounds").textContent = 6 + aspects.resilience;
    }

    // Добавление строки навыка
    function addNewSkillRow(name = "", rating = 0, aspect = "might") {
        const tbody = document.getElementById("skillsList");
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td><input type="text" value="${name}" placeholder="Название навыка"></td>
            <td class="av-val">0</td>
            <td><input type="number" class="skill-rating" value="${rating}" min="0" max="5" onchange="updateRowAV(this.closest('tr'))"></td>
            <td>
                <select class="skill-aspect" onchange="updateRowAV(this.closest('tr'))">
                    <option value="might" ${aspect === 'might' ? 'selected' : ''}>Might</option>
                    <option value="grace" ${aspect === 'grace' ? 'selected' : ''}>Grace</option>
                    <option value="speed" ${aspect === 'speed' ? 'selected' : ''}>Speed</option>
                    <option value="resilience" ${aspect === 'resilience' ? 'selected' : ''}>Resilience</option>
                    <option value="intellect" ${aspect === 'intellect' ? 'selected' : ''}>Intellect</option>
                    <option value="charm" ${aspect === 'charm' ? 'selected' : ''}>Charm</option>
                    <option value="cunning" ${aspect === 'cunning' ? 'selected' : ''}>Cunning</option>
                    <option value="tenacity" ${aspect === 'tenacity' ? 'selected' : ''}>Tenacity</option>
                </select>
            </td>
        `;

        tbody.appendChild(tr);
        updateRowAV(tr);
    }

    // Подсчет AV для конкретной строки: AV = Rating + выбранный Аспект
    function updateRowAV(tr) {
        const rating = parseInt(tr.querySelector(".skill-rating").value) || 0;
        const aspectKey = tr.querySelector(".skill-aspect").value;
        const avCell = tr.querySelector(".av-val");
        
        const totalAV = rating + (aspects[aspectKey] || 0);
        avCell.textContent = totalAV;
    }

    // Пересчет AV сразу во всей таблице навыков
    function updateAllSkillAVs() {
        const rows = document.querySelectorAll("#skillsList tr");
        rows.forEach(tr => updateRowAV(tr));
    }

    // Инициализация при старте
    defaultSkills.forEach(s => addNewSkillRow(s.name, s.rating, s.aspect));
    updateDerived();
</script>

</body>
</html>
