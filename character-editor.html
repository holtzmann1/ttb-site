<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание персонажа — Through the Breach</title>
    <!-- ПОДКЛЮЧАЕМ БАЗУ ТАЛАНТОВ (с версионированием для мобильного кэша) -->
    <script src="talents-data.js?v=2"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 20%, #30251b 0%, #17130f 45%, #0b0a09 100%);
            color: #e8dfd0;
            font-family: Georgia, serif;
        }

        header {
            padding: 20px 50px;
            border-bottom: 1px solid #4a3825;
            background: rgba(10, 9, 8, 0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-button {
            color: #8f8679;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .back-button:hover {
            color: #c59a5b;
        }

        .sheet-title {
            color: #c59a5b;
            font-size: 20px;
            letter-spacing: 2px;
        }

        .tab-bar {
            max-width: 1200px;
            margin: 20px auto 0 auto;
            padding: 0 20px;
            display: flex;
            gap: 15px;
        }

        .tab-btn {
            background: rgba(14, 11, 9, 0.85);
            border: 1px solid #4a3825;
            color: #8f8679;
            padding: 10px 24px;
            font-family: Georgia, serif;
            font-size: 13px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: #e8dfd0;
            border-color: #b88a4a;
        }

        .tab-btn.active {
            color: #c59a5b;
            border-color: #c59a5b;
            background: rgba(45, 33, 21, 0.6);
            box-shadow: inset 0 0 10px rgba(197, 154, 91, 0.2);
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 25px 20px 40px 20px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        input[type="text"], input[type="number"], select, textarea {
            background: #14110e;
            border: 1px solid #4a3825;
            color: #e8dfd0;
            font-family: Georgia, serif;
            font-size: 15px;
            padding: 8px 10px;
            outline: none;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #b88a4a;
        }

        optgroup {
            background: #1e1914;
            color: #c59a5b;
            font-style: normal;
            font-weight: bold;
        }

        option {
            background: #14110e;
            color: #e8dfd0;
            font-weight: normal;
        }

        .box {
            border: 1px solid #4a3825;
            background: rgba(10, 9, 8, 0.6);
            padding: 15px;
            margin-bottom: 25px;
        }

        .box-header {
            margin: 0 0 15px 0;
            color: #c59a5b;
            font-size: 20px;
            font-weight: normal;
            letter-spacing: 1.5px;
            text-align: center;
            border-bottom: 1px solid #33271a;
            padding-bottom: 6px;
        }

        .top-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        .label-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .field-group label {
            display: block;
            font-size: 12px;
            color: #a99e8d;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .sheet-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .aspects-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .aspect-subgroup h4 {
            margin: 0 0 10px 0;
            text-align: center;
            color: #a99e8d;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .aspect-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 17, 14, 0.8);
            border: 1px solid #382b1d;
            padding: 6px 10px;
            margin-bottom: 8px;
        }

        .aspect-name {
            font-size: 15px;
        }

        .counter {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .counter button {
            width: 26px;
            height: 26px;
            background: #14110e;
            border: 1px solid #4a3825;
            color: #c59a5b;
            cursor: pointer;
            font-family: monospace;
        }

        .counter button:hover {
            background: #b88a4a;
            color: #000;
        }

        .counter span {
            min-width: 25px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .derived-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .derived-cell {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 17, 14, 0.8);
            border: 1px solid #382b1d;
            padding: 6px 10px;
        }

        .derived-cell span:first-child {
            color: #a99e8d;
            font-size: 13px;
        }

        .derived-cell input {
            width: 65px;
            text-align: center;
            padding: 4px;
            font-size: 16px;
            font-weight: bold;
        }

        .defense-container {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .defense-container input {
            width: 44px;
            text-align: center;
            padding: 4px;
            font-size: 15px;
            font-weight: bold;
        }

        .attack-card {
            border: 1px solid #382b1d;
            background: rgba(16, 14, 11, 0.85);
            padding: 10px;
            margin-bottom: 12px;
        }

        .attack-row-1 {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 10px;
            margin-bottom: 8px;
        }

        .attack-stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 8px;
        }

        .attack-stats-grid div {
            text-align: center;
        }

        .attack-stats-grid label {
            display: block;
            font-size: 10px;
            color: #8f8679;
            margin-bottom: 3px;
        }

        .attack-stats-grid input {
            text-align: center;
            padding: 4px;
            font-size: 13px;
        }

        .skills-table {
            width: 100%;
            border-collapse: collapse;
        }

        .skills-table th {
            text-align: left;
            padding: 6px;
            color: #a99e8d;
            font-size: 13px;
            letter-spacing: 1px;
            border-bottom: 1px solid #4a3825;
        }

        .skills-table td {
            padding: 4px;
            vertical-align: middle;
        }

        .dual-stack {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .av-box {
            text-align: center;
            font-weight: bold;
            color: #c59a5b;
            font-size: 16px;
            background: #14110e;
            border: 1px solid #2a2015;
            padding: 6px 0;
            width: 45px;
            min-height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .del-btn {
            background: transparent;
            border: 1px solid #4a3825;
            color: #8f8679;
            cursor: pointer;
            padding: 6px 10px;
            font-size: 12px;
        }

        .del-btn:hover {
            color: #e57373;
            border-color: #e57373;
        }

        .add-row-btn {
            margin-top: 15px;
            padding: 10px;
            background: transparent;
            border: 1px dashed #b88a4a;
            color: #c59a5b;
            cursor: pointer;
            font-family: Georgia, serif;
            letter-spacing: 1px;
            width: 100%;
        }

        .add-row-btn:hover {
            background: rgba(184, 138, 74, 0.15);
        }

        /* АККОРДЕОН ТАЛАНТОВ */
        .talent-card {
            border: 1px solid #3d2f21;
            background: rgba(18, 15, 12, 0.85);
            margin-bottom: 10px;
        }

        .talent-header-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
        }

        .toggle-btn {
            background: transparent;
            border: 1px solid #4a3825;
            color: #c59a5b;
            cursor: pointer;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }

        .toggle-btn:hover {
            border-color: #b88a4a;
            background: rgba(184, 138, 74, 0.15);
        }

        .talent-body {
            display: none;
            padding: 12px 14px 14px 14px;
            border-top: 1px solid #2a2015;
            background: rgba(12, 10, 8, 0.6);
        }

        .talent-meta-info {
            font-size: 13px;
            color: #a99e8d;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .talent-meta-info span {
            color: #c59a5b;
            font-weight: bold;
        }

        .talent-desc-area {
            min-height: 70px;
            resize: vertical;
            line-height: 1.5;
            font-size: 14px;
        }

        @media (max-width: 900px) {
            .top-grid, .sheet-body {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<header>

<main>

                    <div class="box-header">ASPECTS</div>

                                    <button onclick="modAspect('grace', -1)">-</button>

                                    <button onclick="modAspect('grace', 1)">+</button>
                                </div>
                            </div>
                            <div class="aspect-row">
                                <span class="aspect-name">Speed</span>
                                <div class="counter">
                                    <button onclick="modAspect('speed', -1)">-</button>
                                    <span id="speed">0</span>
                                    <button onclick="modAspect('speed', 1)">+</button>
                                </div>
                            </div>
                            <div class="aspect-row">
                                <span class="aspect-name">Resilience</span>
                                <div class="counter">
                                    <button onclick="modAspect('resilience', -1)">-</button>
                                    <span id="resilience">0</span>

                                <div class="counter">

                                    <span id="intellect">0</span>

                            <div class="aspect-row">

<script>
    function switchTab(tabKey) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        if (tabKey === 'pursuit') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.ElementById('tab-pursuit').classList.add('active');
        } else if (tabKey === 'talents') {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-talents').classList.add('active');
        }
    }

// === ОБНОВЛЕННАЯ УМНАЯ ПРОВЕРКА ТРЕБОВАНИЙ ТАЛАНТОВ ===
    function checkTalentRequirements(talent) {
        const reqStr = talent.req ? talent.req.trim() : "None";
        if (!reqStr || reqStr.toLowerCase() === "none") return true;

        const parts = reqStr.split(",").map(p => p.trim());
        const speciesVal = (document.getElementById("species")?.value || "Human").toLowerCase();

        for (let part of parts) {
            // Игнорируем сюжетные/нарративные требования, чтобы они не ломали фильтр
            if (/^Destiny:/i.test(part) || /^Book/i.test(part)) continue;

            // 1. Аспекты: поддержка минусов, диапазонов и связки OR (например, "Charm -2 or Tenacity -2")
            if (/Aspect:/i.test(part) || /(Might|Grace|Speed|Resilience|Intellect|Charm|Cunning|Tenacity)\s*(-?\d+)/i.test(part)) {
                // Особые общие условия
                if (/Two Aspects -3 or less/i.test(part)) {
                    if (Object.values(aspects).filter(v => v <= -3).length < 2) return false;
                    continue;
                }
                if (/No Aspects higher than 1/i.test(part)) {
                    if (Object.values(aspects).some(v => v > 1)) return false;
                    continue;
                }
                if (/Physical Aspect\s*(\d+)\s*or higher/i.test(part)) {
                    const target = parseInt(part.match(/Physical Aspect\s*(\d+)\s*or higher/i)[1], 10);
                    if (![aspects.might, aspects.grace, aspects.speed, aspects.resilience].some(v => v >= target)) return false;
                    continue;
                }
                if (/Mental Aspect\s*(-?\d+)\s*(or less|or lower)/i.test(part)) {
                    const target = parseInt(part.match(/Mental Aspect\s*(-?\d+)\s*(or less|or lower)/i)[1], 10);
                    if (![aspects.intellect, aspects.charm, aspects.cunning, aspects.tenacity].some(v => v <= target)) return false;
                    continue;
                }
                if (/Mental Aspect\s*(\d+)\s*or higher/i.test(part)) {
                    const target = parseInt(part.match(/Mental Aspect\s*(\d+)\s*or higher/i)[1], 10);
                    if (![aspects.intellect, aspects.charm, aspects.cunning, aspects.tenacity].some(v => v >= target)) return false;
                    continue;
                }

                // Обработка стандартных аспектов: "Aspect: Tenacity -2 or lower" или "Tenacity -2 or Charm -2"
                const subClauses = part.replace(/^Aspect:\s*/i, "").split(/\s+or\s+/i);
                
                // Проверяем каждое подусловие через ИЛИ (если хотя бы одно верно — пропускаем)
                let orPassed = false;
                for (let sub of subClauses) {
                    const match = sub.match(/(Might|Grace|Speed|Resilience|Intellect|Charm|Cunning|Tenacity)\s*(-?\d+)\s*(or higher|or lower|or less|\+)?/i);
                    if (match) {
                        const aspKey = match[1].toLowerCase();
                        const targetVal = parseInt(match[2], 10);
                        const cond = (match[3] || (targetVal < 0 ? "or lower" : "or higher")).toLowerCase();
                        const currentVal = aspects[aspKey] !== undefined ? aspects[aspKey] : 0;

                        if ((cond.includes("lower") || cond.includes("less")) && currentVal <= targetVal) {
                            orPassed = true;
                            break;
                        } else if ((cond.includes("higher") || cond === "+") && currentVal >= targetVal) {
                            orPassed = true;
                            break;
                        } else if (currentVal === targetVal) {
                            orPassed = true;
                            break;
                        }
                    }
                }
                if (!orPassed && subClauses.some(s => /(Might|Grace|Speed|Resilience|Intellect|Charm|Cunning|Tenacity)/i.test(s))) {
                    return false;
                }
                continue;
            }

            // 2. Тип персонажа (Species)
            const typeMatch = part.match(/Type:\s*([A-Za-z\-]+)/i);
            if (typeMatch) {
                const reqType = typeMatch[1].toLowerCase();
                if (reqType === "fated" && (speciesVal.includes("construct") || speciesVal.includes("stitched"))) return false;
                if (reqType === "kin" && !speciesVal.includes("gremlin") && !speciesVal.includes("kin")) return false;
                if (reqType === "non-kin" && (speciesVal.includes("gremlin") || speciesVal.includes("kin"))) return false;
                if (reqType === "invested" && !speciesVal.includes("invested") && !speciesVal.includes("construct")) return false;
                if (reqType === "stitched" && !speciesVal.includes("stitched") && !speciesVal.includes("undead")) return false;
                continue;
            }

            // 3. Навыки (Skills)
            const skillMatch = part.match(/Skill:\s*([A-Za-z\s\-]+?)\s*(\d+)/i);
            if (skillMatch) {
                let skillName = skillMatch[1].trim().toLowerCase();
                const targetRank = parseInt(skillMatch[2], 10);

                // Окончания s (например Pistol / Pistols)
                if (skillName.endsWith("s") && skillName !== "flexible") {
                    skillName = skillName.slice(0, -1);
                }

                if (skillName.includes("chosen skill") || skillName.includes("close combat") || skillName.includes("ranged combat")) {
                    let hasEligible = false;
                    const rows = document.querySelectorAll("#skillsList tr");
                    for (let tr of rows) {
                        const rank = parseInt(tr.querySelector(".skill-rating")?.value) || 0;
                        if (rank >= targetRank) { hasEligible = true; break; }
                    }
                    if (!hasEligible) return false;
                } else if (skillName.includes("magical")) {
                    let hasMagical = false;
                    for (let magSkill of Object.keys(skillCategories["Magical"])) {
                        if (getSkillRank(magSkill) >= targetRank) { hasMagical = true; break; }
                    }
                    if (!hasMagical) return false;
                } else {
                    // Ищем ранг навыка с нестрогим сопоставлением
                    let foundRank = 0;
                    const rows = document.querySelectorAll("#skillsList tr");
                    for (let tr of rows) {
                        const sel = tr.querySelector(".skill-select")?.value.toLowerCase() || "";
                        if (sel.includes(skillName) || skillName.includes(sel)) {
                            foundRank = Math.max(foundRank, parseInt(tr.querySelector(".skill-rating")?.value) || 0);
                        }
                    }
                    if (foundRank < targetRank) return false;
                }
                continue;
            }

            // 4. Зависимость от другого таланта
            const otherTalentMatch = part.match(/Other:.*?\b([A-Za-z\s]+)\s+Talent/i);
            if (otherTalentMatch) {
                const reqTalentName = otherTalentMatch[1].trim().toLowerCase();
                const hasTalent = Array.from(document.querySelectorAll(".talent-select")).some(s => s.value.toLowerCase().includes(reqTalentName));
                if (!hasTalent) return false;
                continue;
            }
        }
        return true;
    }

// ЛОГИКА ТАЛАНТОВ (АККОРДЕОН С АВТОФИЛЬТРОМ И ГРУППИРОВКОЙ ПО КНИГАМ)
    function getTalentOptionsHtml(selectedVal = "") {
        let html = `<option value="">-- Выбери подходящий талант --</option>`;
        html += `<option value="__custom__" ${selectedVal === '__custom__' ? 'selected' : ''}>★ Свой талант (Custom)</option>`;
        
        if (typeof GENERAL_TALENTS !== 'undefined') {
            // 1. Фильтруем подходящие по требованиям таланты
            const availableTalents = GENERAL_TALENTS.filter(t => checkTalentRequirements(t) || t.name === selectedVal);

            // 2. Группируем подходящие таланты по названию книги
            const grouped = {};
            availableTalents.forEach(t => {
                const bookName = t.book && t.book.trim() ? t.book.trim() : "Other / Core";
                if (!grouped[bookName]) {
                    grouped[bookName] = [];
                }
                grouped[bookName].push(t);
            });

            // 3. Выводим группы с заголовками <optgroup>, сортируя книги и таланты по алфавиту
            Object.keys(grouped).sort().forEach(book => {
                html += `<optgroup label="📖 ${book}">`;
                
                // Внутри каждой книги сортируем таланты по алфавиту (A-Z)
                grouped[book].sort((a, b) => a.name.localeCompare(b.name)).forEach(t => {
                    const sel = (t.name === selectedVal) ? 'selected' : '';
                    html += `<option value="${t.name}" ${sel}>${t.name}</option>`;
                });

                html += `</optgroup>`;
            });
        }
        return html;
    }

    function refreshAllTalentSelects() {
        document.querySelectorAll(".talent-card").forEach(card => {
            const select = card.querySelector(".talent-select");
            const customInput = card.querySelector(".custom-name-input");
            if (select && customInput.style.display !== "block") {
                const currentVal = select.value;
                select.innerHTML = getTalentOptionsHtml(currentVal);
            }
        });
    }

    function addNewTalentCard() {
        const container = document.getElementById("talentsContainer");
        const card = document.createElement("div");
        card.className = "talent-card";

        card.innerHTML = `
            <div class="talent-header-row">
                <button type="button" class="toggle-btn" onclick="toggleTalentAccordion(this)" title="Развернуть/Свернуть">▼</button>
                <select class="talent-select" onchange="onTalentSelectChange(this)" style="flex: 1;">
                    ${getTalentOptionsHtml()}
                </select>
                <input type="text" class="custom-name-input" placeholder="Название своего таланта" style="display: none; flex: 1;">
                <button type="button" class="del-btn" onclick="deleteTalentCard(this)" title="Удалить">✕</button>
            </div>
            <div class="talent-body">
                <div class="talent-meta-info">
                    Требования: <span class="talent-req">—</span> | Книга: <span class="talent-book">—</span>
                </div>
                <textarea class="talent-desc-area" placeholder="Описание правил или эффекта..."></textarea>
            </div>
        `;
        container.appendChild(card);
    }

    function toggleTalentAccordion(btn) {
        const card = btn.closest(".talent-card");
        const body = card.querySelector(".talent-body");
        const isOpen = body.style.display === "block";
        body.style.display = isOpen ? "none" : "block";
        btn.textContent = isOpen ? "▼" : "▲";
    }

    function onTalentSelectChange(select) {
        const card = select.closest(".talent-card");
        const customInput = card.querySelector(".custom-name-input");
        const reqSpan = card.querySelector(".talent-req");
        const bookSpan = card.querySelector(".talent-book");
        const descArea = card.querySelector(".talent-desc-area");
        const val = select.value;

        if (val === "__custom__") {
            select.style.display = "none";
            customInput.style.display = "block";
            customInput.focus();
            reqSpan.textContent = "Любые";
            bookSpan.textContent = "Custom";
            descArea.value = "";
        } else if (val && typeof GENERAL_TALENTS !== 'undefined') {
            const found = GENERAL_TALENTS.find(t => t.name === val);
            if (found) {
                reqSpan.textContent = found.req || "None";
                bookSpan.textContent = found.book || "—";
                descArea.value = found.desc || "";
            }
        } else {
            reqSpan.textContent = "—";
            bookSpan.textContent = "—";
            descArea.value = "";
        }
        refreshAllTalentSelects();
    }

    function deleteTalentCard(btn) {
        btn.closest(".talent-card").remove();
        refreshAllTalentSelects();
    }

    // АСПЕКТЫ И ДАННЫЕ ЛИСТА
    const aspects = {
        might: 0, grace: 0, speed: 0, resilience: 0,
        intellect: 0, charm: 0, cunning: 0, tenacity: 0
    };

    const skillCategories = {
        "Academic": {
            "Bureaucracy": "cunning",
            "Engineering": "intellect",
            "History": "intellect",
            "Literacy": "intellect",
            "Mathematics": "intellect",
            "Music": "charm"
        },
        "Close Combat": {
            "Flexible": "grace",
            "Grappling": "speed",
            "Heavy Melee": "might",
            "Martial Arts": "speed",
            "Melee": "might",
            "Pneumatic": "might",
            "Pugilism": "might"
        },
        "Crafting": {
            "Alchemistry": "intellect",
            "Art": "cunning",
            "Artefacting": "intellect",
            "Blacksmithing": "intellect",
            "Culinary": "charm",
            "Explosives": "intellect",
            "Homesteading": "tenacity",
            "Printing": "intellect",
            "Stitching": "tenacity"
        },
        "Expertise": {
            "Doctor": "intellect",
            "Forgery": "cunning",
            "Gambling": "cunning",
            "Husbandry": "charm",
            "Lockpicking": "grace",
            "Notice": "cunning",
            "Track": "cunning",
            "Wilderness": "cunning"
        },
        "Magical": {
            "Counter-Spelling": "tenacity",
            "Enchanting": ["charm", "cunning"],
            "Necromancy": ["charm", "tenacity"],
            "Prestidigitation": ["intellect", "cunning"],
            "Sorcery": ["intellect", "tenacity"]
        },
        "Ranged Combat": {
            "Archery": "grace",
            "Heavy Guns": "might",
            "Long Arms": "intellect",
            "Pistol": "grace",
            "Shotgun": "grace",
            "Thrown": "grace"
        },
        "Social": {
            "Barter": "tenacity",
            "Bewitch": "charm",
            "Convince": "intellect",
            "Deceive": "cunning",
            "Intimidate": "tenacity",
            "Leadership": "charm",
            "Scrutiny": "cunning"
        },
        "Training": {
            "Acrobatics": "grace",
            "Athletics": "might",
            "Carouse": "resilience",
            "Centering": "tenacity",
            "Evade": "speed",
            "Pick Pocket": "speed",
            "Stealth": "cunning",
            "Toughness": "resilience"
        }
    };

    function findSkillAspectDef(name) {
        for (let cat in skillCategories) {
            if (skillCategories[cat][name] !== undefined) {
                return skillCategories[cat][name];
            }
        }
        return "";
    }

    function getSkillOptionsHtml() {
        let html = `<option value="">-- Выбери навык --</option>`;
        for (let cat in skillCategories) {
            html += `<optgroup label="${cat}">`;
            for (let sk of Object.keys(skillCategories[cat]).sort()) {
                html += `<option value="${sk}">${sk}</option>`;
            }
            html += `</optgroup>`;
        }
        return html;
    }

    function getAspectSelectHtml(defaultVal = "") {
        const list = ["might", "grace", "speed", "resilience", "intellect", "charm", "cunning", "tenacity"];
        let html = `<select class="skill-aspect" onchange="updateRowAV(this.closest('tr'))">`;
        html += `<option value="">—</option>`;
        list.forEach(asp => {
            const cap = asp.charAt(0).toUpperCase() + asp.slice(1);
            const sel = asp === defaultVal ? "selected" : "";
            html += `<option value="${asp}" ${sel}>${cap}</option>`;
        });
        html += `</select>`;
        return html;
    }

    function modAspect(stat, delta) {
        aspects[stat] += delta;
        document.getElementById(stat).textContent = aspects[stat];
        updateDerived();
        updateAllSkillAVs();
        refreshAllTalentSelects();
    }

    function getSkillRank(skillName) {
        const rows = document.querySelectorAll("#skillsList tr");
        let maxRank = 0;
        for (let tr of rows) {
            const select = tr.querySelector(".skill-select");
            if (select && select.value.toLowerCase() === skillName.toLowerCase()) {
                const rank = parseInt(tr.querySelector(".skill-rating").value) || 0;
                if (rank > maxRank) maxRank = rank;
            }
        }
        return maxRank;
    }

    function updateDerived() {
        const evade = getSkillRank("Evade");
        const centering = getSkillRank("Centering");
        const notice = getSkillRank("Notice");
        const toughness = getSkillRank("Toughness");

        const defBonus = Math.max(0, evade, aspects.speed);
        const baseDef = 2 + defBonus;
        document.getElementById("defenseBase").value = baseDef;

        const armor = parseInt(document.getElementById("armor").value) || 0;
        const armorPenalty = armor > 0 ? 1 : 0;
        document.getElementById("defenseTotal").value = Math.max(1, baseDef - armorPenalty);

        const wpBonus = Math.max(0, centering, aspects.tenacity);
        document.getElementById("willpower").value = 2 + wpBonus;

        document.getElementById("initiative").value = aspects.speed + notice;

        let resBonus = 0;
        if (aspects.resilience > 0) {
            resBonus = Math.ceil(aspects.resilience / 2);
        }
        document.getElementById("wounds").value = 4 + toughness + resBonus;

        const walkVal = 4 + Math.ceil(aspects.speed / 2);
        document.getElementById("walk").value = walkVal;

        const rawCharge = 4 + aspects.speed;
        document.getElementById("charge").value = Math.max(rawCharge, walkVal);
    }

    function updateArmorPenalty() {
        const baseDef = parseInt(document.getElementById("defenseBase").value) || 2;
        const armor = parseInt(document.getElementById("armor").value) || 0;
        const armorPenalty = armor > 0 ? 1 : 0;
        document.getElementById("defenseTotal").value = Math.max(1, baseDef - armorPenalty);
    }

    function addNewSkillRow() {
        const tbody = document.getElementById("skillsList");
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>
                <select class="skill-select" onchange="onSkillSelectChange(this.closest('tr'))">
                    ${getSkillOptionsHtml()}
                </select>
            </td>
            <td class="av-container">
                <div class="av-box av-val">—</div>
            </td>
            <td>
                <input type="number" class="skill-rating" value="0" min="0" max="5" oninput="onRatingChange(this.closest('tr'))">
            </td>
            <td class="aspect-container">
                ${getAspectSelectHtml("")}
            </td>
            <td>
                <button class="del-btn" onclick="deleteSkillRow(this.closest('tr'))" title="Удалить">✕</button>
            </td>
        `;
        tbody.appendChild(tr);
    }

    function onSkillSelectChange(tr) {
        const skillName = tr.querySelector(".skill-select").value;
        const aspectDef = findSkillAspectDef(skillName);
        const avContainer = tr.querySelector(".av-container");
        const aspectContainer = tr.querySelector(".aspect-container");

        if (Array.isArray(aspectDef)) {
            avContainer.innerHTML = `
                <div class="dual-stack">
                    <div class="av-box av-val">—</div>
                    <div class="av-box av-val">—</div>
                </div>
            `;
            aspectContainer.innerHTML = `
                <div class="dual-stack">
                    ${getAspectSelectHtml(aspectDef[0])}
                    ${getAspectSelectHtml(aspectDef[1])}
                </div>
            `;
        } else {
            avContainer.innerHTML = `<div class="av-box av-val">—</div>`;
            aspectContainer.innerHTML = getAspectSelectHtml(aspectDef || "");
        }

        updateRowAV(tr);
        updateDerived();
        refreshAllTalentSelects();
    }

    function onRatingChange(tr) {
        updateRowAV(tr);
        updateDerived();
        refreshAllTalentSelects();
    }

    function deleteSkillRow(tr) {
        tr.remove();
        updateDerived();
        refreshAllTalentSelects();
    }

    function updateRowAV(tr) {
        const rating = parseInt(tr.querySelector(".skill-rating").value) || 0;
        const avCells = tr.querySelectorAll(".av-val");
        const aspectSelects = tr.querySelectorAll(".skill-aspect");

        aspectSelects.forEach((sel, idx) => {
            const aspectKey = sel.value;
            if (!aspectKey) {
                avCells[idx].textContent = "—";
            } else {
                avCells[idx].textContent = rating + (aspects[aspectKey] || 0);
            }
        });
    }

    function updateAllSkillAVs() {
        const rows = document.querySelectorAll("#skillsList tr");
        rows.forEach(tr => updateRowAV(tr));
    }

    // Инициализация при старте
    updateDerived();
    addNewTalentCard();
</script>
