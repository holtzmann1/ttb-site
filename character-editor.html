<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание персонажа — Through the Breach</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 20%, #30251b 0%, #17130f 45%, #0b0a09 100%);
            color: #e8dfd0;
            font-family: Georgia, serif;
        }

        header {
            padding: 20px 50px;
            border-bottom: 1px solid #4a3825;
            background: rgba(10, 9, 8, 0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-button {
            color: #8f8679;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .back-button:hover {
            color: #c59a5b;
        }

        .sheet-title {
            color: #c59a5b;
            font-size: 20px;
            letter-spacing: 2px;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Общие стили полей ввода */
        input[type="text"], input[type="number"], select, textarea {
            background: #14110e;
            border: 1px solid #4a3825;
            color: #e8dfd0;
            font-family: Georgia, serif;
            font-size: 15px;
            padding: 8px 10px;
            outline: none;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #b88a4a;
        }

        .box {
            border: 1px solid #4a3825;
            background: rgba(10, 9, 8, 0.6);
            padding: 15px;
            margin-bottom: 25px;
        }

        .box-header {
            margin: 0 0 15px 0;
            color: #c59a5b;
            font-size: 20px;
            font-weight: normal;
            letter-spacing: 1.5px;
            text-align: center;
            border-bottom: 1px solid #33271a;
            padding-bottom: 6px;
        }

        /* ШАПКА */
        .top-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        .label-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .field-group label {
            display: block;
            font-size: 12px;
            color: #a99e8d;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        /* ОСНОВНОЙ МАКЕТ */
        .sheet-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        /* АСПЕКТЫ */
        .aspects-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .aspect-subgroup h4 {
            margin: 0 0 10px 0;
            text-align: center;
            color: #a99e8d;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .aspect-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 17, 14, 0.8);
            border: 1px solid #382b1d;
            padding: 6px 10px;
            margin-bottom: 8px;
        }

        .aspect-name {
            font-size: 15px;
        }

        .counter {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .counter button {
            width: 26px;
            height: 26px;
            background: #14110e;
            border: 1px solid #4a3825;
            color: #c59a5b;
            cursor: pointer;
            font-family: monospace;
        }

        .counter button:hover {
            background: #b88a4a;
            color: #000;
        }

        .counter span {
            min-width: 25px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        /* DERIVED ASPECTS */
        .derived-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .derived-cell {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 17, 14, 0.8);
            border: 1px solid #382b1d;
            padding: 6px 10px;
        }

        .derived-cell span:first-child {
            color: #a99e8d;
            font-size: 13px;
        }

        .derived-cell input {
            width: 65px;
            text-align: center;
            padding: 4px;
            font-size: 16px;
            font-weight: bold;
        }

        .defense-container {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .defense-container input {
            width: 44px;
            text-align: center;
            padding: 4px;
            font-size: 15px;
            font-weight: bold;
        }

        /* АТАКИ */
        .attack-card {
            border: 1px solid #382b1d;
            background: rgba(16, 14, 11, 0.85);
            padding: 10px;
            margin-bottom: 12px;
        }

        .attack-row-1 {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 10px;
            margin-bottom: 8px;
        }

        .attack-stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 8px;
        }

        .attack-stats-grid div {
            text-align: center;
        }

        .attack-stats-grid label {
            display: block;
            font-size: 10px;
            color: #8f8679;
            margin-bottom: 3px;
        }

        .attack-stats-grid input {
            text-align: center;
            padding: 4px;
            font-size: 13px;
        }

        /* ТАБЛИЦА НАВЫКОВ */
        .skills-table {
            width: 100%;
            border-collapse: collapse;
        }

        .skills-table th {
            text-align: left;
            padding: 6px;
            color: #a99e8d;
            font-size: 13px;
            letter-spacing: 1px;
            border-bottom: 1px solid #4a3825;
        }

        .skills-table td {
            padding: 4px;
        }

        .skills-table td.av-val {
            text-align: center;
            font-weight: bold;
            color: #c59a5b;
            font-size: 16px;
            background: #14110e;
            border: 1px solid #2a2015;
            width: 45px;
        }

        .del-btn {
            background: transparent;
            border: 1px solid #4a3825;
            color: #8f8679;
            cursor: pointer;
            padding: 6px 10px;
            font-size: 12px;
        }

        .del-btn:hover {
            color: #e57373;
            border-color: #e57373;
        }

        .add-skill-btn {
            margin-top: 15px;
            padding: 10px;
            background: transparent;
            border: 1px dashed #b88a4a;
            color: #c59a5b;
            cursor: pointer;
            font-family: Georgia, serif;
            letter-spacing: 1px;
            width: 100%;
        }

        .add-skill-btn:hover {
            background: rgba(184, 138, 74, 0.15);
        }

        @media (max-width: 900px) {
            .top-grid, .sheet-body {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <a href="characters.html" class="back-button">← НАЗАД К ПЕРСОНАЖАМ</a>
    <div class="sheet-title">CHARACTER SHEET</div>
</header>

<main>

    <!-- ШАПКА ЛИСТА -->
    <div class="top-grid">
        <div class="box">
            <div class="field-group">
                <label>Fated Name</label>
                <input type="text" id="charName" placeholder="И что ты придумал на этот раз?">
            </div>
            <div class="label-row">
                <div class="field-group">
                    <label>Player Name</label>
                    <input type="text" id="playerName" placeholder="Напиши здесь свое красивое имя">
                </div>
                <div class="field-group">
                    <label>Species</label>
                    <input type="text" id="species" value="Human">
                </div>
            </div>
        </div>

        <div class="box">
            <div class="field-group">
                <label>Current Pursuits</label>
                <input type="text" id="pursuit" placeholder="Пиши сюда свой класс">
            </div>
        </div>
    </div>

    <!-- ТЕЛО ЛИСТА -->
    <div class="sheet-body">

        <!-- ЛЕВАЯ КОЛОНКА -->
        <div>
            <!-- АСПЕКТЫ -->
            <div class="box">
                <div class="box-header">ASPECTS</div>

                <div class="aspects-grid">
                    <!-- Physical -->
                    <div class="aspect-subgroup">
                        <h4>Physical</h4>
                        <div class="aspect-row">
                            <span class="aspect-name">Might</span>
                            <div class="counter">
                                <button onclick="modAspect('might', -1)">-</button>
                                <span id="might">0</span>
                                <button onclick="modAspect('might', 1)">+</button>
                            </div>
                        </div>
                        <div class="aspect-row">
                            <span class="aspect-name">Grace</span>
                            <div class="counter">
                                <button onclick="modAspect('grace', -1)">-</button>
                                <span id="grace">0</span>
                                <button onclick="modAspect('grace', 1)">+</button>
                            </div>
                        </div>
                        <div class="aspect-row">
                            <span class="aspect-name">Speed</span>
                            <div class="counter">
                                <button onclick="modAspect('speed', -1)">-</button>
                                <span id="speed">0</span>
                                <button onclick="modAspect('speed', 1)">+</button>
                            </div>
                        </div>
                        <div class="aspect-row">
                            <span class="aspect-name">Resilience</span>
                            <div class="counter">
                                <button onclick="modAspect('resilience', -1)">-</button>
                                <span id="resilience">0</span>
                                <button onclick="modAspect('resilience', 1)">+</button>
                            </div>
                        </div>
                    </div>

                    <!-- Mental -->
                    <div class="aspect-subgroup">
                        <h4>Mental</h4>
                        <div class="aspect-row">
                            <span class="aspect-name">Intellect</span>
                            <div class="counter">
                                <button onclick="modAspect('intellect', -1)">-</button>
                                <span id="intellect">0</span>
                                <button onclick="modAspect('intellect', 1)">+</button>
                            </div>
                        </div>
                        <div class="aspect-row">
                            <span class="aspect-name">Charm</span>
                            <div class="counter">
                                <button onclick="modAspect('charm', -1)">-</button>
                                <span id="charm">0</span>
                                <button onclick="modAspect('charm', 1)">+</button>
                            </div>
                        </div>
                        <div class="aspect-row">
                            <span class="aspect-name">Cunning</span>
                            <div class="counter">
                                <button onclick="modAspect('cunning', -1)">-</button>
                                <span id="cunning">0</span>
                                <button onclick="modAspect('cunning', 1)">+</button>
                            </div>
                        </div>
                        <div class="aspect-row">
                            <span class="aspect-name">Tenacity</span>
                            <div class="counter">
                                <button onclick="modAspect('tenacity', -1)">-</button>
                                <span id="tenacity">0</span>
                                <button onclick="modAspect('tenacity', 1)">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- DERIVED ASPECTS -->
            <div class="box">
                <div class="box-header">DERIVED ASPECTS</div>
                <div class="derived-grid">
                    <!-- Defense с двумя изменяемыми полями -->
                    <div class="derived-cell">
                        <span>Defense</span>
                        <div class="defense-container">
                            <input type="number" id="defenseTotal" value="2" title="Итоговый Defense (со штрафом брони/бафами)">
                            <span>(</span>
                            <input type="number" id="defenseBase" value="2" title="Базовый Defense без брони">
                            <span>)</span>
                        </div>
                    </div>
                    <div class="derived-cell">
                        <span>Walk</span>
                        <input type="number" id="walk" value="4">
                    </div>

                    <div class="derived-cell">
                        <span>Armor</span>
                        <input type="number" id="armor" value="0" onchange="updateArmorPenalty()">
                    </div>
                    <div class="derived-cell">
                        <span>Charge</span>
                        <input type="number" id="charge" value="4">
                    </div>

                    <div class="derived-cell">
                        <span>Willpower</span>
                        <input type="number" id="willpower" value="2">
                    </div>
                    <div class="derived-cell">
                        <span>Initiative</span>
                        <input type="number" id="initiative" value="0">
                    </div>

                    <div class="derived-cell">
                        <span>Wounds</span>
                        <input type="number" id="wounds" value="4">
                    </div>
                    <div class="derived-cell">
                        <span>Height</span>
                        <input type="number" id="height" value="2">
                    </div>
                </div>
            </div>

            <!-- ATTACKS -->
            <div class="box">
                <div class="box-header">ATTACKS</div>
                
                <!-- Атака 1 -->
                <div class="attack-card">
                    <div class="attack-row-1">
                        <input type="text" placeholder="Attack Name (Оружие)">
                        <input type="text" placeholder="Special (Свойства)">
                    </div>
                    <div class="attack-stats-grid">
                        <div><label>AV</label><input type="text" placeholder="4"></div>
                        <div><label>Range</label><input type="text" placeholder="1"></div>
                        <div><label>Damage</label><input type="text" placeholder="2/3/4"></div>
                        <div><label>Capacity</label><input type="text" placeholder="-"></div>
                        <div><label>Reload</label><input type="text" placeholder="-"></div>
                        <div><label>TN</label><input type="text" placeholder="-"></div>
                    </div>
                    <input type="text" placeholder="Triggers (например: Ram: Critical Strike)">
                </div>

                <!-- Атака 2 -->
                <div class="attack-card">
                    <div class="attack-row-1">
                        <input type="text" placeholder="Attack Name (Второе оружие)">
                        <input type="text" placeholder="Special (Свойства)">
                    </div>
                    <div class="attack-stats-grid">
                        <div><label>AV</label><input type="text" placeholder="5"></div>
                        <div><label>Range</label><input type="text" placeholder="12"></div>
                        <div><label>Damage</label><input type="text" placeholder="2/4/5"></div>
                        <div><label>Capacity</label><input type="text" placeholder="6"></div>
                        <div><label>Reload</label><input type="text" placeholder="1"></div>
                        <div><label>TN</label><input type="text" placeholder="-"></div>
                    </div>
                    <input type="text" placeholder="Triggers (например: Ram: Critical Strike)">
                </div>
            </div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА: SKILLS -->
        <div>
            <div class="box">
                <div class="box-header">SKILLS</div>
                <table class="skills-table">
                    <thead>
                        <tr>
                            <th>SKILL</th>
                            <th style="width: 50px; text-align: center;">AV</th>
                            <th style="width: 65px; text-align: center;">RATING</th>
                            <th style="width: 115px;">ASPECT</th>
                            <th style="width: 35px;"></th>
                        </tr>
                    </thead>
                    <tbody id="skillsList">
                        <!-- Изначально пусто -->
                    </tbody>
                </table>
                <button class="add-skill-btn" onclick="addNewSkillRow()">+ ДОБАВИТЬ НАВЫК</button>
            </div>
        </div>

    </div>

</main>

<script>
    // 1. Аспекты
    const aspects = {
        might: 0, grace: 0, speed: 0, resilience: 0,
        intellect: 0, charm: 0, cunning: 0, tenacity: 0
    };

    // Базовый справочник навыков Through the Breach и их аспекты по умолчанию
    const skillBook = {
        "Artifacting": "intellect",
        "Appraise": "cunning",
        "Athletics": "speed",
        "Barter": "charm",
        "Bureaucracy": "intellect",
        "Centering": "tenacity",
        "Convince": "charm",
        "Deceive": "charm",
        "Doctor": "intellect",
        "Engineering": "intellect",
        "Evade": "speed",
        "Forgery": "intellect",
        "Gamble": "cunning",
        "Heavy Melee": "might",
        "History": "intellect",
        "Homesteading": "tenacity",
        "Husbandry": "cunning",
        "Intimidation": "might",
        "Labor": "might",
        "Literacy": "intellect",
        "Lockpicking": "grace",
        "Long Arms": "grace",
        "Melee": "might",
        "Music": "charm",
        "Navigation": "cunning",
        "Notice": "cunning",
        "Perform": "charm",
        "Pickpocket": "grace",
        "Pistol": "grace",
        "Pugilism": "might",
        "Scrutiny": "cunning",
        "Shotgun": "grace",
        "Sorcery": "tenacity",
        "Stealth": "cunning",
        "Stitching": "grace",
        "Tinkering": "intellect",
        "Toughness": "resilience",
        "Track": "cunning",
        "Wilderness": "cunning"
    };

    // Изменение аспекта вручную (+/-)
    function modAspect(stat, delta) {
        aspects[stat] += delta;
        document.getElementById(stat).textContent = aspects[stat];
        updateDerived();
        updateAllSkillAVs();
    }

    // Вспомогательная: получить ранг конкретного навыка
    function getSkillRank(skillName) {
        const rows = document.querySelectorAll("#skillsList tr");
        for (let tr of rows) {
            const select = tr.querySelector(".skill-select");
            if (select && select.value.toLowerCase() === skillName.toLowerCase()) {
                return parseInt(tr.querySelector(".skill-rating").value) || 0;
            }
        }
        return 0;
    }

    // Точный расчет Derived Aspects по правилам
    function updateDerived() {
        const evade = getSkillRank("Evade");
        const centering = getSkillRank("Centering");
        const notice = getSkillRank("Notice");
        const toughness = getSkillRank("Toughness");

        // 1. Defense: 2 + max(0, Evade, Speed)
        const defBonus = Math.max(0, evade, aspects.speed);
        const baseDef = 2 + defBonus;
        document.getElementById("defenseBase").value = baseDef;

        // Итоговый Defense с учетом надетой брони
        const armor = parseInt(document.getElementById("armor").value) || 0;
        const armorPenalty = armor > 0 ? 1 : 0;
        document.getElementById("defenseTotal").value = Math.max(1, baseDef - armorPenalty);

        // 2. Willpower: 2 + max(0, Centering, Tenacity)
        const wpBonus = Math.max(0, centering, aspects.tenacity);
        document.getElementById("willpower").value = 2 + wpBonus;

        // 3. Initiative: Speed + Notice
        document.getElementById("initiative").value = aspects.speed + notice;

        // 4. Wounds: 4 + Toughness + (Resilience > 0 ? ceil(Resilience / 2) : 0)
        let resBonus = 0;
        if (aspects.resilience > 0) {
            resBonus = Math.ceil(aspects.resilience / 2);
        }
        document.getElementById("wounds").value = 4 + toughness + resBonus;

        // 5. Walk: 4 + Speed / 2 (округление вверх)
        const walkVal = 4 + Math.ceil(aspects.speed / 2);
        document.getElementById("walk").value = walkVal;

        // 6. Charge: 4 + Speed (не меньше Walk)
        const rawCharge = 4 + aspects.speed;
        document.getElementById("charge").value = Math.max(rawCharge, walkVal);
    }

    // Обработчик ручного изменения брони
    function updateArmorPenalty() {
        const baseDef = parseInt(document.getElementById("defenseBase").value) || 2;
        const armor = parseInt(document.getElementById("armor").value) || 0;
        const armorPenalty = armor > 0 ? 1 : 0;
        document.getElementById("defenseTotal").value = Math.max(1, baseDef - armorPenalty);
    }

    // Добавление строки навыка (начинается пустой)
    function addNewSkillRow() {
        const tbody = document.getElementById("skillsList");
        const tr = document.createElement("tr");

        let options = `<option value="">-- Выбери навык --</option>`;
        for (let sk of Object.keys(skillBook).sort()) {
            options += `<option value="${sk}">${sk}</option>`;
        }

        tr.innerHTML = `
            <td>
                <select class="skill-select" onchange="onSkillSelectChange(this.closest('tr'))">
                    ${options}
                </select>
            </td>
            <td class="av-val">—</td>
            <td>
                <input type="number" class="skill-rating" value="0" min="0" max="5" onchange="onRatingChange(this.closest('tr'))">
            </td>
            <td>
                <select class="skill-aspect" onchange="updateRowAV(this.closest('tr'))">
                    <option value="">—</option>
                    <option value="might">Might</option>
                    <option value="grace">Grace</option>
                    <option value="speed">Speed</option>
                    <option value="resilience">Resilience</option>
                    <option value="intellect">Intellect</option>
                    <option value="charm">Charm</option>
                    <option value="cunning">Cunning</option>
                    <option value="tenacity">Tenacity</option>
                </select>
            </td>
            <td>
                <button class="del-btn" onclick="deleteSkillRow(this.closest('tr'))" title="Удалить">✕</button>
            </td>
        `;

        tbody.appendChild(tr);
    }

    // При выборе навыка из выпадающего списка
    function onSkillSelectChange(tr) {
        const skillName = tr.querySelector(".skill-select").value;
        const aspectSelect = tr.querySelector(".skill-aspect");

        if (skillName && skillBook[skillName]) {
            aspectSelect.value = skillBook[skillName];
        } else {
            aspectSelect.value = "";
        }

        updateRowAV(tr);
        updateDerived(); // Если выбрали Evade/Centering/Notice/Toughness
    }

    function onRatingChange(tr) {
        updateRowAV(tr);
        updateDerived();
    }

    function deleteSkillRow(tr) {
        tr.remove();
        updateDerived();
    }

    // Расчет AV строки: AV = Rating + Аспект
    function updateRowAV(tr) {
        const rating = parseInt(tr.querySelector(".skill-rating").value) || 0;
        const aspectKey = tr.querySelector(".skill-aspect").value;
        const avCell = tr.querySelector(".av-val");

        if (!aspectKey) {
            avCell.textContent = "—";
            return;
        }

        const totalAV = rating + (aspects[aspectKey] || 0);
        avCell.textContent = totalAV;
    }

    // Обновление всех AV
    function updateAllSkillAVs() {
        const rows = document.querySelectorAll("#skillsList tr");
        rows.forEach(tr => updateRowAV(tr));
    }

    // Стартовая инициализация
    updateDerived();
</script>

</body>
</html>
