<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Through the Breach — General Talents</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #120f0c;
      background-image: 
        radial-gradient(circle at 50% 20%, #1e1812 0%, #120f0c 70%, #0a0806 100%),
        repeating-linear-gradient(0deg, rgba(40, 32, 24, 0.2) 0px, rgba(40, 32, 24, 0.2) 1px, transparent 1px, transparent 28px);
      color: #dfd4c4;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 14.5px;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Хедер в книжном стиле */
    header {
      padding: 18px 36px;
      border-bottom: 2px solid #3d2d1e;
      background: rgba(18, 15, 12, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.85);
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .logo {
      color: #c7a877;
      font-size: 20px;
      letter-spacing: 2.5px;
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .logo:hover {
      color: #f2ece2;
    }

    .sublogo {
      color: #8f8273;
      font-size: 14px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-left: 1px solid #3d2d1e;
      padding-left: 12px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1px solid #6b5239;
      background: #241c16;
      color: #cbbca9;
      text-decoration: none;
      letter-spacing: 1.5px;
      font-size: 12px;
      font-family: Georgia, serif;
      text-transform: uppercase;
      border-radius: 0;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn:hover, .nav-btn.active {
      background: #36291e;
      border-color: #a8885a;
      color: #f2ece2;
    }

    .nav-btn-secondary {
      border-color: #423223;
      color: #8f8273;
      background: transparent;
    }

    .nav-btn-secondary:hover {
      border-color: #6b5239;
      color: #cbbca9;
      background: #1c1611;
    }

    /* Поиск */
    .search-row {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      background: #14100d;
      border: 1px solid #3d2d1e;
      border-radius: 0;
      color: #ded3c3;
      font-family: Georgia, serif;
      font-size: 14px;
      padding: 11px 16px 11px 42px;
      outline: none;
      letter-spacing: 0.5px;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #8c714b;
      background: #17130f;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #c7a877;
      pointer-events: none;
      font-size: 14px;
    }

    /* Выдвижная панель фильтров */
    .filter-drawer {
      display: none;
      background: #15110e;
      border-bottom: 2px solid #3d2d1e;
      padding: 24px 36px;
    }

    .filter-drawer.open {
      display: block;
    }

    .drawer-grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.1fr 1.3fr 1fr;
      gap: 26px;
    }

    .filter-col-title {
      color: #c7a877;
      font-size: 12.5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding-bottom: 6px;
      margin-bottom: 10px;
      border-bottom: 1px solid #3d2d1e;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .toggle-link {
      font-size: 11px;
      color: #8f8273;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .toggle-link:hover {
      color: #c7a877;
    }

    /* Теги выбора */
    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-btn {
      background: #181411;
      border: 1px solid #3a2e22;
      border-radius: 0;
      color: #9c9183;
      font-size: 11.5px;
      font-family: Georgia, serif;
      letter-spacing: 0.8px;
      padding: 5px 9px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.15s;
      user-select: none;
    }

    .tag-btn:hover {
      border-color: #8c714b;
      color: #e5ded3;
      background: #241d18;
    }

    .tag-btn.active {
      background: #2b2219;
      border-color: #c4a472;
      color: #ecd7b7;
      box-shadow: inset 0 0 0 1px #c4a472;
    }

    /* Аспекты */
    .aspects-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .aspect-mode-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #c7a877;
      cursor: pointer;
      user-select: none;
    }

    .aspect-mode-toggle input {
      accent-color: #8c714b;
      cursor: pointer;
      width: 15px;
      height: 15px;
    }

    .aspects-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      transition: opacity 0.2s;
    }

    .aspects-grid.disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    .aspect-box {
      background: #14100d;
      border: 1px solid #33261a;
      border-radius: 0;
      padding: 6px 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .aspect-title {
      font-size: 10.5px;
      letter-spacing: 1px;
      color: #8f8273;
      text-transform: uppercase;
    }

    .aspect-stepper {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .step-btn {
      background: #1e1813;
      border: 1px solid #4a3827;
      color: #c7a877;
      width: 20px;
      height: 20px;
      border-radius: 0;
      font-family: Georgia, serif;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      line-height: 1;
      padding: 0;
      transition: all 0.15s;
    }

    .step-btn:hover {
      background: #8c714b;
      color: #120f0c;
      border-color: #8c714b;
    }

    .aspect-val {
      font-size: 13.5px;
      font-weight: bold;
      color: #dfd4c4;
      min-width: 18px;
      text-align: center;
    }

    /* Основная сетка карточек */
    main {
      max-width: 1400px;
      margin: 24px auto;
      padding: 0 36px 40px;
      width: 100%;
      flex-grow: 1;
    }

    .catalog-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      margin-bottom: 18px;
      border-bottom: 1px solid #3d2d1e;
      color: #8f8273;
      font-size: 13px;
      letter-spacing: 0.8px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 18px;
    }

    /* Карточка таланта — книжная страница с угловыми засечками */
    .talent-card {
      background: #1a1511;
      border: 1px solid #4a3827;
      border-radius: 0;
      box-shadow: 
        inset 0 0 0 3px #1a1511,
        inset 0 0 0 4px #3d2d1e,
        0 8px 24px rgba(0, 0, 0, 0.85);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    /* Викторианские засечки в углах карточки */
    .talent-card::before,
    .talent-card::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      border-color: #8c714b;
      pointer-events: none;
    }
    .talent-card::before {
      top: 5px; left: 5px;
      border-top: 1px solid #8c714b;
      border-left: 1px solid #8c714b;
    }
    .talent-card::after {
      bottom: 5px; right: 5px;
      border-bottom: 1px solid #8c714b;
      border-right: 1px solid #8c714b;
    }

    .talent-card:hover {
      border-color: #8c714b;
      box-shadow: 
        inset 0 0 0 3px #1a1511,
        inset 0 0 0 4px #5a422e,
        0 10px 28px rgba(0, 0, 0, 0.95);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      border-bottom: 1px solid #38291a;
      padding-bottom: 8px;
    }

    .talent-name {
      font-size: 16.5px;
      color: #c7a877;
      letter-spacing: 1px;
      line-height: 1.25;
      font-weight: normal;
    }

    .book-tag-badge {
      font-size: 10.5px;
      color: #8f8273;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 1px solid #3d2d1e;
      background: #13100d;
      padding: 2px 7px;
      border-radius: 0;
      white-space: nowrap;
    }

    .card-req-row {
      background: #14100d;
      border-left: 2px solid #8c714b;
      padding: 5px 10px;
      border-radius: 0;
      font-size: 12.5px;
      color: #bfaea0;
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }

    .req-prefix {
      font-size: 10.5px;
      color: #c7a877;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .talent-body {
      color: #ded4c5;
      font-size: 13.5px;
      line-height: 1.65;
      white-space: pre-line;
      flex-grow: 1;
    }

    /* Жетоны мастей Rulebook Folio (приглушенные нейтральные тона Wyrd) */
    .suit-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px 2px 5px;
      border-radius: 2px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.8px;
      line-height: 1;
      vertical-align: middle;
      text-transform: uppercase;
      user-select: none;
      box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.6);
      margin: 0 2px;
      border: 1px solid transparent;
    }

    .suit-chip svg {
      width: 14px;
      height: 14px;
      display: block;
      flex-shrink: 0;
    }

    .suit-chip.suit-rams  { 
      color: #c96b65; 
      background: rgba(160, 60, 50, 0.16); 
      border-color: rgba(175, 75, 65, 0.45); 
    }
    .suit-chip.suit-masks { 
      color: #b392cf; 
      background: rgba(120, 85, 150, 0.16); 
      border-color: rgba(145, 105, 180, 0.45); 
    }
    .suit-chip.suit-crows { 
      color: #72ab7d; 
      background: rgba(60, 120, 75, 0.16); 
      border-color: rgba(75, 140, 90, 0.45); 
    }
    .suit-chip.suit-tomes { 
      color: #739bbd; 
      background: rgba(65, 105, 140, 0.16); 
      border-color: rgba(85, 125, 165, 0.45); 
    }

    /* Жетон модификатора судьбы (+) */
    .fate-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      margin: 0 2px;
      background: #201913;
      border: 1px solid #4a3825;
      color: #c7a877;
      font-weight: bold;
      font-size: 12px;
      border-radius: 2px;
      vertical-align: middle;
      line-height: 1;
    }

    /* Бейджи пометок мастера */
    .note-badge-row {
      display: flex;
      gap: 6px;
      padding-top: 4px;
    }

    .badge-banned {
      background: rgba(140, 40, 30, 0.18);
      border: 1px solid #822e28;
      color: #c96b65;
      font-size: 10.5px;
      letter-spacing: 1px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 0;
      text-transform: uppercase;
    }

    .badge-houserule {
      background: rgba(140, 100, 50, 0.18);
      border: 1px solid #7a582c;
      color: #c7a877;
      font-size: 10.5px;
      letter-spacing: 1px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 0;
      text-transform: uppercase;
    }

    /* Пустой экран */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 70px 20px;
      color: #8f8273;
      font-size: 15px;
      font-style: italic;
    }

    @media (max-width: 900px) {
      header, .filter-drawer, main {
        padding-left: 16px;
        padding-right: 16px;
      }
      .drawer-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }
      .aspects-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .cards-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- ВЕРХНЯЯ НАВИГАЦИЯ -->
  <header>
    <div class="header-inner">
      <div class="header-top">
        <div class="logo-group">
          <a href="index.html" class="logo">THROUGH THE BREACH</a>
          <span class="sublogo">General Talents</span>
        </div>
        <div class="header-actions">
          <a href="index.html" class="nav-btn nav-btn-secondary">← НА ГЛАВНУЮ</a>
          <button class="nav-btn" id="btn-toggle-filters">ФИЛЬТРЫ И АСПЕКТЫ</button>
          <button class="nav-btn nav-btn-secondary" id="btn-reset-filters">СБРОС</button>
        </div>
      </div>

      <!-- Живой поиск -->
      <div class="search-row">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" class="search-input" placeholder="Поиск по названию, тексту или условию (например: Grapple, Charge, Invested)...">
      </div>
    </div>

    <!-- ВЫДВИЖНОЙ БЛОК ФИЛЬТРОВ -->
    <div class="filter-drawer" id="filter-drawer">
      <div class="drawer-grid">
        
        <!-- Книги правил -->
        <div>
          <div class="filter-col-title">
            <span>BOOKS</span>
            <span class="toggle-link" id="books-toggle-all">All / None</span>
          </div>
          <div class="tags-container" id="books-tags"></div>
        </div>

        <!-- Аспекты персонажа -->
        <div>
          <div class="filter-col-title">
            <span>CHARACTER ASPECTS</span>
            <span class="toggle-link" id="aspects-reset">Reset to 0</span>
          </div>
          <div class="aspects-header-row">
            <label class="aspect-mode-toggle">
              <input type="checkbox" id="chk-aspects-active">
              <span>Фильтровать по статам персонажа</span>
            </label>
          </div>
          <div class="aspects-grid disabled" id="aspects-grid"></div>
        </div>

        <!-- Теги и происхождение -->
        <div>
          <div class="filter-col-title">
            <span>TRAITS & ORIGIN</span>
          </div>
          <div class="tags-container" id="traits-tags">
            <button class="tag-btn" data-trait="Invested">INVESTED</button>
            <button class="tag-btn" data-trait="Kin">KIN</button>
            <button class="tag-btn" data-trait="Stitched">STITCHED</button>
            <button class="tag-btn" data-trait="Guild">GUILD</button>
            <button class="tag-btn" data-trait="Destiny">DESTINY</button>
            <button class="tag-btn" data-trait="House Rules">HOUSE RULES</button>
            <button class="tag-btn" data-trait="Banned">BANNED</button>
          </div>
        </div>

      </div>
    </div>
  </header>

  <!-- КАТАЛОГ КАРТОЧЕК -->
  <main>
    <div class="catalog-bar">
      <span id="results-count">Показано талантов: 0</span>
    </div>

    <div class="cards-grid" id="cards-container"></div>
  </main>

  <!-- БАЗА ДАННЫХ ТАЛАНТОВ И МОДУЛЬ МАСТЕЙ -->
  <script src="suits.js"></script>
  <script src="talents-data.js"></script>

  <script>
    const talents = (typeof GENERAL_TALENTS !== 'undefined') ? GENERAL_TALENTS : [];

    const state = {
      search: '',
      books: new Set(),
      aspectsActive: false,
      aspects: {
        Might: 0,
        Grace: 0,
        Speed: 0,
        Resilience: 0,
        Intellect: 0,
        Charm: 0,
        Cunning: 0,
        Tenacity: 0
      },
      traits: new Set()
    };

    // Получение жетонов мастей из suits.js
    const getChip = (typeof getSuitChip === "function") ? getSuitChip : (s) => `[${s.toUpperCase()}]`;

    const CHIP_RAMS = getChip('rams');
    const CHIP_CROWS = getChip('crows');
    const CHIP_TOMES = getChip('tomes');
    const CHIP_MASKS = getChip('masks');

    // Книги
    function initBooks() {
      const container = document.getElementById('books-tags');
      const allBooks = Array.from(new Set(talents.map(t => t.book).filter(Boolean))).sort();
      container.innerHTML = allBooks.map(b => `
        <button class="tag-btn" data-book="${b}">${b}</button>
      `).join('');

      container.querySelectorAll('.tag-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const b = btn.dataset.book;
          if (state.books.has(b)) {
            state.books.delete(b);
            btn.classList.remove('active');
          } else {
            state.books.add(b);
            btn.classList.add('active');
          }
          render();
        });
      });

      document.getElementById('books-toggle-all').addEventListener('click', () => {
        if (state.books.size === allBooks.length) {
          state.books.clear();
          container.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        } else {
          allBooks.forEach(b => state.books.add(b));
          container.querySelectorAll('.tag-btn').forEach(b => b.classList.add('active'));
        }
        render();
      });
    }

    // Аспекты
    function initAspects() {
      const container = document.getElementById('aspects-grid');
      const aspectList = ['Might', 'Grace', 'Speed', 'Resilience', 'Intellect', 'Charm', 'Cunning', 'Tenacity'];
      
      container.innerHTML = aspectList.map(asp => `
        <div class="aspect-box">
          <span class="aspect-title">${asp}</span>
          <div class="aspect-stepper">
            <button class="step-btn" data-asp="${asp}" data-delta="-1">−</button>
            <span class="aspect-val" id="val-${asp}">0</span>
            <button class="step-btn" data-asp="${asp}" data-delta="1">+</button>
          </div>
        </div>
      `).join('');

      container.querySelectorAll('.step-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const asp = btn.dataset.asp;
          const delta = parseInt(btn.dataset.delta, 10);
          state.aspects[asp] = Math.max(-5, Math.min(5, state.aspects[asp] + delta));
          document.getElementById(`val-${asp}`).textContent = (state.aspects[asp] > 0 ? '+' : '') + state.aspects[asp];
          render();
        });
      });

      const chkActive = document.getElementById('chk-aspects-active');
      chkActive.addEventListener('change', (e) => {
        state.aspectsActive = e.target.checked;
        container.classList.toggle('disabled', !state.aspectsActive);
        render();
      });

      document.getElementById('aspects-reset').addEventListener('click', () => {
        aspectList.forEach(asp => {
          state.aspects[asp] = 0;
          document.getElementById(`val-${asp}`).textContent = '0';
        });
        render();
      });
    }

    // Теги происхождения
    function initTraits() {
      const container = document.getElementById('traits-tags');
      container.querySelectorAll('.tag-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const trait = btn.dataset.trait;
          if (state.traits.has(trait)) {
            state.traits.delete(trait);
            btn.classList.remove('active');
          } else {
            state.traits.add(trait);
            btn.classList.add('active');
          }
          render();
        });
      });
    }

    // Проверка условий по аспектам
    function qualifiesByAspects(reqStr, charAspects) {
      if (!reqStr || reqStr === 'None') return true;

      const parts = reqStr.split(',').map(s => s.trim());
      for (const p of parts) {
        const aspMatch = p.match(/Aspect:\s*([A-Za-z]+)\s*(-?\d+)\s*(or higher|or lower|\+)?/i);
        if (aspMatch) {
          const asp = aspMatch[1];
          const needed = parseInt(aspMatch[2], 10);
          const isLower = /lower|less/i.test(p);
          const current = charAspects[asp] !== undefined ? charAspects[asp] : 0;

          if (isLower && current > needed) return false;
          if (!isLower && current < needed) return false;
        }
      }
      return true;
    }

    // Форматирование описания: масти-чипы, модификаторы судьбы (+)
    function formatDescription(desc) {
      if (!desc) return '';

      let formatted = desc
        .replace(/\[когти\]/gi, '⚔️')
        .replace(/\bRAMS\b/g, CHIP_RAMS)
        .replace(/\bCROWS\b/g, CHIP_CROWS)
        .replace(/\bTOMES\b/g, CHIP_TOMES)
        .replace(/\bMASKS\b/g, CHIP_MASKS)
        .replace(/:r:/g, CHIP_RAMS)
        .replace(/:c:/g, CHIP_CROWS)
        .replace(/:t:/g, CHIP_TOMES)
        .replace(/:m:/g, CHIP_MASKS)
        .replace(/(?<=\s)\+(?=\s)/g, '<span class="fate-chip">+</span>')
        .replace(/\[\+\]/g, '<span class="fate-chip">+</span>')
        .replace(/\[\-\]/g, '<span class="fate-chip">−</span>');

      return formatted;
    }

    // Рендер каталога
    function render() {
      const container = document.getElementById('cards-container');
      const searchTerms = state.search.toLowerCase().trim().split(/\s+/).filter(Boolean);

      const filtered = talents.filter(t => {
        if (searchTerms.length > 0) {
          const full = `${t.name} ${t.desc} ${t.req} ${t.book} ${t.notes || ''}`.toLowerCase();
          if (!searchTerms.every(term => full.includes(term))) return false;
        }

        if (state.books.size > 0 && !state.books.has(t.book)) return false;

        if (state.traits.size > 0) {
          let matchesTrait = false;
          if (state.traits.has('Invested') && /Invested/i.test(t.req)) matchesTrait = true;
          if (state.traits.has('Kin') && /Kin/i.test(t.req)) matchesTrait = true;
          if (state.traits.has('Stitched') && /Stitched/i.test(t.req)) matchesTrait = true;
          if (state.traits.has('Guild') && /Guild/i.test(t.req)) matchesTrait = true;
          if (state.traits.has('Destiny') && /Destiny/i.test(t.req)) matchesTrait = true;
          if (state.traits.has('House Rules') && t.notes && !/Никогда/i.test(t.notes) && t.notes.trim()) matchesTrait = true;
          if (state.traits.has('Banned') && t.notes && /Никогда/i.test(t.notes)) matchesTrait = true;
          if (!matchesTrait) return false;
        }

        if (state.aspectsActive) {
          if (!qualifiesByAspects(t.req, state.aspects)) return false;
        }

        return true;
      });

      document.getElementById('results-count').textContent = `Показано талантов: ${filtered.length} из ${talents.length}`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            Ничего не найдено по заданным параметрам поиска.<br>
            Попробуйте изменить запрос или сбросить фильтры.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(t => {
        let noteHtml = '';
        if (t.notes) {
          if (/Никогда/i.test(t.notes)) {
            noteHtml = `<div class="note-badge-row"><span class="badge-banned">BANNED</span></div>`;
          } else {
            noteHtml = `<div class="note-badge-row"><span class="badge-houserule">HOUSE RULE</span></div>`;
          }
        }

        return `
          <div class="talent-card">
            <div class="card-head">
              <div class="talent-name">${t.name}</div>
              <div class="book-tag-badge">${t.book}</div>
            </div>

            <div class="card-req-row">
              <span class="req-prefix">REQ:</span>
              <span>${t.req || 'None'}</span>
            </div>

            <div class="talent-body">${formatDescription(t.desc)}</div>

            ${noteHtml}
          </div>
        `;
      }).join('');
    }

    // Старт
    document.addEventListener('DOMContentLoaded', () => {
      initBooks();
      initAspects();
      initTraits();

      const drawer = document.getElementById('filter-drawer');
      const toggleBtn = document.getElementById('btn-toggle-filters');
      toggleBtn.addEventListener('click', () => {
        drawer.classList.toggle('open');
        toggleBtn.classList.toggle('active');
      });

      document.getElementById('search-input').addEventListener('input', (e) => {
        state.search = e.target.value;
        render();
      });

      document.getElementById('btn-reset-filters').addEventListener('click', () => {
        state.search = '';
        document.getElementById('search-input').value = '';
        state.books.clear();
        document.querySelectorAll('#books-tags .tag-btn').forEach(b => b.classList.remove('active'));
        state.traits.clear();
        document.querySelectorAll('#traits-tags .tag-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('aspects-reset').click();
        const chkActive = document.getElementById('chk-aspects-active');
        chkActive.checked = false;
        state.aspectsActive = false;
        document.getElementById('aspects-grid').classList.add('disabled');
        render();
      });

      render();
    });
  </script>
</body>
</html>
