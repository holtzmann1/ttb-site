<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Through the Breach — General Talents</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important; /* Строгий викторианский стиль без скруглений */
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #30251b 0%, #17130f 45%, #0b0a09 100%);
      color: #e8dfd0;
      font-family: Georgia, serif;
      font-size: 14.5px;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Верхний хедер как в index.html */
    header {
      padding: 20px 40px;
      border-bottom: 1px solid #4a3825;
      background: rgba(10, 9, 8, 0.85);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(6px);
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo-group {
      display: flex;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo {
      color: #c59a5b;
      font-size: 22px;
      letter-spacing: 3px;
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .logo:hover {
      color: #e8dfd0;
    }

    .sublogo {
      color: #a99e8d;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-left: 1px solid #4a3825;
      padding-left: 14px;
    }

    .badge-count {
      color: #c59a5b;
      font-size: 13px;
      border: 1px solid #4a3825;
      padding: 2px 8px;
      letter-spacing: 1px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-block;
      padding: 9px 18px;
      border: 1px solid #b88a4a;
      background: transparent;
      color: #c59a5b;
      text-decoration: none;
      letter-spacing: 2px;
      font-size: 13px;
      font-family: Georgia, serif;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover, .btn.active {
      background: #b88a4a;
      color: #0b0a09;
    }

    .btn-secondary {
      border-color: #4a3825;
      color: #a99e8d;
    }

    .btn-secondary:hover {
      border-color: #b88a4a;
      color: #c59a5b;
      background: transparent;
    }

    /* Поиск */
    .search-row {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      background: #14110e;
      border: 1px solid #4a3825;
      color: #e8dfd0;
      font-family: Georgia, serif;
      font-size: 15px;
      padding: 11px 16px 11px 42px;
      outline: none;
      letter-spacing: 0.5px;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #b88a4a;
      background: #1a1511;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #c59a5b;
      pointer-events: none;
      font-size: 15px;
    }

    /* Алфавит */
    .alphabet-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .alpha-btn {
      background: #14110e;
      border: 1px solid #382c1e;
      color: #a99e8d;
      font-family: Georgia, serif;
      font-size: 12px;
      letter-spacing: 1px;
      min-width: 30px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }

    .alpha-btn:hover {
      border-color: #b88a4a;
      color: #e8dfd0;
    }

    .alpha-btn.active {
      background: #b88a4a;
      color: #0b0a09;
      border-color: #b88a4a;
      font-weight: bold;
    }

    /* Выдвижная панель фильтров */
    .filter-drawer {
      display: none;
      background: rgba(18, 15, 12, 0.98);
      border-bottom: 1px solid #4a3825;
      padding: 24px 40px;
    }

    .filter-drawer.open {
      display: block;
    }

    .drawer-grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.1fr 1.3fr 1fr;
      gap: 30px;
    }

    .filter-col-title {
      color: #c59a5b;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding-bottom: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid #382c1e;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .toggle-link {
      font-size: 11px;
      color: #a99e8d;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .toggle-link:hover {
      color: #c59a5b;
    }

    /* Теги */
    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-btn {
      background: #14110e;
      border: 1px solid #382c1e;
      color: #a99e8d;
      font-size: 12px;
      font-family: Georgia, serif;
      letter-spacing: 1px;
      padding: 6px 10px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.15s;
      user-select: none;
    }

    .tag-btn:hover {
      border-color: #b88a4a;
      color: #e8dfd0;
    }

    .tag-btn.active {
      background: #3a2b1a;
      border-color: #b88a4a;
      color: #c59a5b;
    }

    /* Аспекты */
    .aspects-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .aspect-card {
      background: #14110e;
      border: 1px solid #382c1e;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .aspect-name {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #a99e8d;
      text-transform: uppercase;
    }

    .aspect-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .step-btn {
      background: #201a14;
      border: 1px solid #4a3825;
      color: #c59a5b;
      width: 22px;
      height: 22px;
      font-family: Georgia, serif;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      line-height: 1;
      transition: all 0.15s;
    }

    .step-btn:hover {
      background: #b88a4a;
      color: #0b0a09;
      border-color: #b88a4a;
    }

    .aspect-val {
      font-size: 14px;
      font-weight: bold;
      color: #e8dfd0;
      min-width: 20px;
      text-align: center;
    }

    .strict-toggle {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #a99e8d;
      cursor: pointer;
      user-select: none;
    }

    .strict-toggle input {
      accent-color: #b88a4a;
      cursor: pointer;
      width: 15px;
      height: 15px;
    }

    /* Основная зона контента */
    main {
      max-width: 1400px;
      margin: 25px auto;
      padding: 0 40px;
      width: 100%;
      flex-grow: 1;
    }

    .catalog-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 20px;
      border-bottom: 1px solid #382c1e;
      color: #a99e8d;
      font-size: 13.5px;
      letter-spacing: 1px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(390px, 1fr));
      gap: 20px;
    }

    /* Карточка таланта */
    .talent-card {
      background: rgba(22, 18, 14, 0.7);
      border: 1px solid #4a3825;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s, opacity 0.2s;
    }

    .talent-card:hover {
      border-color: #b88a4a;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .talent-card.dimmed {
      opacity: 0.38;
      border-color: #2b2117;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      border-bottom: 1px solid #2d2318;
      padding-bottom: 10px;
    }

    .talent-title {
      font-size: 18px;
      color: #c59a5b;
      letter-spacing: 1px;
      line-height: 1.25;
    }

    .book-label {
      font-size: 11px;
      color: #a99e8d;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border: 1px solid #382c1e;
      padding: 3px 8px;
      white-space: nowrap;
      background: #120f0c;
    }

    .card-req {
      background: #14110e;
      border-left: 2px solid #b88a4a;
      padding: 6px 12px;
      font-size: 13px;
      color: #dcd3c4;
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .req-title {
      font-size: 11px;
      color: #c59a5b;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .talent-desc {
      color: #dcd3c4;
      font-size: 14.5px;
      line-height: 1.65;
      white-space: pre-line;
      flex-grow: 1;
    }

    /* Масти Malifaux: перья зеленые, тома синие, маски фиолетовые, бараны красные */
    .suit {
      font-weight: bold;
      letter-spacing: 0.5px;
      display: inline-block;
    }
    .suit-rams { color: #f85149; }
    .suit-crows { color: #3fb950; }
    .suit-tomes { color: #58a6ff; }
    .suit-masks { color: #bc8cff; }

    .talent-notes {
      font-size: 12px;
      padding: 4px 10px;
      background: #231910;
      border: 1px solid #633f1f;
      color: #d99b66;
      letter-spacing: 0.5px;
      align-self: flex-start;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid #2d2318;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .status-ok {
      color: #3fb950;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .status-fail {
      color: #e06c75;
      letter-spacing: 0.5px;
    }

    .empty-catalog {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: #a99e8d;
      font-size: 17px;
      font-style: italic;
      letter-spacing: 1px;
    }

    @media (max-width: 900px) {
      header, .filter-drawer, main {
        padding-left: 20px;
        padding-right: 20px;
      }
      .drawer-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .aspects-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .cards-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- ШАПКА В ЕДИНОМ СТИЛЕ САЙТА -->
  <header>
    <div class="header-inner">
      <div class="header-top">
        <div class="logo-group">
          <a href="index.html" class="logo">THROUGH THE BREACH</a>
          <span class="sublogo">General Talents</span>
          <span class="badge-count" id="count-badge">0</span>
        </div>
        <div class="header-controls">
          <a href="index.html" class="btn btn-secondary">← НА ГЛАВНУЮ</a>
          <button class="btn" id="btn-toggle-filters">ФИЛЬТРЫ И АСПЕКТЫ</button>
          <button class="btn btn-secondary" id="btn-reset">СБРОС</button>
        </div>
      </div>

      <!-- Поисковая строка -->
      <div class="search-row">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" class="search-input" placeholder="Поиск по названию, тексту или условию (например: Grapple, Charge, Invested)...">
      </div>

      <!-- Алфавитная полоса -->
      <div class="alphabet-bar" id="alphabet-bar"></div>
    </div>

    <!-- ВЫДВИЖНАЯ ПАНЕЛЬ ФИЛЬТРОВ -->
    <div class="filter-drawer" id="filter-drawer">
      <div class="drawer-grid">
        
        <!-- Книги -->
        <div>
          <div class="filter-col-title">
            <span>BOOKS</span>
            <span class="toggle-link" id="books-toggle-all">All / None</span>
          </div>
          <div class="tags-container" id="books-tags"></div>
        </div>

        <!-- Аспекты персонажа -->
        <div>
          <div class="filter-col-title">
            <span>ASPECTS</span>
            <span class="toggle-link" id="aspects-reset">Reset</span>
          </div>
          <div class="aspects-grid" id="aspects-grid"></div>
          <label class="strict-toggle">
            <input type="checkbox" id="chk-strict">
            <span>Скрывать недоступные по статам</span>
          </label>
        </div>

        <!-- Происхождение / Категории (чистый оригинал без скобок) -->
        <div>
          <div class="filter-col-title">
            <span>TRAITS & ORIGIN</span>
          </div>
          <div class="tags-container" id="traits-tags">
            <button class="tag-btn" data-trait="Invested">INVESTED</button>
            <button class="tag-btn" data-trait="Kin">KIN</button>
            <button class="tag-btn" data-trait="Stitched">STITCHED</button>
            <button class="tag-btn" data-trait="Guild">GUILD</button>
            <button class="tag-btn" data-trait="Destiny">DESTINY</button>
            <button class="tag-btn" data-trait="House Rules">HOUSE RULES</button>
          </div>
        </div>

      </div>
    </div>
  </header>

  <!-- КАТАЛОГ ТАЛАНТОВ -->
  <main>
    <div class="catalog-meta">
      <span id="results-count">Показано талантов: 0</span>
      <span id="catalog-status"></span>
    </div>

    <div class="cards-grid" id="cards-container"></div>
  </main>

  <!-- БАЗА ДАННЫХ ТАЛАНТОВ -->
  <script src="talents-data.js"></script>

  <script>
    // Страховка от незагрузки
    const talents = (typeof GENERAL_TALENTS !== 'undefined') ? GENERAL_TALENTS : [];

    const state = {
      search: '',
      alpha: 'ALL',
      books: new Set(),
      aspects: {
        Might: 0,
        Grace: 0,
        Speed: 0,
        Resilience: 0,
        Intellect: 0,
        Charm: 0,
        Cunning: 0,
        Tenacity: 0
      },
      strict: false,
      traits: new Set()
    };

    // 1. Инициализация алфавита
    function initAlphabet() {
      const container = document.getElementById('alphabet-bar');
      const letters = ['ALL', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')];
      container.innerHTML = letters.map(c => `
        <button class="alpha-btn ${c === 'ALL' ? 'active' : ''}" data-char="${c}">
          ${c === 'ALL' ? 'ALL' : c}
        </button>
      `).join('');

      container.querySelectorAll('.alpha-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          container.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.alpha = btn.dataset.char;
          renderCatalog();
        });
      });
    }

    // 2. Инициализация книг
    function initBooks() {
      const container = document.getElementById('books-tags');
      const allBooks = Array.from(new Set(talents.map(t => t.book).filter(Boolean))).sort();
      container.innerHTML = allBooks.map(book => `
        <button class="tag-btn" data-book="${book}">${book}</button>
      `).join('');

      container.querySelectorAll('.tag-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const b = btn.dataset.book;
          if (state.books.has(b)) {
            state.books.delete(b);
            btn.classList.remove('active');
          } else {
            state.books.add(b);
            btn.classList.add('active');
          }
          renderCatalog();
        });
      });

      document.getElementById('books-toggle-all').addEventListener('click', () => {
        if (state.books.size === allBooks.length) {
          state.books.clear();
          container.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        } else {
          allBooks.forEach(b => state.books.add(b));
          container.querySelectorAll('.tag-btn').forEach(b => b.classList.add('active'));
        }
        renderCatalog();
      });
    }

    // 3. Инициализация аспектов
    function initAspects() {
      const container = document.getElementById('aspects-grid');
      const aspectList = ['Might', 'Grace', 'Speed', 'Resilience', 'Intellect', 'Charm', 'Cunning', 'Tenacity'];
      
      container.innerHTML = aspectList.map(asp => `
        <div class="aspect-card">
          <span class="aspect-name">${asp}</span>
          <div class="aspect-controls">
            <button class="step-btn" data-asp="${asp}" data-delta="-1">−</button>
            <span class="aspect-val" id="val-${asp}">0</span>
            <button class="step-btn" data-asp="${asp}" data-delta="1">+</button>
          </div>
        </div>
      `).join('');

      container.querySelectorAll('.step-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const asp = btn.dataset.asp;
          const delta = parseInt(btn.dataset.delta, 10);
          state.aspects[asp] = Math.max(-5, Math.min(5, state.aspects[asp] + delta));
          document.getElementById(`val-${asp}`).textContent = (state.aspects[asp] > 0 ? '+' : '') + state.aspects[asp];
          renderCatalog();
        });
      });

      document.getElementById('aspects-reset').addEventListener('click', () => {
        aspectList.forEach(asp => {
          state.aspects[asp] = 0;
          document.getElementById(`val-${asp}`).textContent = '0';
        });
        renderCatalog();
      });

      document.getElementById('chk-strict').addEventListener('change', (e) => {
        state.strict = e.target.checked;
        renderCatalog();
      });
    }

    // 4. Инициализация тегов происхождения
    function initTraits() {
      const container = document.getElementById('traits-tags');
      container.querySelectorAll('.tag-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const trait = btn.dataset.trait;
          if (state.traits.has(trait)) {
            state.traits.delete(trait);
            btn.classList.remove('active');
          } else {
            state.traits.add(trait);
            btn.classList.add('active');
          }
          renderCatalog();
        });
      });
    }

    // Проверка требований
    function checkRequirements(reqStr, charAspects) {
      if (!reqStr || reqStr === 'None') return { ok: true, failed: [] };

      const failed = [];
      const parts = reqStr.split(',').map(s => s.trim());

      for (const p of parts) {
        const aspMatch = p.match(/Aspect:\s*([A-Za-z]+)\s*(-?\d+)\s*(or higher|or lower|\+)?/i);
        if (aspMatch) {
          const asp = aspMatch[1];
          const needed = parseInt(aspMatch[2], 10);
          const isLower = /lower|less/i.test(p);
          const current = charAspects[asp] !== undefined ? charAspects[asp] : 0;

          if (isLower && current > needed) {
            failed.push(`${asp} ≤ ${needed} (now ${current})`);
          } else if (!isLower && current < needed) {
            failed.push(`${asp} ≥ ${needed} (now ${current})`);
          }
        }
      }

      return { ok: failed.length === 0, failed };
    }

    // Форматирование мастей по канону цветов
    function formatText(desc) {
      if (!desc) return '';
      return desc
        .replace(/\[когти\]/gi, '⚔️')
        .replace(/RAMS/g, '<span class="suit suit-rams">🐏 RAMS</span>')
        .replace(/CROWS/g, '<span class="suit suit-crows">🦅 CROWS</span>')
        .replace(/TOMES/g, '<span class="suit suit-tomes">📖 TOMES</span>')
        .replace(/MASKS/g, '<span class="suit suit-masks">🎭 MASKS</span>');
    }

    // Рендер каталога
    function renderCatalog() {
      const container = document.getElementById('cards-container');
      const searchTerms = state.search.toLowerCase().trim().split(/\s+/).filter(Boolean);

      const filtered = talents.filter(t => {
        // Поиск
        if (searchTerms.length > 0) {
          const hay = `${t.name} ${t.desc} ${t.req} ${t.book} ${t.notes || ''}`.toLowerCase();
          if (!searchTerms.every(term => hay.includes(term))) return false;
        }

        // Алфавит
        if (state.alpha !== 'ALL') {
          if (!t.name.toUpperCase().startsWith(state.alpha)) return false;
        }

        // Книги
        if (state.books.size > 0 && !state.books.has(t.book)) return false;

        // Теги
        if (state.traits.size > 0) {
          let hasMatch = false;
          if (state.traits.has('Invested') && /Invested/i.test(t.req)) hasMatch = true;
          if (state.traits.has('Kin') && /Kin/i.test(t.req)) hasMatch = true;
          if (state.traits.has('Stitched') && /Stitched/i.test(t.req)) hasMatch = true;
          if (state.traits.has('Guild') && /Guild/i.test(t.req)) hasMatch = true;
          if (state.traits.has('Destiny') && /Destiny/i.test(t.req)) hasMatch = true;
          if (state.traits.has('House Rules') && t.notes && t.notes.trim()) hasMatch = true;
          if (!hasMatch) return false;
        }

        // Строгий режим
        if (state.strict) {
          const reqCheck = checkRequirements(t.req, state.aspects);
          if (!reqCheck.ok) return false;
        }

        return true;
      });

      // Бейджи и счетчик
      document.getElementById('count-badge').textContent = filtered.length;
      document.getElementById('results-count').textContent = `Показано талантов: ${filtered.length} из ${talents.length}`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-catalog">
            Ничего не найдено по заданным критериям.<br>
            Попробуйте изменить запрос или сбросить фильтры.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(t => {
        const reqCheck = checkRequirements(t.req, state.aspects);
        const isDimmed = !reqCheck.ok && !state.strict;

        return `
          <div class="talent-card ${isDimmed ? 'dimmed' : ''}">
            <div class="card-header">
              <div class="talent-title">${t.name}</div>
              <div class="book-label">${t.book}</div>
            </div>

            <div class="card-req">
              <span class="req-title">REQ:</span>
              <span>${t.req || 'None'}</span>
            </div>

            <div class="talent-desc">${formatText(t.desc)}</div>

            ${t.notes ? `<div class="talent-notes">${t.notes}</div>` : ''}

            <div class="card-footer">
              <div class="${reqCheck.ok ? 'status-ok' : 'status-fail'}">
                ${reqCheck.ok ? '✓ Доступно' : '✗ ' + reqCheck.failed.join(', ')}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Инициализация при загрузке
    document.addEventListener('DOMContentLoaded', () => {
      initAlphabet();
      initBooks();
      initAspects();
      initTraits();

      // Открытие шторки
      const drawer = document.getElementById('filter-drawer');
      const toggleBtn = document.getElementById('btn-toggle-filters');
      toggleBtn.addEventListener('click', () => {
        drawer.classList.toggle('open');
        toggleBtn.classList.toggle('active');
      });

      // Поиск
      document.getElementById('search-input').addEventListener('input', (e) => {
        state.search = e.target.value;
        renderCatalog();
      });

      // Сброс всего
      document.getElementById('btn-reset').addEventListener('click', () => {
        state.search = '';
        document.getElementById('search-input').value = '';
        state.alpha = 'ALL';
        document.querySelectorAll('.alpha-btn').forEach(b => b.classList.toggle('active', b.dataset.char === 'ALL'));
        state.books.clear();
        document.querySelectorAll('#books-tags .tag-btn').forEach(b => b.classList.remove('active'));
        state.traits.clear();
        document.querySelectorAll('#traits-tags .tag-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('aspects-reset').click();
        document.getElementById('chk-strict').checked = false;
        state.strict = false;
        renderCatalog();
      });

      renderCatalog();
    });
  </script>
</body>
</html>
