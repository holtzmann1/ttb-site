<!DOCTYPE html>
<html lang="ru">
<head>

    <title>Очередная Ролевка Марселя</title>

    <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(circle at 50% 20%, #30251b 0%, #17130f 45%, #0b0a09 100%);

    font-family: Georgia, serif;
}

header {
    padding: 28px 50px;

    background: rgba(10, 9, 8, 0.7);
}

.logo {

    color: #c59a5b;

}

    margin: 0;

    font-size: 56px;

    letter-spacing: 2px;
}

.line {
    width: 120px;
    height: 2px;

    margin: 30px auto;

    background: #b88a4a;
}

p {
    color: #a99e8d;
    font-size: 18px;
    letter-spacing: 1px;
}
        .button {
    display: inline-block;
    margin-top: 30px;
    padding: 12px 24px;

    border: 1px solid #b88a4a;

    color: #c59a5b;
    text-decoration: none;

    letter-spacing: 2px;
    font-size: 14px;
}

.button:hover {
    background: #b88a4a;
    color: #0b0a09;
}

</head>

<body>

<a href="characters.html" class="button">ПЕРСОНАЖИ</a>

</html>
