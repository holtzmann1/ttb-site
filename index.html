<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Очередная Ролевка Марселя — Through the Breach</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            /* Фоновый арт Гильдии с градиентным затемнением под Rulebook Folio */
            background: 
                linear-gradient(180deg, rgba(14, 11, 9, 0.72) 0%, rgba(14, 11, 9, 0.88) 100%),
                radial-gradient(circle at 75% 35%, rgba(0, 0, 0, 0.1) 0%, rgba(14, 11, 9, 0.85) 75%),
                url('bg-guild.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #dfd4c4;
            font-family: Georgia, 'Times New Roman', serif;
            display: flex;
            flex-direction: column;
        }

        /* Шапка в стиле книжного переплета */
        header {
            padding: 20px 48px;
            border-bottom: 2px solid #3d2d1e;
            background: rgba(18, 15, 12, 0.92);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.85);
        }

        .logo {
            color: #c7a877;
            font-size: 20px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 40px 24px;
            width: 100%;
        }

        /* Карточка-фолиант с фирменными викторианскими засечками */
        .welcome-card {
            background: rgba(22, 17, 13, 0.88);
            border: 1px solid #4a3827;
            box-shadow: 
                inset 0 0 0 3px #18130f,
                inset 0 0 0 4px #3d2d1e,
                0 16px 40px rgba(0, 0, 0, 0.9);
            padding: 56px 40px;
            text-align: center;
            position: relative;
            backdrop-filter: blur(4px);
        }

        .welcome-card::before,
        .welcome-card::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            border-color: #8c714b;
            pointer-events: none;
        }

        .welcome-card::before {
            top: 7px;
            left: 7px;
            border-top: 1px solid #8c714b;
            border-left: 1px solid #8c714b;
        }

        .welcome-card::after {
            bottom: 7px;
            right: 7px;
            border-bottom: 1px solid #8c714b;
            border-right: 1px solid #8c714b;
        }

        h1 {
            color: #c7a877;
            font-size: 38px;
            font-weight: normal;
            letter-spacing: 2px;
            line-height: 1.25;
            text-transform: uppercase;
        }

        .line {
            width: 90px;
            height: 1px;
            margin: 24px auto;
            background: #8c714b;
        }

        p {
            color: #9c9183;
            font-size: 16px;
            letter-spacing: 1px;
            font-style: italic;
            margin-bottom: 36px;
        }

        .buttons-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        /* Кнопки в стиле Rulebook Folio */
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 22px;
            background: #241c16;
            border: 1px solid #6b5239;
            color: #cbbca9;
            text-decoration: none;
            letter-spacing: 1.8px;
            font-size: 12px;
            text-transform: uppercase;
            font-family: Georgia, serif;
            transition: all 0.2s ease;
        }

        .button:hover {
            background: #36291e;
            border-color: #a8885a;
            color: #f2ece2;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.7);
        }

        .button-primary {
            border-color: #8c714b;
            color: #dfd4c4;
            background: #2b2119;
        }

        .button-primary:hover {
            background: #3d2f23;
            border-color: #c7a877;
            color: #fff;
        }

        @media (max-width: 650px) {
            header {
                padding: 16px 20px;
            }
            .welcome-card {
                padding: 36px 20px;
            }
            h1 {
                font-size: 28px;
            }
            .buttons-group {
                flex-direction: column;
            }
            .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            THROUGH THE BREACH
        </div>
    </header>

    <main>
        <div class="welcome-card">
            <h1>Очередная Ролевка Марселя</h1>

            <div class="line"></div>

            <p>Он действовал наверняка.</p>

            <div class="buttons-group">
                <a href="campaign.html" class="button button-primary">КОМПАНИЯ ИССЛЕДОВАТЕЛЕЙ</a>
                <a href="talents-page.html" class="button">КАТАЛОГ ТАЛАНТОВ</a>
                <a href="character-editor.html" class="button">РЕДАКТОР ПЕРСОНАЖА</a>
                <a href="characters.html" class="button">ПЕРСОНАЖИ(в разработке)</a>
            </div>
        </div>
    </main>

</body>
</html>
