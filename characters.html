<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Персонажи — Очередная Ролевка Марселя</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(circle at 50% 20%, #30251b 0%, #17130f 45%, #0b0a09 100%);

            color: #e8dfd0;
            font-family: Georgia, serif;
        }

        header {
            padding: 28px 50px;

            border-bottom: 1px solid #4a3825;

            background: rgba(10, 9, 8, 0.7);
        }

        .logo {
            color: #c59a5b;

            font-size: 24px;
            letter-spacing: 3px;
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 80px 30px;
        }

        h1 {
            margin: 0;
            text-align: center;

            font-size: 48px;
            font-weight: normal;
        }

        .line {
            width: 120px;
            height: 2px;

            margin: 25px auto 60px;

            background: #b88a4a;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;

            margin-bottom: 50px;
        }

        .menu button {
            padding: 15px 35px;

            border: 1px solid #b88a4a;

            background: transparent;

            color: #c59a5b;

            font-family: Georgia, serif;
            font-size: 16px;
            letter-spacing: 2px;

            cursor: pointer;
        }

        .menu button:hover {
            background: #b88a4a;
            color: #0b0a09;
        }

        .section {
            display: none;

            padding: 30px;

            border: 1px solid #4a3825;

            background: rgba(10, 9, 8, 0.5);
        }

        .section.active {
            display: block;
        }

        h2 {
            margin-top: 0;

            color: #c59a5b;

            font-size: 30px;
            font-weight: normal;
        }

        .company {
            margin-top: 20px;
            padding: 20px;

            border: 1px solid #4a3825;

            cursor: pointer;
        }

        .company:hover {
            background: rgba(184, 138, 74, 0.1);
        }

        .company h3 {
            margin: 0;

            color: #e8dfd0;
            font-size: 22px;
            font-weight: normal;
        }
        .characters {
    display: none;

    margin-top: 20px;
    padding-top: 15px;

    border-top: 1px solid #4a3825;
}

.characters p {
    margin: 10px 0;

    color: #a99e8d;
}

        .empty {
            color: #8f8679;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            THROUGH THE BREACH
        </div>
    </header>

    <main>

        <h1>Персонажи</h1>

        <div class="line"></div>

        <div class="menu">

            <button onclick="showSection('fated')">
                FATED
            </button>

            <button onclick="showSection('npc')">
                NPC
            </button>

        </div>


        <section id="fated" class="section">

            <h2>Fated</h2>

            <div class="company" onclick="showCharacters('company1')">

    <h3>Компания 1</h3>

    <div id="company1" class="characters">

        <p>Марсель</p>
        <p>Персонаж 2</p>
        <p>Персонаж 3</p>

    </div>

</div>

            <div class="company">
                <h3>Компания 2</h3>
            </div>

            <div class="company">
                <h3>Компания 3</h3>
            </div>

            <p class="empty">
                Названия компаний пока временные.
            </p>

        </section>


        <section id="npc" class="section">

            <h2>NPC</h2>

            <p class="empty">
                Здесь будет общий список NPC.
            </p>

        </section>

    </main>


    <script>

        function showSection(sectionName) {

            document.getElementById('fated').classList.remove('active');

            document.getElementById('npc').classList.remove('active');

            document.getElementById(sectionName).classList.add('active');

        }
        function showCharacters(companyName) {

    const characters = document.getElementById(companyName);

    if (characters.style.display === 'block') {
        characters.style.display = 'none';
    } else {
        characters.style.display = 'block';
    }

}

    </script>

</body>
</html>
