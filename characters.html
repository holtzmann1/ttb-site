<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Персонажи — Очередная Ролевка Марселя</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(circle at 50% 20%, #30251b 0%, #17130f 45%, #0b0a09 100%);

            color: #e8dfd0;
            font-family: Georgia, serif;
        }

        header {
            padding: 28px 50px;

            border-bottom: 1px solid #4a3825;

            background: rgba(10, 9, 8, 0.7);
        }

        .logo {
            color: #c59a5b;

            font-size: 24px;
            letter-spacing: 3px;
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 80px 30px;
        }

        h1 {
            margin: 0;
            text-align: center;

            font-size: 48px;
            font-weight: normal;
        }

        .line {
            width: 120px;
            height: 2px;

            margin: 25px auto 70px;

            background: #b88a4a;
        }

        .category {
            margin-bottom: 60px;
        }

        h2 {
            margin-bottom: 25px;

            color: #c59a5b;

            font-size: 30px;
            font-weight: normal;
        }

        .character-list {
            padding: 25px;

            border: 1px solid #4a3825;

            background: rgba(10, 9, 8, 0.5);
        }

        .empty {
            margin: 0;

            color: #8f8679;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            THROUGH THE BREACH
        </div>
    </header>

    <main>

        <h1>Персонажи</h1>

        <div class="line"></div>

        <section class="category">

            <h2>Fated Персонажи</h2>

            <div class="character-list">
                <p class="empty">
                    Здесь пока нет персонажей.
                </p>
            </div>

        </section>

        <section class="category">

            <h2>NPC Персонажи</h2>

            <div class="character-list">
                <p class="empty">
                    Здесь пока нет персонажей.
                </p>
            </div>

        </section>

    </main>

</body>
</html>
